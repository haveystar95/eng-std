# Processed by nginx's envsubst template step at container start: ${BACKEND_ORIGIN}
# is substituted from the environment. nginx runtime vars use $x (no braces) and are
# left untouched.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy the admin API to the backend so the SPA calls it SAME-ORIGIN
  # (/admin/api/*) and there is no CORS at all. BACKEND_ORIGIN points at the backend
  # (compose: http://wt_app:8000; standalone docker run: http://host.docker.internal:8001).
  location /admin/api/ {
    proxy_pass ${BACKEND_ORIGIN};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Never cache the runtime config or the entry HTML — they change per deploy/env.
  location = /config.js {
    add_header Cache-Control "no-store";
  }
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Fingerprinted assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}

services:
  app:
    build: .
    container_name: wt_app
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  # Horizon queue worker (AI generation is async).
  horizon:
    build: .
    container_name: wt_horizon
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: php artisan horizon

  # Public tunnel to the app, on the account's reserved static domain (same one the
  # mobile app defaults to). Free plan = one tunnel: don't run the old backend's ngrok
  # at the same time. Inspector at http://localhost:4041.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: wt_ngrok
    command: http --url=https://greedily-thermos-finer.ngrok-free.dev app:8000 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4041:4040"
    depends_on:
      - app

  db:
    image: pgvector/pgvector:pg17
    container_name: wt_db
    environment:
      POSTGRES_DB: wordtrainer
      POSTGRES_USER: wordtrainer
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - wt_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wt_redis

  # Read-only admin console (Vue SPA served by nginx). Source lives at repo-root
  # ../wt_admin. nginx reverse-proxies /admin/api → the backend (BACKEND_ORIGIN), so the
  # SPA calls the API SAME-ORIGIN and there is no CORS. Open http://localhost:5175 and
  # log in with an admin account (php artisan admin:create). Set ADMIN_USE_MOCKS=true to
  # run standalone on built-in demo data instead of the live backend.
  admin:
    build:
      context: ../wt_admin
    container_name: wt_admin
    ports:
      - "5175:80"
    environment:
      API_BASE: ${ADMIN_API_BASE:-}
      USE_MOCKS: ${ADMIN_USE_MOCKS:-false}
      BACKEND_ORIGIN: ${ADMIN_BACKEND_ORIGIN:-http://wt_app:8000}
    depends_on:
      - app

volumes:
  wt_pgdata:

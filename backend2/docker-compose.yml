services:
  app:
    build: .
    container_name: wt_app
    ports:
      - "8001:8000"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  # Horizon queue worker (AI generation is async).
  horizon:
    build: .
    container_name: wt_horizon
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: php artisan horizon

  db:
    image: pgvector/pgvector:pg17
    container_name: wt_db
    environment:
      POSTGRES_DB: wordtrainer
      POSTGRES_USER: wordtrainer
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - wt_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wt_redis

volumes:
  wt_pgdata:

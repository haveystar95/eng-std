services:
  app:
    build: .
    container_name: wt_app
    # Порт наружу держит `web` (nginx): :8001 и ngrok идут через него. Laravel напрямую — только
    # внутри сети compose (web, admin). Картинкам сцен не нужен ни PHP, ни лимитер API.
    expose:
      - "8000"
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  # Horizon queue worker (AI generation is async).
  horizon:
    build: .
    container_name: wt_horizon
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: php artisan horizon

  # The scheduler (routes/console.php): plan:notify-tick every 15 minutes (PLAN-UI-3). Same image and
  # volume as horizon; the letters it decides on are queued and sent by horizon. Like horizon it
  # answers from memory — restart it after touching the tick or anything it calls.
  scheduler:
    build: .
    container_name: wt_scheduler
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis
    command: php artisan schedule:work

  # Входная дверь (доработка PLAN-UI-3): статика копий фото сцен с вечным кэшем мимо Laravel и его
  # лимитера, всё остальное — прокси в app. Конфиг — docker/nginx/default.conf.
  web:
    image: nginx:1.27-alpine
    container_name: wt_web
    ports:
      - "8001:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/app/private/plan-images:/srv/plan-images:ro
    depends_on:
      - app

  # Public tunnel to the app, on the account's reserved static domain (same one the
  # mobile app defaults to). Free plan = one tunnel: don't run the old backend's ngrok
  # at the same time. Inspector at http://localhost:4041.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: wt_ngrok
    command: http --url=https://greedily-thermos-finer.ngrok-free.dev web:80 --log=stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4041:4040"
    depends_on:
      - web

  db:
    image: pgvector/pgvector:pg17
    container_name: wt_db
    environment:
      POSTGRES_DB: wordtrainer
      POSTGRES_USER: wordtrainer
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - wt_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wt_redis

  # Read-only admin console (Vue SPA served by nginx). Source lives at repo-root
  # ../wt_admin. nginx reverse-proxies /admin/api → the backend (BACKEND_ORIGIN), so the
  # SPA calls the API SAME-ORIGIN and there is no CORS. Open http://localhost:5175 and
  # log in with an admin account (php artisan admin:create). Set ADMIN_USE_MOCKS=true to
  # run standalone on built-in demo data instead of the live backend.
  admin:
    build:
      context: ../wt_admin
    container_name: wt_admin
    ports:
      - "5175:80"
    environment:
      API_BASE: ${ADMIN_API_BASE:-}
      USE_MOCKS: ${ADMIN_USE_MOCKS:-false}
      BACKEND_ORIGIN: ${ADMIN_BACKEND_ORIGIN:-http://wt_app:8000}
    depends_on:
      - app

volumes:
  wt_pgdata:

openapi: 3.1.0
info:
  title: WordTrainer API
  version: 0.1.0
  description: >
    Backend2 API for the WordTrainer mobile app. Base path `/api/v1`, Sanctum bearer
    tokens, JSON, snake_case. This file is the contract — the Dart client is generated
    from it, so an endpoint not described here effectively does not exist.
    Errors are RFC 7807 `application/problem+json` with a stable machine `code`, except
    input validation which uses Laravel's 422 `{message, errors}` shape.

servers:
  - url: https://api.wordtrainer.app/api/v1
    description: Production (placeholder)
  - url: http://localhost:8001/api/v1
    description: Local (docker)

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Collections
  - name: Study
  - name: Generation
  - name: Search
  - name: Plans
  - name: Devices

paths:
  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in with a Google ID token
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguageNative'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
                device_name: { type: string, maxLength: 100 }
                timezone: { type: string, description: "Device IANA timezone (e.g. Europe/Kyiv). On first sign-in it seeds profiles.timezone so calendar-day due rounding (F19) works before the first PUT /profile. Refreshed on later logins; validated as an IANA zone." }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '422':
          $ref: '#/components/responses/Problem'

  /auth/dev:
    post:
      tags: [Auth]
      summary: "QA sign-in by email (NON-PRODUCTION ONLY — not part of the shipped surface)"
      description: >
        Password-less sign-in for QA runs, documented here so the contract is complete rather than
        because a client should call it: only the debug build's «Dev login» button does.
        The route is not registered at all unless the environment is non-production AND
        DEV_LOGIN_ENABLED is set (App\Modules\Identity\Domain\Service\DevLoginGate), and the
        handler asks the same question again per request. It can only enter or create an account
        marked `users.is_qa`; an address belonging to a real account is refused with 403
        `not_a_qa_account`. A shut gate answers 404, not 403 — a closed door does not admit it is
        a door.
      security: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguageNative'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, description: "The QA address; created as an is_qa account if it does not exist." }
                device_name: { type: string, maxLength: 100 }
                timezone: { type: string, description: "Device IANA timezone, seeded on the profile exactly as at Google sign-in." }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '403':
          description: The address belongs to an account that is not marked is_qa
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: The gate is shut (production, or DEV_LOGIN_ENABLED off)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/Problem'

  /auth/me:
    get:
      tags: [Auth]
      summary: The authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Delete the account and all of the user's data (App Store requirement)
      description: >
        Irreversible (наряд ACC-1 §1). Cascades across every module in one transaction — the plans with
        everything on them (days, cards, answers, talks and their lines, walked stages, returns, the
        journal and the letters) and their files (the voice of scenes and talks, the photo copies — deleted
        once the transaction has committed), collections and the pool (progress, reviews, triages,
        exposures, sessions, stats), subscriptions, generations, practice dialogs and their transcripts,
        the profile, push addresses, visits, access rights — and revokes every token. What stays, unlinked:
        the global terms (authorship nulled), the request log (the user and the bodies and headers of the
        user's own rows nulled), the admin audit (its target nulled), the model call journal (it names no
        user). One row of `account_deletions` counts it: an HMAC of the id, the moment, how many plans.
        A repeat with the same token is 401 (the token is gone with the account); a repeat that passed the
        door before the first deletion committed is 404 `account_not_found`.
      responses:
        '204': { description: Account deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current device token
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /profile:
    put:
      tags: [Auth]
      summary: Update learning preferences
      requestBody:
        $ref: '#/components/requestBodies/ProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Auth]
      summary: Update learning preferences (the same partial update as PUT)
      description: >-
        One action under two verbs (наряд LANG-1 §7): the order names PATCH, build (21) on the phone sends
        PUT. Both are partial — a field left out is left alone.
      requestBody:
        $ref: '#/components/requestBodies/ProfileUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /devices/push-token:
    put:
      tags: [Devices]
      summary: Register this device's push address
      description: >
        Upsert keyed by (platform, token). A token already registered under another account MOVES to
        the caller (one phone, one learner's letters). Send it after sign-in and whenever iOS hands out
        a new token. Plan notifications are delivered to every address of the learner; while the server
        has no APNs key they are logged as not_sent (docs/plan-api.md, «События и уведомления»).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios] }
                token: { type: string, minLength: 1, maxLength: 255, description: APNs device token (hex). }
                locale: { type: [string, 'null'], maxLength: 35, description: "Device locale, e.g. ru-UA." }
                timezone: { type: [string, 'null'], description: "Device IANA timezone; validated like PUT /profile." }
      responses:
        '200':
          description: >
            Registered. `push_enabled` says whether the server will actually deliver plan letters to
            this address: an APNs key is configured AND the token is stored. true — the phone removes
            its local reminders (the server sends them); false — the phone keeps scheduling them.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [push_enabled]
                    properties:
                      push_enabled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Devices]
      summary: Forget this device's push address (sign-out)
      description: Removes the caller's own row for (platform, token); a token held by another account is left alone. Always 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: { type: string, enum: [ios] }
                token: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '204': { description: Removed (or was not there) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /devices/visit:
    post:
      tags: [Devices]
      summary: Say «I'm here» (app came to the foreground)
      description: >
        Append-only visit log. A visit less than 30 minutes after the previous recorded one writes
        nothing (still 204). The server aims the daily plan reminder at the median of the last seven
        visits, read in profiles.timezone and rounded down to the quarter hour (19:00 with no visits).
        `timezone` is accepted and validated but not stored — keep the zone current through PUT /profile.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timezone: { type: [string, 'null'], description: Device IANA timezone. }
      responses:
        '204': { description: Recorded or throttled }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /generations:
    post:
      tags: [Generation]
      summary: Request an AI-generated collection (async)
      description: >
        Returns 202 with a pending request; poll GET /generations/{id} until succeeded|failed.
        Accepts an optional client-generated `id` (ULID) for offline idempotency: re-sending the same
        id returns the existing request with 200 (no new job, no quota spent) instead of 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                id: { type: string, minLength: 26, maxLength: 26, description: Client-generated ULID for idempotent retries. }
                prompt: { type: string, minLength: 2, maxLength: 500 }
                levels:
                  type: array
                  items: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
                size: { type: integer, minimum: 8, maximum: 25 }
                source_lang: { type: string, minLength: 2, maxLength: 5 }
                target_lang:
                  type: string
                  minLength: 2
                  maxLength: 5
                  description: >
                    Optional. When omitted, the server uses the caller's default learning language
                    (profiles.target_language, as returned in /auth/me), then English if unset.
      responses:
        '202':
          description: Accepted — a new pending request was created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GenerationRequest' }
        '200':
          description: The request already existed for this client id (idempotent repeat)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GenerationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The client id is already in use by another user (code `generation_id_conflict`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Daily generation quota reached (code `generation_quota_exceeded`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /generations/{id}:
    get:
      tags: [Generation]
      summary: Poll a generation request (owner only)
      parameters:
        - $ref: '#/components/parameters/UlidId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GenerationRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found (or not the owner) }

  /terms/{id}/regenerate-example:
    post:
      tags: [Generation]
      summary: Generate a fresh example for a term ("New example")
      description: >
        The LLM produces a new example (different from the current one) and its translation, which
        replace the term's stored example. Counts as one generation against the daily quota (429 when
        exhausted). Returns the new example so the client can update the card in place.
      parameters:
        - $ref: '#/components/parameters/UlidId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      example: { type: string }
                      example_translation: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Unknown term }
        '429': { $ref: '#/components/responses/Problem' }

  /practice/dialogs:
    post:
      tags: [Practice]
      summary: Start a realtime conversation-practice dialog (premium)
      description: >
        Premium-only. Assembles a lesson from the collection (topic, CEFR level, the collection's
        source/target languages, up to 8 prioritised target words) and mints an ephemeral OpenAI
        realtime token. The app then streams audio directly to OpenAI over WebRTC — audio never
        transits this server. The session duration equals the token TTL (default 200s). This is
        practice: it never writes reviews or progress. Send a client-generated ULID (`client_id`)
        so a retry of a still-live dialog is idempotent (re-mints a token, no extra quota).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection_id, client_id]
              properties:
                collection_id: { type: string, minLength: 26, maxLength: 26 }
                client_id: { type: string, minLength: 26, maxLength: 26, description: Client-generated ULID — the dialog id. }
      responses:
        '201':
          description: Dialog started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StartedPracticeDialog' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Premium subscription required (code `subscription_required`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { description: Collection not found (or not the owner) }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: >
            Daily practice-dialog limit reached (code `practice_dialogs_quota_exceeded`);
            `meta.resets_at` is the absolute reset instant, `meta.limit` the daily cap.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /practice/dialogs/{id}/transcripts:
    post:
      tags: [Practice]
      summary: Append transcript events and get target-word coverage
      description: >
        Append-only and idempotent by (role, ts): re-uploading a batch stores only new lines. Returns
        the up-to-date coverage of the dialog's target words (`used` is monotonic).
      parameters: [{ $ref: '#/components/parameters/UlidId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [role, text, ts]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string, maxLength: 4000 }
                      ts: { type: integer, minimum: 0, description: Client line timestamp (ms). }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_words:
                    type: array
                    items: { $ref: '#/components/schemas/PracticeTargetWord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Dialog not found (or not the owner) }
        '422': { $ref: '#/components/responses/ValidationError' }

  /practice/dialogs/{id}/finish:
    post:
      tags: [Practice]
      summary: Finish a dialog and get a native-language recap
      description: >
        Records the estimated realtime spend and returns a short recap written in the collection's
        source (native) language, plus how many target words were used. Idempotent.
      parameters: [{ $ref: '#/components/parameters/UlidId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { type: string }
                  words_used: { type: integer }
                  words_total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Dialog not found (or not the owner) }

  /practice/collections/{collectionId}/last-dialog:
    get:
      tags: [Practice]
      summary: The result of the collection's most recent concluded practice dialog
      description: >
        Returns the last finished OR expired dialog for the collection (an early exit is still a
        result). 404 when the user has never had one. Owner-scoped. `summary` is null for a dialog
        that only expired (no recap was generated); `finished_at` is null only for legacy rows.
      parameters:
        - { name: collectionId, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  finished_at: { type: string, format: date-time, nullable: true }
                  words_used: { type: integer }
                  words_total: { type: integer }
                  summary: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No concluded dialog for this collection (or not the owner) }

  /store/collections:
    get:
      tags: [Store]
      summary: Browse the store — public + system collections for a language pair
      description: >
        Ordered by `topic` so the client can render sections, keyset-paginated on `(topic, id)`.
        Each row carries `is_premium` (badge + subscribe gate) and `is_subscribed`.
      parameters:
        - { name: source_lang, in: query, required: false, schema: { type: string, default: ru } }
        - { name: target_lang, in: query, required: false, schema: { type: string, default: en } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StoreCollection' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /store/collections/{id}/preview:
    get:
      tags: [Store]
      summary: Preview a store collection — first few terms + total
      description: >
        A free taster shown before subscribing: up to 5 terms (learned form + native translation)
        and the collection's total item count. Available to everyone, including free users looking at
        a premium collection — the premium gate is only on adding. A private/non-store id 404s.
      parameters:
        - { $ref: '#/components/parameters/UlidId' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StoreCollectionPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not a store collection (private/custom or unknown) }

  /store/collections/{id}/subscribe:
    post:
      tags: [Store]
      summary: Add a store collection to the library (idempotent)
      description: >
        Idempotent — a repeat subscribe returns 200 and adds no duplicate. A premium collection
        requires a premium tier, otherwise 403 `subscription_required`. A private/non-store id 404s.
      parameters: [{ $ref: '#/components/parameters/UlidId' }]
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      collection_id: { type: string }
                      subscribed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Store]
      summary: Remove a store collection from the library (idempotent)
      parameters: [{ $ref: '#/components/parameters/UlidId' }]
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      collection_id: { type: string }
                      subscribed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    get:
      tags: [Search]
      summary: Search the terms that already exist (free, instant)
      description: >
        Exact and prefix matches over the term's own text and over its translations in the learner's
        language, ranked exact-term → exact-translation → prefix-term → prefix-translation. Costs
        nothing and touches no model, so it is safe to call on a debounced keystroke. Every hit says
        which of the CALLER'S OWN folders already hold it (`folders`), which is what lets the save
        button tell the truth. Deliberately not fuzzy: the question is «do we already have the word
        you typed», and a plausible near-miss would stop the learner generating the word they meant.

        `source`/`target` are the search pill, and they select the PAIR rather than a direction:
        «Похожие» are the same rows whichever way the learner is asking — `case` is an English term
        with a Russian translation either way — so both are searched and the translations shown are
        the pair's. Omit both for the learner's profile pair; an unserved pair is a 422.

        `translation` and `example_translation` are STRICTLY in the pair's support language: a term
        with no translation in it comes back with `null` there rather than with a gloss in a third
        language, and `POST /search/lookup` is what fills the gap (DECISIONS п. 146).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: source, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: target, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 2 } }
        - name: taught_side
          in: query
          required: false
          schema: { type: string, enum: [source, target] }
          description: >-
            WHICH HALF of the pair is the language being STUDIED, said by the client instead of
            guessed by the server. A request carries a direction, not a pair of roles: `de → en` is
            either German with English support or English with German support, and the query string
            alone cannot tell them apart. Omit it and the server breaks the tie as before — the
            learner's profile, then the direction's `source` (DECISIONS п. 147). An unparseable
            value reads as «not given» on these two debounced GETs, because a typo must not put an
            error on a screen somebody is still typing into.
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SearchHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search/instant:
    get:
      tags: [Search]
      summary: The grey hint line — one word, one translation, as fast as it can be had
      description: >
        A first, cheap guess at what a word means, shown while the learner is still typing. It does
        NOT replace `POST /search/lookup`: that one writes the card (translation, description,
        example, level, image query) with a model that knows the content rules; this one is a
        garnish and never becomes card content.

        THREE RUNGS, each reached only because the one above had nothing: (1) our own catalogue —
        free, and the exact string the card will show if the word is saved, taken STRICTLY in the
        pair's support language, so a term glossed only in some third language walks on down the
        ladder instead of answering in it (DECISIONS п. 146); (2) the shared cache —
        bought once by whoever typed the word first, free for everybody after; (3) the vendor. On a
        debounced field the same few hundred words are typed over and over, so rungs 1–2 answer
        almost everything.

        ALWAYS 200, always the same shape. There is no failure here worth interrupting somebody who
        is typing: no key (`feature_disabled`), no budget (`limit_reached`), a dead or slow vendor,
        or simply no answer all come back as a null `translation`. The client renders a line when
        there is one and nothing when there is not — it has no error path at all.

        BOTH DIRECTIONS, and the LEARNER states which. `source`/`target` are the pill on the search
        screen: `occasion` asked as `en→ru` is answered in Russian, `случай` asked as `ru→en` is
        answered in English — and the second is the point, since a word they cannot yet name is
        exactly the word worth turning into a card.

        The vendor's own language detection does NOT decide. It was tried and removed: on a single
        word it is confidently wrong often enough to matter (`gate` → Norwegian → «улица»), and a
        wrong answer looks exactly like a right one. A stated direction is always honoured, even
        when the query is in the other language — that is a mistake the learner can see and flip in
        one tap.

        Omit both to get the learner's profile pair (taught language → their own). A pair this
        deployment does not serve is a **422**, never a quiet swap: the pill on screen says which
        way the answer comes back, and a server answering in a different pair would make that label
        a lie. `reversed` reports the outcome for layout only; nothing about languages, directions
        or detection is ever shown to the learner.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: source, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 2 }, description: the language the query is written in }
        - { name: target, in: query, required: false, schema: { type: string, minLength: 2, maxLength: 2 }, description: the language the answer comes back in }
        - name: taught_side
          in: query
          required: false
          schema: { type: string, enum: [source, target] }
          description: >-
            WHICH HALF of the pair is the language being STUDIED, said by the client instead of
            guessed by the server. A request carries a direction, not a pair of roles: `de → en` is
            either German with English support or English with German support, and the query string
            alone cannot tell them apart. Omit it and the server breaks the tie as before — the
            learner's profile, then the direction's `source` (DECISIONS п. 147). An unparseable
            value reads as «not given» on this debounced GET, because a typo must not put an error
            on a screen somebody is still typing into.
      responses:
        '200':
          description: A hint, or an honest nothing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      query: { type: string, description: the normalized query the answer is about }
                      translation: { type: string, nullable: true }
                      source:
                        type: string
                        nullable: true
                        enum: [vocabulary, cache, deepl]
                        description: >
                          Which rung answered. INTERNAL — the client does not show it; where a
                          translation came from is the app's business, not the learner's.
                      feature_disabled: { type: boolean, description: no translation provider is configured }
                      limit_reached: { type: boolean, description: the month's character budget is spent }
                      reversed:
                        type: boolean
                        description: >
                          The query was in the learner's own language, so `translation` holds the
                          word being LEARNED. INTERNAL, like `source`: the screen uses it to decide
                          which of the two strings is the headline (the English one always is) and
                          never to say anything about languages or detection.
                      query_too_long:
                        type: boolean
                        description: >
                          Longer than `services.generation.search_query_max_chars` (120). Nothing
                          was asked and nothing was bought — this app catches words and phrases, and
                          the vendor bills by the character. The one state the client renders a line
                          for: «Поиск — для слов и коротких фраз».
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search/languages:
    get:
      tags: [Search]
      summary: Which language pairs this deployment searches in
      description: >
        What the search pill may offer. Read once when the screen opens and cached on the device —
        it changes by deployment, not by session.

        CODES ONLY. What each language is called, and in whose language, is the client's business:
        it already ships endonyms and flags, and a server that also held them would be a second
        list to keep in step with the first.

        TWO LISTS, one per ROLE. `targets` is what may be LEARNED — a language this deployment can
        teach — and `natives` is what may be READ. A pair is any `targets` entry with any `natives`
        entry, the two being different; English is not required on either side (DECISIONS пп. 85,
        134). `target`, singular, is the older field: one taught language, frozen at `en` for the
        app already on the phone, and it goes when that app reads `targets`.
      responses:
        '200':
          description: The pairs on offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      target:
                        type: string
                        description: >
                          LEGACY, frozen at `en` — one taught language, for the shipped app whose
                          «На какой» picker is built from a single value. Read `targets` instead.
                      targets:
                        type: array
                        items: { type: string }
                        description: >
                          the languages that may be LEARNED (the term side of a pair), in the order
                          the pill offers them
                      natives:
                        type: array
                        items: { type: string }
                        description: >
                          the languages a learner may READ (the support side of a pair), in the
                          order the pill offers them — every language the catalogue names
                      default_native:
                        type: string
                        description: >
                          Where the pill starts on a device that has never been set — the learner's
                          own language from their profile, not the first entry of `natives`.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search/lookup:
    post:
      tags: [Search]
      summary: Look one word up with the model (paid, capped, cached forever)
      description: >
        ONE call to the cheap model for a word the database does not have. A POST the learner taps —
        never something a debounce fires — because it spends money.

        The order is cache → cap → call. A cached answer is served FREE and does not consult the cap
        at all: the answer is a fact about the word, not about who asked, so the second person to
        type it (and the same person tomorrow) pays nothing. Only a genuine miss counts against
        `SEARCH_LOOKUP_DAILY_CAP` (default 30/user/day).

        A spent cap is a **200**, not a 429: `limit_reached: true`, `lookup: null`. It is a normal
        answer the app has a screen for — the client shows the free `/search` results beside it.

        The term is NOT created. It appears only when the learner explicitly saves it via
        `/search/add`, which is what keeps the catalogue free of words nobody wanted.

        EITHER LANGUAGE, one card. `query` may be in the language being learned or in the learner's
        own; `lookup.text` is ALWAYS the former and `lookup.translation` always the latter, so
        `случай` and `occasion` produce the same word. They are two cache rows — the key is the
        query, and they really were two different questions — but they deduplicate to ONE term on
        save, because the term is the English word both questions were about.

        A query the model cannot place at all — keystrokes, a fragment — is also a **200**:
        `not_recognized: true`, `lookup: null`. The client's line is «не получилось распознать,
        проверьте написание», which is advice, and advice does not belong on an error path. The
        verdict is cached like a card (`asdfgh` will not become a word tomorrow) and counts against
        the day's cap like any other bought call.

        `source`/`target` are the same pill as on `GET /search/instant`, with the same rules: omit
        both for the learner's profile pair, and an unserved pair is a 422. The pair also decides
        what language the SAVED translation is written in — `/search/add` reads it off the cached
        lookup row rather than off the learner's profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  # The SAME ceiling `GET /search/instant` refuses at — services.generation
                  # .search_query_max_chars. A field that said «слишком длинно» while the button
                  # behind it bought the paragraph would be two products on one screen.
                  maxLength: 120
                source: { type: string, minLength: 2, maxLength: 2 }
                target: { type: string, minLength: 2, maxLength: 2 }
                taught_side:
                  type: string
                  enum: [source, target]
                  description: >-
                    WHICH HALF of the pair is the language being STUDIED, said by the client instead
                    of guessed by the server — the same optional field the two search GETs take. A
                    request carries a direction and not a pair of roles: `de → en` is either German
                    with English support or English with German support. Omitted, the server breaks
                    the tie as before (DECISIONS п. 147). Naming a side whose language this
                    deployment does not teach is a **422** `taught_side_not_taught`: this endpoint is
                    a deliberate tap and can afford to be told, and answering in the other role would
                    write the card in the wrong language invisibly.
                retry:
                  type: boolean
                  default: false
                  description: >-
                    The learner pressed the button AGAIN on a query the model just refused. A person
                    tapping twice is the retry, so this ignores a stored `not_recognized` outright
                    rather than waiting out its 24-hour expiry — the expiry goes on governing every
                    automatic path, where nobody is watching. It does not bypass the daily cap, and
                    it never re-buys a card that already exists: a positive answer is still served
                    from the cache whatever this says.
                fixed_translation:
                  type: string
                  nullable: true
                  maxLength: 120
                  description: >-
                    ADDITIVE. The translation the learner was looking at in the translator line when
                    they pressed «Собрать карточку» — our catalogue's, the shared hint cache's or
                    DeepL's, whichever rung answered. Given, it is a DECISION and not a suggestion:
                    it goes into the prompt as data («build the card for THIS reading»), it is what
                    comes back as the card's `translation` whatever the model wrote, and the model's
                    own reading is kept beside it as an alternative rather than discarded. Omitted or
                    null — every client before SYN-1b — and nothing changes: the model chooses, as
                    it always did. It does NOT reopen the lookup cache: a cache hit is still served
                    free, and the confirmation reaches the term through `POST /search/add`.
      responses:
        '200':
          description: An answer, or an honest «not today»
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lookup:
                        allOf: [{ $ref: '#/components/schemas/LookupCard' }]
                        nullable: true
                      not_recognized:
                        type: boolean
                        description: >
                          The model could not name a word for this query. `lookup` is null and this
                          is not an error — see the description above.
                      limit_reached: { type: boolean }
                      daily_cap: { type: integer }
                      used_today: { type: integer, description: paid lookups this UTC day }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: >
            Either the input (`code: validation_error`) or the ANSWER (`code: lookup_refused`,
            `meta.reason` = `wrong_language` | `description_gives_away` | `empty_query` |
            `model_unavailable`). There is no repair pass: a lookup is a person watching a spinner,
            and a second call to fix the first would double both the wait and the cost.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /search/add:
    post:
      tags: [Search]
      summary: Save a search result — term, folder, and the POOL when asked
      description: >
        Names either `lookup_id` (a freshly looked-up word: the cached answer becomes a term, with
        its description) or `term_id` (a word the database already had) — never both. `collection_id`
        omitted means «Сохранённые», created on the spot if this is the first save.

        THE QUEUE IS A SEPARATE ACT, and `enroll` is where the caller says which one this is. The
        shelf and the trainer's queue are different things: «Сохранить» files the word (it then waits
        in the swipe pass, like every other shelved word), «Учить сразу» files it AND puts it in the
        queue — the same door «Учить это слово» opens. What the pool rule forbids is enrolling by
        side effect, and both branches here answer a button the learner pressed.

        `enroll` DEFAULTS TO TRUE, which is this endpoint's behaviour before the two acts were split
        apart, so a client that does not know the field keeps working unchanged.
        The enrichment станок is chained exactly as it is after a generation (`GENERATION_AUTO_ENRICH`),
        on both branches — a shelved word still gets its card built.

        Idempotent throughout — the term dedups on its normalized text, the folder add is a no-op
        when the word is already there, the description is write-once, and re-enrolling an enrolled
        pair changes neither its rung nor its due date. `added`/`enrolled` say what actually happened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lookup_id: { type: string, minLength: 26, maxLength: 26 }
                term_id: { type: string, minLength: 26, maxLength: 26 }
                collection_id: { type: string, minLength: 26, maxLength: 26, nullable: true }
                fixed_translation:
                  type: string
                  nullable: true
                  maxLength: 255
                  description: >-
                    ADDITIVE. The same confirmed line `POST /search/lookup` takes, sent AGAIN on the
                    save — deliberately, because the lookup may have been a free cache hit written by
                    somebody else's call, worded their way, and the learner's confirmation still has
                    to reach the term they are about to study. It becomes the term's primary
                    translation (the question every card of that term asks); every other reading is
                    stored beside it. Only meaningful with `lookup_id`: saving an existing `term_id`
                    means tapping a row whose translation the learner can already see. Omitted or
                    null, nothing changes.
                enroll:
                  type: boolean
                  default: true
                  description: >-
                    WHICH ACT this is. `false` = «Сохранить»: the word goes on the shelf and waits in
                    the swipe pass. `true` = «Учить сразу»: the shelf AND the trainer's queue.
                    Omitted means `true` — the endpoint enrolled unconditionally before the two acts
                    were named separately, and a build that predates the field must not change
                    behaviour under it.
              oneOf:
                - required: [lookup_id]
                - required: [term_id]
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      term_id: { type: string }
                      collection_id: { type: string }
                      collection_title: { type: string, description: the folder's CURRENT name — the learner may have renamed it }
                      collection_is_default: { type: boolean }
                      added: { type: boolean, description: false when the word was already in this folder }
                      enrolled:
                        type: boolean
                        description: >-
                          Did THIS call put the word into the trainer's queue? False for two
                          different reasons: `enroll` was false (the word was shelved), or the pair
                          was already in the pool.
        '403':
          description: The folder is not the caller's (code `collection_not_editable`) — nothing is enrolled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: No such cached lookup (code `lookup_not_found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collections:
    get:
      tags: [Collections]
      summary: List the user's collections (cursor-paginated, newest first)
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectionSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collections]
      summary: Create a custom collection
      description: >
        Accepts a client-generated `id` (ULID) for offline idempotency; re-sending the same id does
        not duplicate.


        The language PAIR is optional and defaults to the owner's profile (`native_language` →
        `source_lang`, `target_language` → `target_lang`). Once created the pair is fixed and is what
        every reader uses — the profile is a default at creation and nothing more. The collection
        then accepts only terms of its `target_lang` (see the `422 term_language_mismatch` on
        `/collections/{id}/items`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                id: { type: string, minLength: 26, maxLength: 26 }
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000, nullable: true }
                source_lang: { type: string, minLength: 2, maxLength: 5 }
                target_lang: { type: string, minLength: 2, maxLength: 5 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collections/default:
    get:
      tags: [Collections]
      summary: The user's «Сохранённые» folder, created on first ask
      description: >
        The personal folder a one-tap save from search lands in. Created LAZILY — a learner who never
        saves anything never gets an empty folder on their shelf — so this GET may write. There is
        exactly one per owner (a partial unique index says so, not just the handler); it is an
        ordinary custom collection in every other respect, may be renamed, and can never be deleted
        (`is_default: true`, DELETE answers 409 `collection_not_deletable`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /collections/{id}:
    get:
      tags: [Collections]
      summary: Show a collection with its items (owner only)
      parameters:
        - $ref: '#/components/parameters/UlidId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not found (or not the owner) }
    patch:
      tags: [Collections]
      summary: Update title/description (owner only)
      parameters:
        - $ref: '#/components/parameters/UlidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 200 }
                description: { type: string, maxLength: 2000, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '403':
          description: Not the owner (code `collection_not_editable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Not found (code `collection_not_found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Collections]
      summary: Soft-delete a collection (owner only)
      description: >
        Deliberately shallow: the words stay in the pool with their rung, their due date and their
        whole append-only review history. A folder is a shelf, not the queue — the only way out of
        the pool is «убрать из тренировки» (DELETE /pool/terms/{termId}).
      parameters:
        - $ref: '#/components/parameters/UlidId'
      responses:
        '204': { description: Deleted }
        '403':
          description: Not the owner (code `collection_not_editable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Not found (code `collection_not_found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: The «Сохранённые» folder cannot be deleted (code `collection_not_deletable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /collections/{id}/items:
    post:
      tags: [Collections]
      summary: Add a word to a collection (owner only)
      description: >
        Found-or-creates the term in Vocabulary, then attaches it. Idempotent — adding the same word
        twice is a no-op. Returns the refreshed collection. `translation` is optional: when omitted,
        the term is created bare and enriched asynchronously (translation, transcription, example and
        a stock photo are filled in from the LLM + Pexels), so images/translation appear via a later
        `/sync`.


        A collection holds exactly ONE language pair and accepts only terms of its `target_lang`.
        Adding a term of another language is refused with `422 term_language_mismatch`; the word
        belongs in a collection of its own pair.
      parameters:
        - $ref: '#/components/parameters/UlidId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                term_id:
                  type: string
                  minLength: 26
                  maxLength: 26
                  description: >
                    Put an EXISTING term in this folder (found by search, or sitting in another
                    folder). Nothing is created. Mutually exclusive with `text`.
                text: { type: string, minLength: 1, maxLength: 200 }
                translation: { type: string, maxLength: 500, nullable: true, description: Optional; omit to have it auto-enriched. }
                type: { type: string, enum: [word, phrase, idiom, phrasal_verb] }
              oneOf:
                - required: [term_id]
                - required: [text]
      responses:
        '201':
          description: Word added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Collection' }
        '403':
          description: Not the owner (code `collection_not_editable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            Request validation (the usual 422 shape), or the term is not of this collection's pair —
            code `term_language_mismatch`, `meta.expected_lang` / `meta.actual_lang` naming the two.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  /collections/{id}/items/{termId}/move:
    post:
      tags: [Collections]
      summary: Move a term to another of the user's own folders
      description: >
        One command rather than remove+add from the client, so the two halves cannot half-happen
        offline and leave the word in neither folder. BOTH ends are ownership-checked before anything
        is written. Idempotent — replaying the same move changes nothing. The pool is untouched.


        The destination's pair is checked too, inside the same transaction and BEFORE the removal, so
        a move into a folder of another pair fails whole (`422 term_language_mismatch`) and the word
        stays where it was.
      parameters:
        - $ref: '#/components/parameters/UlidId'
        - { name: termId, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_collection_id]
              properties:
                to_collection_id: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '204': { description: Moved }
        '403':
          description: One of the two folders is not the actor's (code `collection_not_editable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Either folder not found (code `collection_not_found`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >
            Request validation (the usual 422 shape), or the destination folder teaches another
            language — code `term_language_mismatch`. Nothing moved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  /collections/{id}/items/{termId}:
    delete:
      tags: [Collections]
      summary: Remove a term from a collection (owner only)
      parameters:
        - $ref: '#/components/parameters/UlidId'
        - { name: termId, in: path, required: true, schema: { type: string, minLength: 26, maxLength: 26 } }
      responses:
        '204': { description: Removed }
        '403':
          description: Not the owner (code `collection_not_editable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /study/sessions:
    post:
      tags: [Study]
      summary: Build a self-contained study session (due then new cards, one card per exercise)
      description: >-
        Assembles a ready-to-play session: due cards first (state <> new, by due date), then new
        cards up to the day's remaining new-term quota (one global quota — a scoped session does
        not multiply it). Each card carries its exercise mode, chosen from the term's reps and answer
        shape: reps 0 → multiple_choice; reps ≥ 1 → a production rotation that leads with the base
        (word_bank for multi-word / typing for single-word) then fans out to listening (hear it, type
        it) and cloze (fill the blank in the term's own example); review rotates typing/listening/cloze;
        known → typing. cloze is only offered when the example contains the answer (the client blanks
        that span from `example`). The card also carries the prompt (user's language), the answer
        (target language) and mode-specific extras — shuffled options for multiple_choice, shuffled
        chips for word_bank — so the client runs it offline.
        The session's composition is fixed server-side under the returned session_id. A practice
        session (practice=true) instead draws EVERY term in scope ignoring due_at, state and the
        daily quota (device-batch F17): free training on demand. It introduces nothing and never
        schedules; its answers are recorded with is_practice but do not move progress.
        What "in scope" means depends on collection_id, and the two answers differ on purpose.
        WITHOUT one, the scope is the learner's POOL — the words they chose to study. WITH one, the
        scope is the WHOLE COLLECTION, including terms that are not in the pool: the learner pointed
        at a topic and asked to drill it, so an untriaged collection is playable («зашёл в кафе,
        открыл тему»). Terms in the pool lead the session and are dealt by their own rung; terms
        outside it follow, and are dealt only the trainers the admission matrix opens at the
        assembly rung — multiple_choice and the assembly modes, never typing, listening or
        dictation. Reaching such a term enrols nothing: it is still outside the pool afterwards, and
        a study session over the same collection is unchanged.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                collection_id: { type: string, minLength: 26, maxLength: 26, nullable: true, description: Scope to one owned collection }
                limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
                practice: { type: boolean, default: false }
                session_id: { type: string, minLength: 26, maxLength: 26, nullable: true, description: Client-generated ULID (idempotent) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id: { type: string }
                      cards:
                        type: array
                        items: { $ref: '#/components/schemas/SessionCard' }
                      speech: { $ref: '#/components/schemas/SpeechContract' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /study/sessions/{sessionId}/complete:
    post:
      tags: [Study]
      summary: Close a study run the learner played to its summary screen
      description: >-
        Stamps `ended_at` and a compact `stats` summary on the session, which is what makes a played
        run distinguishable from an abandoned one (before this there was no writer for the column at
        all, so every row looked abandoned). The summary — cards answered, of those correct
        (`reviews.is_correct`, i.e. anything but `again`), and intros shown — is RECOMPUTED from the
        session's own append-only logs, never taken from the client: the only thing the client
        supplies is when the learner finished, because the run may well have ended offline.
        Nothing here touches progress or scheduling; the answers were folded when they were uploaded.
        Idempotent and never an error: the client sends this through the same offline queue its
        answers ride, so a re-send, another user's session, an unknown id and a run that answered
        nothing all return 200 with `completed: false`. An abandoned run is deliberately left open
        rather than closed with a row of zeroes — `ended_at IS NULL` is then the true statement
        about it.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ended_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: When the learner finished. Omitted means now.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      completed:
                        type: boolean
                        description: Whether THIS call is the one that closed the session.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /study/progress:
    get:
      tags: [Study]
      summary: Per-collection learning progress (derived, not stored)
      description: >-
        For each of the user's own collections: total, new, due, and mastered counts, with
        mastered broken into confirmed (proven by exercises) vs familiar (marked known) and the
        rest in progress. Computed by folding the (user, term) progress over collection membership.


        `by_language` rides ALONGSIDE `data`, which is unchanged field for field: the same counters
        cut by the language of the TERM — «сколько усвоено в румынском» (DECISIONS п. 139). It is a
        REGROUPING of the very same rows and not a second progress: progress lives on `(user, term)`
        and a term has exactly one language. There is deliberately no cut by PAIR — a word studied
        through two folders with different support languages would then be counted twice.


        A term is counted ONCE in `by_language`, however many folders hold it (`data` counts it once
        per folder, which is right for a folder's own bar). REFERENCE languages are absent from
        both: zh and ja carry no trainer, so their words have no progress to report, and a phrasebook
        collection drops out of `data` rather than reporting a «0 из 40» that reads as work not yet
        done (пп. 84, 136).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CollectionProgress' }
                  by_language:
                    type: array
                    description: Ordered by language code, so the response is diffable between runs.
                    items: { $ref: '#/components/schemas/LanguageProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /reviews/batch:
    post:
      tags: [Study]
      summary: Upload a session's events — answers (server-graded) and intros
      description: >
        Offline-friendly: up to 200 answers with client-generated ULIDs. The client sends the
        RAW answer (response text, mode, latency, hint) — the SERVER grades it, so the grading
        rule lives in one place. Re-sending an id is a duplicate, not an error; an answer for an
        unknown term is skipped. A practice answer (is_practice) is recorded but never schedules.


        A batch also carries `exposures`: INTRO cards, which were shown and asked nothing. They
        are a separate list because they are not answers — they produce no grade and are never
        written to the review log, which holds real retrievals only. At least one of the two
        lists must be present; an intro-only batch is the normal shape of a first session with a
        brand-new collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exposures:
                  type: array
                  maxItems: 200
                  description: >-
                    Intro cards shown. Identified by the PAIR (user, term), not by an event id:
                    a term is introduced once, so a re-uploaded exposure is an ignored insert
                    that keeps the first `shown_at` — no client ULID is needed to make it safe.
                    Recording one moves the pair from ladder rung 0 to rung 1 and writes no
                    scheduling field. Naming a session the server has never seen adopts it as an
                    offline practice run, exactly as an answer does; if it cannot be adopted the
                    exposure is still recorded, without the session.
                  items:
                    type: object
                    required: [term_id, shown_at]
                    properties:
                      term_id: { type: string, minLength: 26, maxLength: 26 }
                      shown_at: { type: string, format: date-time }
                      session_id: { type: string, minLength: 26, maxLength: 26, nullable: true }
                reviews:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id, term_id, exercise_mode, response, answered_at, client_seq]
                    properties:
                      id: { type: string, minLength: 26, maxLength: 26 }
                      term_id: { type: string, minLength: 26, maxLength: 26 }
                      exercise_mode: { type: string, enum: [multiple_choice, word_bank, typing, listening, cloze, scramble, dictation, pick_correct, speaking, description_match] }
                      response: { type: string, description: The user's raw answer text }
                      answered_at:
                        type: string
                        format: date-time
                        description: >-
                          Reference-only (device clock). NOT used to order the fold — see client_seq.
                      client_seq:
                        type: integer
                        minimum: 0
                        description: >-
                          Per-user monotonic sequence assigned by the client at answer time,
                          surviving queue clears. The server folds answers into progress in
                          client_seq order (not answered_at, a device clock that can lag). Must
                          be strictly increasing per user across the whole history; initialise
                          from GET /auth/me `max_review_seq` after a reinstall.
                      used_hint: { type: boolean, default: false }
                      is_practice: { type: boolean, default: false }
                      latency_ms:
                        type: integer
                        minimum: 0
                        nullable: true
                        description: >-
                          Client-measured, from the card's paint to the answer. Optional: null
                          means unmeasured (treated neutrally). Do NOT send 0 for an unmeasured
                          answer — send null.
                      session_id: { type: string, minLength: 26, maxLength: 26, nullable: true }
                      ladder_step:
                        type: integer
                        minimum: 1
                        maximum: 5
                        nullable: true
                        description: >-
                          The rung of the acquisition ladder the card was dealt at, echoed from
                          the card. Required for rung 1 (forward recognition), which is graded by
                          IDENTITY: the learner taps an option and the client uploads that
                          option's TERM ID as `response`, so the key is an id and no translation
                          ever enters an answer key. The pair's rung moves as this answer is
                          folded, which is why the card has to say what it asked. 0 is not valid
                          here — that is the intro, which belongs in `exposures`.
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted: { type: integer }
                      duplicates: { type: integer }
                      unknown: { type: integer }
                      rejected:
                        type: integer
                        description: >-
                          Swipes REFUSED because the word is in a reference language (one that
                          carries no trainers at all — zh, ja in v1; DECISIONS пп. 84, 136). Nothing
                          is written for them: two of the three verdicts enrol, and the pool does not
                          take a word that can never be dealt as a card. Separate from `unknown`,
                          which is a term this account cannot see and goes away by itself — a
                          `rejected` swipe will never land, however often it is retried. The rest of
                          the batch is applied as usual (a batch never fails whole).
                      exposures:
                        type: integer
                        description: >-
                          Intro cards newly recorded. Counted apart from `accepted` because they
                          are not answers; a re-upload reports 0 here and changes nothing.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /stats:
    get:
      tags: [Study]
      summary: Training dashboard stats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /home-plan:
    get:
      tags: [Study]
      summary: The home screen's day — session composition, the pool's size, the schedule just ahead
      description: >-
        Everything the main screen draws, in one read. `session.repeat` and `session.new` come from
        the SAME planner call `POST /study/sessions` makes (same session size, same remaining
        new-term quota), so the card can never offer a session the server would return empty;
        `session.triage` is the swipe pass beside it and is why `total` is not `repeat + new`.


        Read-only: producing this writes nothing — no session, no exposure, no quota spent.


        Every block the design draws has a state in which it is not drawn at all, and this contract
        says so with `null` / `[]` rather than with a zero. `today`, `next_review`, `continue`,
        `estimated_minutes`, `triage_collection_id` and `days_until_queue` are all nullable for that
        reason: the screen's rule is «блок без данных не рисуется», and «0 слов» is a line it never
        shows.


        Deliberately NOT part of `/stats`: that endpoint is the dashboard's aggregate (totals,
        mastered, the activity calendar) and the Progress screen reads it too. This one runs the
        session planner and hydrates term and collection content to say what it says.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/HomePlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /triage/queue:
    get:
      tags: [Study]
      summary: The first-pass swipe queue for one collection (not-yet-triaged, not-yet-studied terms)
      description: >-
        A collection's terms that have neither a progress row nor a triage record, capped at
        limit. Content is included so the whole batch can be swiped offline. Excluding
        already-triaged terms is what stops a term from being asked twice, even when an
        "unknown" swipe leaves it new. The response is an envelope: `cards` plus `remaining`,
        the count of eligible terms beyond this page.
      parameters:
        - name: collection_id
          in: query
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 40, default: 40 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [cards, remaining]
                    properties:
                      cards:
                        type: array
                        items: { $ref: '#/components/schemas/TriageCard' }
                      remaining:
                        type: integer
                        minimum: 0
                        description: >-
                          Eligible (not-yet-triaged, not-yet-studied) terms left AFTER this page —
                          i.e. what subsequent GETs will still serve, NOT the collection's total
                          new-term count. Lets the client show honest progress ("N more after
                          sync") without diverging from the real queue. 0 means this is the last page.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /triage/batch:
    post:
      tags: [Study]
      summary: Upload a batch of triage swipes (idempotent by triage id)
      description: >-
        A swipe is a self-assessment, kept out of the review log. Projects onto (user, term)
        progress, and decides POOL MEMBERSHIP: `unknown` → a rung-0 row, enrolled; `unsure` →
        the first recognition rung, enrolled; `known` → a `known` row with a verification check,
        NOT enrolled (on an untaught word this supersedes an earlier enrolment). A pair that has
        actually been taught is never rewritten by a swipe — it is only enrolled. Re-sending an
        id is a duplicate, not an error; a swipe for an unknown term is skipped, and a swipe for a
        REFERENCE-language term is refused (`rejected`) rather than written.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [triages]
              properties:
                triages:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [id, term_id, verdict, decided_at, client_seq]
                    properties:
                      id: { type: string, minLength: 26, maxLength: 26 }
                      term_id: { type: string, minLength: 26, maxLength: 26 }
                      verdict: { type: string, enum: [known, unknown, unsure] }
                      decided_at:
                        type: string
                        format: date-time
                        description: >-
                          Reference-only (device clock). NOT used to decide the current verdict —
                          see client_seq.
                      client_seq:
                        type: integer
                        minimum: 0
                        description: >-
                          Per-user monotonic sequence assigned by the client at swipe time,
                          surviving queue clears. The current verdict for a (user, term) is the
                          one with the greatest client_seq (not the latest decided_at, a device
                          clock that can lag and roll back a genuinely-later verdict). Must be
                          strictly increasing per user across the whole history; initialise from
                          GET /auth/me `max_triage_seq` after a reinstall.
                      collection_id: { type: string, minLength: 26, maxLength: 26, nullable: true }
                      latency_ms:
                        type: integer
                        minimum: 0
                        nullable: true
                        description: >-
                          Client-measured, from the card's paint to the FIRST event (flip or swipe,
                          whichever comes first). Optional: null means unmeasured (treated neutrally
                          — never risky). Do NOT send 0 for an unmeasured swipe — send null.
                          (Risk-by-latency applies to phrases only.)
                      revealed:
                        type: boolean
                        nullable: true
                        description: >-
                          Whether the learner flipped the card (revealing the translation/example)
                          before deciding. A `known` verdict reached after peeking is a weaker
                          signal — recognition of a hint, not recall — so it drives an early
                          verification check, on par with a too-fast swipe. Null/false = no peek
                          (neutral); applies to words and phrases alike.
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accepted: { type: integer }
                      duplicates: { type: integer }
                      unknown: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /pool/terms/{termId}:
    put:
      tags: [Study]
      summary: Put a term into the learner's pool («Учить это слово»)
      description: >-
        THE POOL is the learner's own list of words being studied — the queue, as opposed to the
        catalogue their collections are. STUDY sessions are assembled from it and from nothing else,
        so a word is TAUGHT only after a deliberate act: this endpoint, or a `не знаю` / `не уверен`
        triage swipe. (Free practice scoped to a collection may DRILL a word outside the pool — see
        POST /study/sessions — but it moves nothing and never enrols.)

        Idempotent. The pair's row is created if the learner has never met the word; if it is
        already in the pool nothing is written, and the ORIGINAL enrolment moment is kept. A pair
        that was paused and is being brought back resumes at the rung, counter and due date it left
        with — none of them is touched here.

        There is no GET: the device reads its pool from its own mirror, which `/sync` keeps fresh
        (`enrolled_at` rides every progress row).
      parameters:
        - name: termId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200': { $ref: '#/components/responses/PoolMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not a term id }
        '422':
          description: >-
            The term is in a REFERENCE language — one this deployment does not teach (zh, ja in v1;
            DECISIONS пп. 84, 136). Such a language carries no trainer at all, so an enrolled word
            would be «being studied» and never come back. Code `reference_language_term`, with
            `meta.term_id` / `meta.lang`. Not reachable from an app in step with the server: a
            reference collection shows no «Учить это слово» at all.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

    delete:
      tags: [Study]
      summary: Take a term out of the learner's pool («Убрать из изучения»)
      description: >-
        A PAUSE, not an erasure. `enrolled_at` is cleared and nothing else changes: the append-only
        review log, the acquisition rung, the successful-review counter and the SM-2 schedule all
        stand, so re-enrolling continues from exactly where the word was left. Idempotent — a pair
        that is not in the pool answers 200 with `changed: false`.
      parameters:
        - name: termId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200': { $ref: '#/components/responses/PoolMembership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not a term id }

  /plans:
    get:
      tags: [Plans]
      summary: The learner's plans — the live one first, then the rest, newest first
      description: Deleted plans are not listed. The menu's «Новый план» reads this.
      responses:
        '200':
          description: Plan rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlanSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Plans]
      summary: Create a plan and start building it
      description: >-
        THE ENTRY (docs/plan-v2.md §4, §7). A goal in the learner's own words, the language being
        learned, the level, one to ten days and — optionally — the event's date. The server lays out
        the calendar (§7: every third day a review, the last day the rehearsal), shortens
        `days_total` to the days left before the event if the date is nearer than the days asked
        for, and asks the model for exactly as many scenes as the calendar has scene days. Nothing
        waits on the model: the answer is 202 with the build status, and the client polls
        `GET /plans/{id}/build`. When the plan is built, day one's lesson is written right away —
        before «Начать».


        THE PAYWALL (наряд ACC-1 §2) — only while `access.paywall_enabled` is on (off on the stand until the
        client's paywall): a learner without a subscription has ONE plan, the first they ever made (a deleted
        one counts) — any further plan is 402 `plan_subscription_required` (`meta.plans`); a subscriber has at
        most three plans in work (not finished, not deleted) — the fourth is 409 `plan_active_limit`
        (`meta.limit`, `meta.plans_in_work`). Nothing is written on a refusal. The learner's access is
        `GET /auth/me` → `access`.


        THE PAIR (наряд LANG-1 §7) — asked first, before the paywall: the request names only the target; the
        native is the learner's `profiles.native_language`. A plan is refused with 422 `language_pair_invalid`
        (`meta.target`, `meta.native`) when the target is not in `GET /plans/languages` → `targets`, the native
        is not one of the plan natives (`GET /languages` → `natives`: ru, uk, be, pl, ro, es, it, de, fr), or
        the two are one language. Nothing is written. The native is changed with `PUT`/`PATCH /profile`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goal_text, target_lang, level, days_total]
              properties:
                goal_text: { type: string, minLength: 1, maxLength: 1000 }
                target_lang: { type: string, pattern: '^[a-z]{2}$', description: 'One of `GET /plans/languages` → `targets`. A code of another shape is a validation 422; a two-letter code outside the list is the 422 problem `language_pair_invalid`.' }
                level: { type: string, enum: [beginner, intermediate] }
                days_total: { type: integer, minimum: 1, maximum: 10 }
                event_date: { type: [string, 'null'], format: date, description: 'YYYY-MM-DD in the learner''s own calendar; null or absent = no date' }
      responses:
        '202': { $ref: '#/components/responses/PlanBuild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: >-
            Either malformed input — Laravel's validation shape (`application/json`, `{message, errors}`) — or
            a pair no plan is built in — the problem `language_pair_invalid` (`application/problem+json`,
            `meta {target, native}`: the target outside the plan targets, the profile's native outside the plan
            natives, or the two equal). Nothing is written in either case.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  /plans/current:
    get:
      tags: [Plans]
      summary: The plan for the tab, or null
      description: >-
        The active or overdue plan, whole. When there is none, the newest plan that is BUILT and
        not started yet (`status: ready`, every day `locked`, `opens_on` null, `started_at` null) —
        it is a state the tab draws, not an absence. `data` is null only when the learner has no
        plan at all.
      responses:
        '200':
          description: The plan or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/Plan'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plans/versions:
    get:
      tags: [Plans]
      summary: Which server build and which prompt files are answering
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlanVersions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plans/languages:
    get:
      tags: [Plans]
      summary: The languages a plan may be built in
      description: >-
        The server's list, in the order the entry screen offers them: the plan targets of
        `LanguageRoles::planTargets()` — en, pl, ro, es, it, de, fr (наряд LANG-1 §7) — narrowed by the env
        `PLAN_LANGUAGES` when a deployment sets it (it can only narrow, and never reorders). Not a client
        constant — `POST /plans` refuses a `target_lang` outside this list with the 422 problem
        `language_pair_invalid`. CODES ONLY and frozen in this shape for build (21); the named list of both
        sides is `GET /languages`.
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [targets]
                    properties:
                      targets: { type: array, items: { type: string, pattern: '^[a-z]{2}$' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /languages:
    get:
      tags: [Plans]
      summary: Both sides of a plan's pair, named
      description: >-
        What the entry screen and the native picker draw (наряд LANG-1 §7). `targets` — the same codes as
        `GET /plans/languages` in the same order (the plan targets, narrowed by `PLAN_LANGUAGES`); `natives`
        — the languages a plan may be read in (ru, uk, be, pl, ro, es, it, de, fr), which no flag narrows.
        Every entry carries its endonym and flag from the server's one language catalogue. The learner's
        own native is `GET /auth/me` → `profile.native_language`; a profile native outside `natives` is
        allowed (collections and search are read in any catalogue language) but no plan is built for it.
      responses:
        '200':
          description: The two lists
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/PlanLanguageOptions' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /plans/images/{sceneId}/{size}:
    get:
      tags: [Plans]
      summary: A square copy of a scene photo
      description: >-
        What a scene image's `url_112` / `url_448` point at (with `?v=<version>`; the query is not
        read, it only makes the address change when the photo would). Only the owner's scenes. The
        server keeps both copies from the photo job; a copy it does not have yet is fetched from the
        photo's CDN, stored and served on this request. `Cache-Control: public, max-age=31536000,
        immutable` and a strong `ETag` (sha1 of the bytes); `If-None-Match` with that tag answers 304.
      parameters:
        - name: sceneId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
        - name: size
          in: path
          required: true
          schema: { type: integer, enum: [112, 448] }
      responses:
        '200':
          description: The JPEG bytes
          headers:
            Cache-Control: { schema: { type: string }, description: 'public, max-age=31536000, immutable' }
            ETag: { schema: { type: string }, description: 'Quoted sha1 of the bytes' }
          content:
            image/jpeg: { schema: { type: string, format: binary } }
        '304': { description: 'Not modified — the If-None-Match tag matches' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: '`plan_scene_image_not_found` — not the learner''s scene, or the scene has no photo; also a size other than 112/448' }
        '503': { description: '`plan_scene_image_unavailable` — the copy is not stored and the CDN did not hand it over now; ask again later' }

  /plans/audio/{audioId}:
    get:
      tags: [Plans]
      summary: A spoken line of a scene as an audio file
      description: >-
        The partner's line of an exchange — the only lines the server voices — named by a card's
        `audio_id` (and a dialogue exchange's `audio_id`); the day window's partner `audio_url` points here.
        `audio/mpeg` normally, `audio/wav` when the build had no encoder. Immutable — cache it forever.
      parameters:
        - name: audioId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200':
          description: The audio bytes
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such line }

  /plans/{id}:
    get:
      tags: [Plans]
      summary: The plan, whole — preview and tab alike
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }
    delete:
      tags: [Plans]
      summary: Delete the plan (menu «Удалить»)
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }

  /plans/{id}/build:
    get:
      tags: [Plans]
      summary: Poll the plan build
      description: >-
        `status` is `building` while the model is asked, then `ready`, `unclear` (the goal names
        no situation — a legitimate answer, with `unclear_reason`) or `failed` (the model refused
        twice, or the vendor was unreachable, or the build never came back within the stale
        window). `unclear` and `failed` may be retried with `POST /plans/{id}/build/retry`.
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200': { $ref: '#/components/responses/PlanBuild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }

  /plans/{id}/build/retry:
    post:
      tags: [Plans]
      summary: Ask the model again after an unclear or failed build
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '202': { $ref: '#/components/responses/PlanBuild' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }
        '409': { description: 'The plan is not in a retryable state (`plan_state`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /plans/{id}/scenes/{sceneId}:
    delete:
      tags: [Plans]
      summary: Remove a scene in the preview
      description: >-
        Allowed on a `ready` plan only. The scene's day becomes a review day; the plan keeps its
        length. The core scene (priority 1) cannot be removed — 409 `plan_core_scene`.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: sceneId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or scene }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/scenes/{sceneId}/lesson/retry:
    post:
      tags: [Plans]
      summary: Ask the model for a failed lesson again
      description: The learner's explicit retry of a scene whose `lesson_status` is `failed` (or stuck in `building` past the stale window).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - name: sceneId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      responses:
        '202': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or scene }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/start:
    post:
      tags: [Plans]
      summary: «Начать» — the plan goes live, day one opens today
      description: One live plan per learner — 409 `plan_already_active` names the one that holds the place. Only a `ready` plan starts (409 `plan_state`).
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/schedule:
    patch:
      tags: [Plans]
      summary: «Перенести дату» / a different number of days
      description: >-
        Either half may be sent alone. `event_date: null` clears the date; a missing key leaves it.
        A shorter plan drops scenes by the rule (variants first, then the highest priority number,
        never the core); a longer plan asks the model for the missing scenes with the existing ones
        as context — the new scene days show `lesson_status: pending` until the extension answers.
        Days already opened or closed are never cut (409 `plan_too_short`).
      parameters:
        - $ref: '#/components/parameters/PlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_date: { type: [string, 'null'], format: date }
                days_total: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /plans/{id}/finish:
    post:
      tags: [Plans]
      summary: «Завершить» — close a live (or overdue) plan
      parameters:
        - $ref: '#/components/parameters/PlanId'
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan for this learner }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/days/{number}:
    get:
      tags: [Plans]
      summary: «Кабинет дня» — header, goals, stages with progress, statistics, program
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
      responses:
        '200': { $ref: '#/components/responses/PlanDayRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or day }

  /plans/{id}/days/{number}/open:
    post:
      tags: [Plans]
      summary: «Открыть» / «Продолжить» — the day's full card list
      description: >-
        The first call deals the cards (the composition is fixed before the day starts, docs/plan-v2.md §6);
        every call returns the whole list with each card's state, so a client that reconnects holds
        the day. Opening asks the model for nothing: the next day's lesson is asked for when THIS day
        closes (GEN-3 §11). 409 `plan_day_locked` while the previous day is not closed
        (`meta.blocked_by_day`) or its calendar day has not come — the day after the previous day was
        OPENED, in the learner's calendar, and no lock at all while the plan catches up with its event
        (`meta.opens_on`) — `meta.lock_reason: date`; while the paywall is on (наряд ACC-1 §2), 409
        `plan_day_locked` with `meta.lock_reason: subscription` for a day the learner has no subscription
        for — past day 1 of the free plan, or any day of another plan (asked first: whatever the date); 409
        `plan_day_building` while the day is next in line and its lesson is not back yet
        (`meta.lesson_status`); 409 `plan_lesson_not_ready` when the lesson failed.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
      responses:
        '200': { $ref: '#/components/responses/PlanDayCards' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or day }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/days/{number}/cards:
    get:
      tags: [Plans]
      summary: The day's cards as they stand
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
      responses:
        '200': { $ref: '#/components/responses/PlanDayCards' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or day }

  /plans/{id}/days/{number}/cards/{cardId}/answer:
    post:
      tags: [Plans]
      summary: Record the answer to one card
      description: >-
        The client grades (the payload carries everything needed) and reports the verdict, and what
        the attempt left behind (`response`). A first LAPSE — `failed` on a CHOICE, or `skipped` with
        `attempts` ≥ 2 and no `response.no_mic` on `phrase_repeat` / `phrase_other_slot` (SESSION-1d,
        DECISIONS п. 327) — deals the same card again at the end of its stage: it comes back as
        `requeued`, with a new id, a new position and its options and tiles in another order, and a
        phrase card said with ANOTHER filler of its frame (the next no card of the frame has taken
        today) — except in the listen stage, whose review shows the answers: there a first `failed` is
        final and `requeued` is null. A second lapse stays and marks the unit to return ONCE, on the
        nearest following day of any type (`returns: true`, and `unit.returns_day` says on which) — a
        frame as the kind it failed as the last time, said with another filler; a card that is itself a
        return marks nothing. Any other `skipped` is a card given up on: neither consequence. A card
        answered once is refused again (409 `plan_card_answered`); a day that is not open, 409
        `plan_day_not_open`.


        WHAT MAY BE WRITTEN IS THE KIND'S (наряд SESSION-1a, D-31) — anything else is refused with
        422 `plan_card_result_not_allowed` (`meta.kind`, `meta.result`) before the card is touched:

          * choice (`word_choose`, `word_listen`, `word_assemble`, `word_in_line`, `phrase_assemble`,
            `phrase_choose_back`, `phrase_slot`, `phrase_slot_listen`, `phrase_combine`,
            `dialogue_partner`, `listen_question`, `listen_predict`, `listen_number`) — all four:
            `passed`, `hinted`, `failed`, `skipped`;
          * spoken (`word_repeat`, `phrase_repeat`, `phrase_other_slot`, `dialogue_answer`,
            `dialogue_ask`, `speak_echo`, `speak_retell`) — `passed`, `hinted`, `skipped`; the voice
            never `failed`:
            two attempts without coverage are a skip — a lapse only on `phrase_repeat` and
            `phrase_other_slot` (SESSION-1d, п. 327: the copy and the return above), nothing on the rest;
          * judged (`speak_answer`) — only `skipped`: the pass is the judge's (`POST …/judge`), never
            the client's word. `phrase_other_slot` ASKS the judge on its last round and is not judged
            BY it (наряд FIX-2, п. 5): that round is practice, and the card's own result is its value
            rounds', written by the client like any voice card's;
          * walkthrough (`word_intro`, `phrase_intro`, `dialogue_rescue`, `listen_dialogue`,
            `listen_review`, `listen_pace`) — `passed` or `skipped`, never right or wrong.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
        - name: cardId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result, attempts]
              properties:
                result: { type: string, enum: [passed, hinted, failed, skipped] }
                attempts: { type: integer, minimum: 1, maximum: 20 }
                choice:
                  type: [string, 'null']
                  pattern: '^o\d{1,2}$'
                  description: >-
                    `id` выбранного варианта на карточке, которая несёт проверку рядом со своим
                    заданием — сейчас только `dialogue_ask` (наряд BACK-TAILS-1 §1.5). Стоит рядом с
                    `result`, а не внутри `response`, потому что у него ТЕ ЖЕ последствия, что у
                    `result` выбора: неверный — копия карточки в конец этапа, на копии — возврат
                    обмена на следующий день; голосовой итог при этом не меняется. Не отправляется,
                    если у карточки проверки нет (три ключа проверки приходят вместе или не приходят
                    вовсе) или вид её не несёт — иначе 422 `plan_card_choice_not_allowed`
                    (`meta.kind`, `meta.choice`). Сервер возвращает его в `card.response.choice`.
                response:
                  oneOf:
                    - $ref: '#/components/schemas/PlanCardAnswerResponse'
                    - type: 'null'
                  description: >-
                    Optional, additive (наряд SESSION-1a, D-30): what the attempt left behind. Only
                    the keys of `PlanCardAnswerResponse` are kept — anything else is dropped, not
                    stored — and they come back in the card's `response`.
      responses:
        '200':
          description: The answered card and the requeued one, if any
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlanAnswerOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'No such plan, day or card' }
        '409': { $ref: '#/components/responses/Problem' }
        '422':
          description: >-
            `plan_card_result_not_allowed` — the kind does not take this result (`meta.kind`,
            `meta.result`, RFC 7807); `plan_card_choice_not_allowed` — the card has no such option to
            choose (`meta.kind`, `meta.choice`); or the body itself is invalid (Laravel shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  /plans/{id}/days/{number}/cards/{cardId}/judge:
    post:
      tags: [Plans]
      summary: «Судья окна» — the server's verdict on one spoken attempt
      description: >-
        The one pass a client cannot write itself (наряд SESSION-1a, разд. 4). `speak_answer` and the
        own-word round of «Скажи целиком» (`phrase_other_slot`, наряд FIX-2 п. 5) are judged by
        MEANING: send what the recogniser heard
        (`heard` — present, and possibly empty: silence is an attempt too) and whether the frame was
        on screen before the attempt (`hinted`), and the server rules. Every other kind is 422
        `plan_card_not_judged` — `speak_retell` among them since наряд BACK-TAILS-1 §1.1: it says the
        learner's own line back, and the client counts its coverage without the network.


        The code rules first, and for free — and the two kinds are two questions (наряд CONV-2, пп. 7–8).
        «Скажи целиком» asks its frame: the words of the frame outside its slot must be covered (the
        `free` mode of the one speech rule, §`speech` of the day) — otherwise `accepted: false`,
        `reason_native` «Каркас не прозвучал — скажи его целиком», and no model is called.
        `speak_answer` is judged by MEANING AND KEYS, and the frame is not required word for word: a
        value the lesson knows heard whole — or, for a frame with no slot, the frame's own words — is
        accepted by the code («Yes it is my first visit» to «Is this your first visit here?»). On both,
        an attempt that says nothing beyond the frame's own words is refused by the code with the
        window's hint — «Не сказал главного — в какие дни это подходит» — and silence with «Не расслышал
        — скажи ещё раз». Only what is left goes to the model, told which question it is (`answer` /
        `own_value`) — one call, eight seconds, a daily cap per learner. A model that is silent, answers
        off the shape or has no call left leaves the attempt ACCEPTED on the code's word, with the words
        heard beyond the frame as `slot_value`: a learner who said the frame is not failed by a vendor.
        The reply says what was judged — `heard` — for «услышал: …» under a refusal.


        `accepted` on `speak_answer` → the card is answered: `result` is `hinted` when `hinted` was
        true, else `passed`. On «Скажи целиком» the verdict is RECORDED and the card stays open
        (`result: null`): its own-word round is practice, and the card's result comes with the
        ordinary `POST …/answer` (`hinted` means nothing there — the frame is always on screen — and
        is not kept). Not accepted → `attempts` is one more and `result` stays null: «Ещё раз» is
        another call to this endpoint, «Пропустить» an ordinary `POST …/answer` with `skipped`.
        A verdict already written is kept when the answer arrives: `response.judge` survives it.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
        - name: cardId
          in: path
          required: true
          schema: { type: string, minLength: 26, maxLength: 26 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [heard, hinted]
              properties:
                heard:
                  type: [string, 'null']
                  maxLength: 1000
                  description: 'Что распознал микрофон, как пришло; пустая строка приходит как null — молчание тоже попытка'
                hinted:
                  type: boolean
                  description: 'Каркас был открыт до попытки («Подсказать» или 5 с молчания) — тогда итог `hinted`, а не `passed`'
      responses:
        '200':
          description: The verdict and the card as it stands after it
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PlanJudgeOutcome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: >-
            `plan_not_found` — no such plan for this learner; `plan_card_not_found` — no such card on
            that day.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: >-
            `plan_day_not_open` — the day is not being walked (`meta.status`); `plan_card_answered` —
            this card already has its result.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: >-
            `plan_card_not_judged` (`meta.kind`) — this kind is graded by the client without the
            network; or the body itself is invalid (Laravel shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  /plans/{id}/days/{number}/stages/{stage}/close:
    post:
      tags: [Plans]
      summary: «Этап пройден» — verified, not trusted
      description: Refused with 409 `plan_stage_incomplete` (`meta.remaining`) while a card of the stage is unanswered. Returns the room.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
        - name: stage
          in: path
          required: true
          schema: { type: string, enum: [words, phrases, dialogue, listen, speak, recall, repetition, conversation], description: '`repetition` — «Повторение», the review day''s own stage (наряд BACK-TAILS-2 §3)' }
      responses:
        '200': { $ref: '#/components/responses/PlanDayRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: 'No such plan, day or stage' }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/days/{number}/close:
    post:
      tags: [Plans]
      summary: «День пройден» — metrics written, words filed, tomorrow unlocked
      description: >-
        Every card must be answered (409 `plan_stage_incomplete` otherwise). The day's words and
        phrases go into the plan's collection (`Plan.collection_id`, origin `plan`, hidden from
        «Мои коллекции»); the next day opens no earlier than the next calendar day in the learner's
        zone; the next scene day's lesson is queued if it is not there yet. Returns the room with
        `metrics` filled.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
      responses:
        '200': { $ref: '#/components/responses/PlanDayRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or day }
        '409': { $ref: '#/components/responses/Problem' }

  /plans/{id}/days/{number}/conversation:
    post:
      tags: [Plans]
      summary: «Начать разговор» · «Продолжить» · «Ещё раз» — the sixth stage of a day
      description: >-
        Opens the talk with the agent (наряд CONV-1, кадры 37-5…37-12) — or returns the one already
        open, which is how a phone coming back from the background carries on. The role's OPENING
        line is written here, so the ribbon is never empty waiting for somebody to speak first.


        `again: true` («Ещё раз» on the summary) closes the open talk as `replayed` and starts a new
        one: what was said stays said, and the day keeps both journals. `hints: false` is the «Без
        подсказок» switch of the entry card and is fixed for the talk it starts.


        «ПОВТОРИТЬ РАЗГОВОР» (наряд BACK-TAILS-2 §7; the talk row's `again`, наряд FIX-3 §8): once the day's sixth stage is
        walked, a new talk is a REPLAY (`replay: true`) — on a day being walked and on a PASSED day alike.
        It changes neither the day's state nor its result: the day stays closed, its minutes and what
        returns tomorrow stay the talk's that walked the stage; the replay's lines and its bill are
        written like any talk's. `plan.conversation.replays_per_day` replays per day of the plan per
        calendar day of the learner (3); past that, 409 `plan_conversation_replay_limit` with
        `meta.retry_after_utc` — the learner's next midnight, UTC — and nothing is started.


        The call waits on a model and a voice — it is the slowest call of this API by design (≤ 6 s).
        409 `plan_day_not_open` when the day is neither being walked nor passed with its talk walked;
        409 `plan_conversation_replay_limit` (above); 422 `plan_conversation_not_in_day`
        when the day has no talk — its sixth stage is skipped (dealt with nothing to talk about, or on the five
        stages of before наряд CONV-1; наряд ACC-1 §3), or no scene of it has a lesson;
        503 `plan_conversation_unavailable` when the role did not answer — nothing is written and the
        call may be repeated.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanDayNumber'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                again: { type: boolean, default: false, description: '«Ещё раз»: close the open talk and start a new one' }
                hints: { type: boolean, default: true, description: 'False — «Без подсказок»: no chip, no «Подсказать»' }
      responses:
        '200': { $ref: '#/components/responses/PlanConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such plan or day }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /plans/{id}/conversation/{conversationId}:
    get:
      tags: [Plans]
      summary: The talk as it stands — the door back in after a dropped connection
      description: >-
        The same document a move returns (кадр 37-10, «Связь пропала — разговор продолжится отсюда»),
        so a phone that lost a reply re-reads instead of guessing which half it missed. Someone
        else's talk reads as one that never existed (404).
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanConversationId'
      responses:
        '200': { $ref: '#/components/responses/PlanConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such talk }

  /plans/{id}/conversation/{conversationId}/turn:
    post:
      tags: [Plans]
      summary: One move of the learner, and the role's answer to it
      description: >-
        `said` — what the recogniser heard; `rescue` — «Не понял» / «Sorry?», the role says the same
        thing again simpler and slower (no judgement is written for it, and it spends none of the
        talk's moves: «переспросы всегда нейтральны»); `skip` — the learner let the turn go.


        Interrupting the role's voice is the phone's business and is not sent here.


        The answer is the WHOLE talk again: the ribbon, the state, the next intention and, once it is
        over, the summary. 409 `plan_conversation_not_your_turn` when the previous move is still being
        answered — a second call does not buy a second reply; 409 `plan_conversation_ended` after the
        role said goodbye («Ещё раз» is a new talk); 503 `plan_conversation_unavailable` when the role
        did not answer — NOTHING is written, the ribbon stays where it was and the move may be repeated.
      parameters:
        - $ref: '#/components/parameters/PlanId'
        - $ref: '#/components/parameters/PlanConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, heard]
              properties:
                kind: { type: string, enum: [said, rescue, skip] }
                heard:
                  type: [string, 'null']
                  maxLength: 2000
                  description: 'What the recogniser heard — present, possibly empty (silence is an answer too); ignored for `rescue` and `skip`'
      responses:
        '200': { $ref: '#/components/responses/PlanConversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such talk }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /sync/cursor:
    get:
      tags: [Study]
      summary: The client_seq high-water mark per log
      description: >-
        Greatest client_seq the server holds for this user, per append-only log. Clients seed
        their monotonic client_seq counter from here on login, so a reinstall (counter reset) or
        a second device does not emit sequences that would lose to already-stored rows. Values
        are 0 when a log is empty. (Delta sync, GET /sync?since=, will grow alongside this.)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      max_triage_seq: { type: integer, minimum: 0 }
                      max_review_seq: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sync:
    get:
      tags: [Study]
      summary: Delta sync — changes to mirror into the client's local database
      description: >-
        The offline feed. The client mirrors collections, items, terms (with content) and progress
        into a local DB and reads every screen from there; this endpoint only refreshes it.


        Send `since` = the `server_time` from your last completed sync (NOT the device clock — it
        drifts). Omit `since` for the first, full snapshot after install. Page with `next_cursor`
        (opaque) until `has_more` is false, then store the new `server_time` as your next `since`.


        `since` is INCLUSIVE: timestamps are second-precision, so the boundary second is re-sent
        to guarantee no change is ever missed. Apply changes idempotently by id (last-write-wins by
        `updated_at`) — re-applying a row you already have is a no-op. Deletions arrive as
        `op: "delete"` tombstones (collection soft-delete, item soft-delete) so ghosts don't linger;
        a full snapshot (no `since`) omits deletes. Only terms in the user's own collections are
        synced — never the global dictionary.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
          description: A prior response's server_time. Inclusive. Omit for a full snapshot.
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "Opaque, from a previous page's next_cursor." }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
        - name: timezone
          in: query
          required: false
          schema: { type: string, example: Europe/Kyiv }
          description: >-
            The device's IANA zone. Optional and purely additive — the response is identical with or
            without it. Send it on every sync: the profile otherwise learns the zone only at sign-in
            and on a profile edit, so a learner who moves keeps studying on the old country's
            calendar. An unrecognised or empty value is ignored silently; it never fails the sync.
            Changing the zone does NOT reschedule existing cards — they keep the `due_at` they have,
            and only answers given after the change are planned on the new calendar.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [server_time, has_more, changes]
                    properties:
                      server_time: { type: string, format: date-time, description: Store as the next `since` once has_more is false. }
                      next_cursor: { type: string, nullable: true, description: Pass back verbatim while has_more is true. }
                      has_more: { type: boolean }
                      settings:
                        type: object
                        description: >
                          The user's settings, sent whole on every page rather than diffed — they are
                          tiny, and a missed delta would strand a client on stale settings.
                        properties:
                          exercise_modes:
                            type: array
                            description: >
                              The trainers this user has switched on, IN ROTATION ORDER (their own
                              override, or the product default). The client mirrors this into its
                              offline practice builder, so a toggle takes effect on the next sync.
                            items: { type: string, enum: [multiple_choice, word_bank, typing, listening, cloze, scramble, dictation, pick_correct, speaking, description_match, intro] }
                          mode_admission:
                            type: array
                            description: >
                              The ACQUISITION LADDER matrix: which rung opens which trainer, and
                              where that trainer's options come from. Rides along for the same
                              reason as the toggles — the device builds sessions offline, so it
                              needs to know not only which trainers exist but which of them this
                              pair has earned. Stored per user with the same override mechanism
                              as the toggles.
                            items:
                              type: object
                              properties:
                                mode: { type: string }
                                min_acquisition: { type: string, enum: [new, learning, graduated] }
                                min_learning_step: { type: integer, minimum: 0, maximum: 2, nullable: true }
                                min_reps:
                                  type: integer
                                  minimum: 0
                                  nullable: true
                                  description: Reviews since GRADUATION, not since the first meeting.
                                options_policy:
                                  type: string
                                  enum: [distant, standard]
                                  description: >-
                                    `distant` = wrong options are the session's own neighbours,
                                    unmistakably different, which is what makes a first meeting
                                    winnable. `standard` = the enrichment distractors, which are
                                    nearly right and are the exercise once the word is known. A
                                    graduated pair always gets `standard`.
                                min_step:
                                  type: integer
                                  minimum: 0
                                  maximum: 5
                                  description: >-
                                    The three thresholds resolved to a rung. Sent as well as them
                                    so the client filters by rung without re-implementing the
                                    ladder function.
                      changes:
                        type: object
                        properties:
                          collections:
                            type: array
                            items:
                              type: object
                              description: 'op=upsert carries the fields; op=delete carries id + updated_at only.'
                              properties:
                                id: { type: string }
                                op: { type: string, enum: [upsert, delete] }
                                updated_at: { type: string, format: date-time }
                                title: { type: string, nullable: true }
                                description: { type: string, nullable: true }
                                topic: { type: string, nullable: true }
                                source_lang: { type: string, nullable: true }
                                target_lang: { type: string, nullable: true }
                                items_count: { type: integer }
                                source: { type: string, nullable: true, enum: [curated, ai, user], description: 'origin; drives the client badge' }
                                type: { type: string, nullable: true, enum: [system, shared, custom], description: 'my / store / generated distinction' }
                                image_url: { type: string, nullable: true, description: 'Pexels cover; null = none, show a placeholder' }
                                image_author: { type: string, nullable: true, description: 'photographer credit (Pexels licence)' }
                                image_author_url: { type: string, nullable: true, description: 'link to the photographer' }
                                is_default: { type: boolean, description: 'the owner''s «Сохранённые» folder — one per owner, undeletable' }
                                origin:
                                  type: string
                                  nullable: true
                                  enum: [plan]
                                  description: >-
                                    WHERE THE FOLDER CAME FROM, when it did not come from the
                                    learner. `plan` is a plan DAY's folder: an ordinary private
                                    collection that the plan owns, sent so a card's pair can be
                                    resolved through it, and NOT one of the learner's own shelves.
                                    The device must leave it out of «Мои коллекции» and out of the
                                    home screen's word-challenge (Д-34, Д-35). Null everywhere else.
                                is_reference:
                                  type: boolean
                                  description: >-
                                    A PHRASEBOOK, not a course: the studied language (`target_lang`)
                                    carries no trainers at all — zh and ja in v1 (DECISIONS пп. 84,
                                    136). Such a collection shows a term, a translation and audio,
                                    and offers neither training nor enrolment; its words never enter
                                    the pool, the schedule or the daily goal, and the server refuses
                                    them at both doors (`PUT /pool/terms/{id}` 422, `/triage/batch`
                                    `rejected`). DERIVED from the language, never stored — it rides
                                    the feed because which languages this deployment can teach is a
                                    server capability that changes without a client release.
                          collection_items:
                            type: array
                            items:
                              type: object
                              properties:
                                collection_id: { type: string }
                                term_id: { type: string }
                                op: { type: string, enum: [upsert, delete] }
                                updated_at: { type: string, format: date-time }
                                position: { type: integer }
                                note: { type: string, nullable: true }
                          terms:
                            type: array
                            items:
                              type: object
                              description: Content for the offline card; audio is optional (system TTS works offline).
                              properties:
                                id: { type: string }
                                op: { type: string, enum: [upsert] }
                                updated_at: { type: string, format: date-time }
                                text: { type: string, nullable: true }
                                type: { type: string, enum: [word, phrase, idiom, phrasal_verb], nullable: true }
                                transcription: { type: string, nullable: true }
                                translation: { type: string, nullable: true }
                                example: { type: string, nullable: true }
                                example_translation: { type: string, nullable: true }
                                description:
                                  type: string
                                  nullable: true
                                  description: >
                                    What the word MEANS, in the language BEING LEARNED — the whole question of a
                                    `description_match` card. It rides the mirror rather than only the card because
                                    the device builds its own practice sessions offline. Null on content written
                                    before descriptions existed (the store catalogue), which is not being backfilled;
                                    the trainer refuses such a term by content, like every other trainer.
                                image_url: { type: string, nullable: true, description: 'Pexels photo; null = none, show a placeholder' }
                                image_author: { type: string, nullable: true, description: 'photographer credit (Pexels licence)' }
                                image_author_url: { type: string, nullable: true, description: 'link to the photographer' }
                                accepted_variants:
                                  type: array
                                  description: >
                                    Extra CORRECT answers for this term, beyond `text` (e.g. this/that, may/can,
                                    colour/color). The client grades typed answers offline against
                                    `{text} ∪ accepted_variants` — the same set the server grades against, so the
                                    device is never stricter than the server. Empty when the term has none.
                                  items: { type: string }
                                example_distractors:
                                  type: array
                                  description: >
                                    Deliberately WRONG versions of `example`, each with its error typed and located.
                                    Mirrored ahead of the trainer that consumes them; no client feature reads these yet.
                                  items:
                                    type: object
                                    properties:
                                      sentence: { type: string }
                                      error_type: { type: string, enum: [article, preposition, tense, word_order, false_friend, modal_to] }
                                      error_span: { type: string, description: 'the wrong fragment, verbatim from `sentence`' }
                                      correction: { type: string }
                                synonyms:
                                  type: array
                                  description: >
                                    ADDITIVE. Near-SYNONYMS of the term, in the language being learned
                                    (`purpose` → `goal`, `aim`). NOT the same thing as
                                    `accepted_variants` and deliberately not merged into it: a variant
                                    is another SPELLING of this word and is right wherever the word is
                                    typed, a synonym is another WORD and is right only where the card
                                    asked what the term MEANS. The server accepts one on
                                    multiple_choice / word_bank / typing / description_match and the
                                    word form of speaking, and on nothing else — a client that folded
                                    the two lists together would green-light `goal` on a listening
                                    card for `purpose`, i.e. be LOOSER than the server. Empty when the
                                    станок has not run over the term. No client reads these yet.
                                  items: { type: string }
                                transliteration:
                                  type: string
                                  nullable: true
                                  description: >
                                    ADDITIVE. How the TERM reads, spelled in the letters of the
                                    pair's SUPPORT language — «cómo estás» → «комо эстас». Beside
                                    `transcription` and never instead of it: that one is IPA, one per
                                    term, in a notation the learner has to have been taught; this one
                                    is per PAIR, in an alphabet they already read, and a Ukrainian
                                    learner gets a different string from a Russian one for the same
                                    word. Null when the pair has no hint — including, deliberately,
                                    when the two languages share an alphabet and the word already
                                    reads as it is written. No client reads this yet.
                                translations:
                                  type: array
                                  description: >
                                    ADDITIVE. Every reading this term has in the pair's support
                                    language, the pinned one FIRST — so `translations[0]` is always the
                                    `translation` field above, unchanged. The rest are alternatives
                                    («цель», then «задача»), carried so the device can eventually stop
                                    telling a learner who typed the second one that they are wrong.
                                    A term with one reading sends a one-element list. No client reads
                                    these yet.
                                  items: { type: string }
                          progress:
                            type: array
                            items:
                              type: object
                              properties:
                                term_id: { type: string }
                                op: { type: string, enum: [upsert] }
                                updated_at: { type: string, format: date-time }
                                state:
                                  type: string
                                  enum: [new, learning, review, relearning, known]
                                  description: >-
                                    The SCHEDULER's dimension — WHEN the pair comes back. Says
                                    nothing about what it comes back as; see `acquisition`.
                                ease_factor: { type: number }
                                interval_days: { type: integer }
                                due_at: { type: string, format: date-time, nullable: true }
                                reps: { type: integer }
                                lapses: { type: integer }
                                last_reviewed_at: { type: string, format: date-time, nullable: true }
                                acquisition:
                                  type: string
                                  enum: [new, learning, graduated]
                                  description: >-
                                    The ACQUISITION LADDER's dimension — WHAT the pair comes back
                                    as. Orthogonal to `state`: the scheduler never reads it and it
                                    never reads the scheduler. `new` = never shown (its first card
                                    is the intro); `learning` = working through the two recognition
                                    steps, which log answers but schedule nothing; `graduated` =
                                    off the recognition rungs, where ordinary SRS runs and the rung
                                    widens with `successful_reviews`.
                                learning_step:
                                  type: integer
                                  minimum: 0
                                  maximum: 2
                                  description: >-
                                    The rung while `acquisition` is `learning`. Not derivable from
                                    any counter: a FAILED recognition step is re-queued as the same
                                    step but is still logged, so anything derived from the log would
                                    push the pair up a rung it has not earned. Combine with
                                    `acquisition` and `successful_reviews` through the shared ladder
                                    function to get the rung.
                                successful_reviews:
                                  type: integer
                                  minimum: 0
                                  description: >-
                                    Correct non-practice reviews since the pair graduated — what the
                                    ladder's rungs above assembly (typing, dictation) are counted in.
                                    Deliberately NOT `reps`, which counts how many times the
                                    scheduler was CALLED, `again` included: reading the rung off
                                    `reps` promoted words the learner had only ever got wrong, since
                                    a miss re-schedules the pair immediately. Grows on a correct
                                    answer (`hard` included) and never decreases — a rung, once
                                    earned, is not taken back.
                                enrolled_at:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: >-
                                    POOL MEMBERSHIP — a third dimension, independent of the two
                                    above: not when the pair comes back, nor as what, but WHETHER
                                    it comes back at all. Non-null = the learner is studying this
                                    word and sessions may deal it; null = it is in the catalogue
                                    only (never taken into study, marked `знаю`, or paused with
                                    «Убрать из изучения»). Null is not a tombstone — the row and its
                                    whole history stay, which is what makes a pause undoable. The
                                    device mirrors it because «Мои слова» and its offline session
                                    builder both read the pool from the local database.
                          triages:
                            type: array
                            description: >-
                              Governing triage verdict per term (greatest client_seq). Append-only,
                              so always op=upsert (no tombstone). The client upserts these into its
                              local triage marker so a sign-out wipe + re-login can't resurrect an
                              `unknown` swipe (which writes no progress row) in the deck.
                            items:
                              type: object
                              properties:
                                term_id: { type: string }
                                op: { type: string, enum: [upsert] }
                                updated_at: { type: string, format: date-time, description: 'server receipt time of the governing swipe' }
                                verdict: { type: string, enum: [known, unknown, unsure] }
                                client_seq: { type: integer }
                                collection_id: { type: string, nullable: true, description: 'where the swipe came from (informational)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    UlidId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    PlanId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 26, maxLength: 26 }
    PlanDayNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 10 }
    PlanConversationId:
      name: conversationId
      in: path
      required: true
      description: The talk with the agent (наряд CONV-1)
      schema: { type: string, minLength: 26, maxLength: 26 }
    AcceptLanguageNative:
      name: Accept-Language
      in: header
      required: false
      description: >-
        The device's languages (наряд LANG-1 §7). On the sign-in that CREATES the profile, the first entry
        whose primary subtag is a plan native (ru, uk, be, pl, ro, es, it, de, fr) becomes
        `profile.native_language` — `uk-UA,uk;q=0.9` → uk, `be-BY` → be; none of them (English, or no
        header) leaves the default `ru`. A profile that exists already is never changed by it.
      schema: { type: string }

  requestBodies:
    ProfileUpdate:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              native_language: { type: string, minLength: 2, maxLength: 2, description: "The language the learner reads: any code of the server's language catalogue — ru, en, uk, be, ro, es, de, fr, it, pt, pl, tr, zh, ja (the support side of collections and search, DECISIONS п. 85); another code is a 422. A plan is built only for the plan natives (`GET /languages` → `natives`); outside them `POST /plans` answers `language_pair_invalid`." }
              target_language: { type: string, minLength: 2, maxLength: 5 }
              cefr_level: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
              daily_goal: { type: integer, minimum: 0, maximum: 100 }
              timezone: { type: string, description: "Device IANA timezone (e.g. Europe/Kyiv); the scheduler floors day-scale due dates to the start of the user's day in it (F19). Send it at login and whenever the device zone changes. Validated as an IANA zone." }
              onboarded: { type: boolean, description: "Send true on the onboarding-finish call to stamp profiles.onboarded_at once (never overwritten). Regular edits omit it." }
              gender: { type: [string, 'null'], enum: [female, male, null], description: "The learner's gender (GEN-2a), optional. The lesson of a plan day is written with it (LEARNER_GENDER — the grammar of the learner's own lines in their language); null clears it and the lesson hears «unknown»." }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PoolMembership:
      description: The pair's pool membership after the call
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                required: [term_id, enrolled, changed]
                properties:
                  term_id: { type: string, minLength: 26, maxLength: 26 }
                  enrolled:
                    type: boolean
                    description: Where the pair now stands — true after PUT, false after DELETE.
                  changed:
                    type: boolean
                    description: >-
                      Whether THIS call moved anything. False for a replayed request from an
                      offline queue, which is an ordinary outcome rather than an error.
    Plan:
      description: The plan, whole
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Plan' }
    PlanBuild:
      description: The build status
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/PlanBuild' }
    PlanDayRoom:
      description: The day's room
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/PlanDayRoom' }
    PlanConversation:
      description: The talk with the agent, whole
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/PlanConversation' }
    PlanDayCards:
      description: The day's cards
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/PlanDayCards' }
    ValidationError:
      description: Input validation failed (Laravel shape)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    LanguageOption:
      type: object
      description: A language as a picker draws it — from the server's one catalogue (наряд LANG-1 §7).
      required: [code, endonym, flag]
      properties:
        code: { type: string, pattern: '^[a-z]{2}$', description: ISO 639-1 }
        endonym: { type: string, description: "The language's name in itself (`Беларуская`, `Polski`)" }
        flag: { type: string, description: The emoji flag shown beside it }

    PlanLanguageOptions:
      type: object
      description: Both sides of a plan's pair, in the order the screens offer them (`GET /languages`).
      required: [targets, natives]
      properties:
        targets:
          type: array
          description: What a plan may teach — the same codes as `GET /plans/languages`.
          items: { $ref: '#/components/schemas/LanguageOption' }
        natives:
          type: array
          description: What a plan may be read in — the learner's own language.
          items: { $ref: '#/components/schemas/LanguageOption' }

    PlanVersions:
      type: object
      description: Which server build and which prompt files are answering — stamped on every plan and lesson.
      required: [build, prompt_plan, prompt_lesson]
      properties:
        build: { type: string, description: 'The server build (commit), `unknown` when not stamped' }
        prompt_plan: { type: string, description: 'The plan builder prompt file''s version, e.g. `plan-builder-v2`' }
        prompt_lesson: { type: string, description: 'The lesson prompt file''s version, e.g. `lesson_day.v4.5`' }

    PlanBuild:
      type: object
      description: >-
        What the client polls after creating a plan. Four values and no fifth: a plan that is built
        reads `ready` whatever it has become since — «Начать» is legal while day 1's lesson is still
        being written, and a poll that outlives the press must not answer with a word this endpoint
        does not have.
      required: [id, status, scenes_count, versions]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        status: { type: string, enum: [building, unclear, failed, ready] }
        unclear_reason: { type: [string, 'null'], description: 'The model''s one sentence (English, for the log) when the goal is not a situation' }
        fail_reason: { type: [string, 'null'] }
        scenes_count: { type: integer }
        cost_usd: { type: [string, 'null'], description: 'USD, six decimals — the sum of every attempt of the plan call' }
        latency_ms: { type: [integer, 'null'] }
        attempts: { type: [integer, 'null'], description: '1 or 2 — the model is retried once on a refused answer' }
        versions: { $ref: '#/components/schemas/PlanVersions' }

    PlanSummary:
      type: object
      description: A plan as a row of the list.
      required: [id, status, goal_text, days_total, created_at]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        status: { type: string, enum: [building, unclear, failed, ready, active, finished, overdue] }
        title_native: { type: [string, 'null'] }
        goal_text: { type: string }
        event_date: { type: [string, 'null'], format: date }
        days_total: { type: integer }
        collection_id: { type: [string, 'null'] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    PlanImage:
      type: object
      description: A stock photo with the credit its licence asks for.
      required: [url]
      properties:
        url: { type: string }
        author: { type: [string, 'null'] }
        author_url: { type: [string, 'null'] }
        tone: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$', description: 'The photo''s average colour — paint the placeholder with it. Null for photos stored before tones were kept (until the backfill); on a card payload''s term photo it is absent' }

    PlanSceneImage:
      description: >-
        A scene photo: the vendor's address and credit, its tone, and the two square copies the
        server keeps (`GET /plans/images/{sceneId}/{size}`). `url_112` is for a 56-pt circle at 2x,
        `url_448` for 4x and larger. Both are absolute and versioned — cache them forever.
      allOf:
        - $ref: '#/components/schemas/PlanImage'
        - type: object
          required: [tone, url_112, url_448]
          properties:
            url_112: { type: string, format: uri }
            url_448: { type: string, format: uri }

    PlanRouteStage:
      type: object
      required: [stage, state]
      properties:
        stage: { type: string, enum: [words, phrases, dialogue, listen, speak, recall, repetition, conversation], description: '`recall` — «Вспомнить» of the rehearsal; `repetition` — «Повторение», the review day''s own stage, where its cards used to stand under `speak` (наряд BACK-TAILS-2 §3); `conversation` — the talk with the agent, the sixth node (наряд CONV-1). The node of the talk is `done` once the journal of stages says it was walked — a replay («Ещё раз») going on beside it does not turn it back (наряд CONV-2)' }
        state:
          type: string
          enum: [done, current, locked]
          description: Exactly these three words — any other is an error for the client

    PlanDaySlot:
      type: object
      description: >-
        WHEN a day sits in the learner's calendar. `label_native` is the ready word («сегодня»,
        «завтра») for the two slots that have one; for `date` the client formats `date` itself;
        `past` is the day it was closed. The days after the current one are counted one per calendar
        day FROM THE CURRENT DAY'S OWN DATE, so `today` and `tomorrow` are each worn by at most one
        day of a route.
      required: [code]
      properties:
        code: { type: string, enum: [today, tomorrow, date, past, unscheduled] }
        date: { type: [string, 'null'], format: date }
        label_native: { type: [string, 'null'] }

    PlanDayRoute:
      type: object
      description: >-
        One day on the route. `status` is EFFECTIVE for today — a locked day whose predecessor is closed and whose date has come
        (or whose plan catches up, `catch_up`) reads `open`; a day next in line whose lesson is not back yet reads `building`
        (not `locked`, not `failed`: no button, ask again — GEN-3 §11). A `locked` day says why in `lock_reason` (наряд ACC-1
        §2): `date` — the lock there always was; `subscription` — the paywall (only while it is switched on).
      required: [id, number, type, status, lock_reason, slot, cards_total, cards_done, minutes_spent]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        number: { type: integer, minimum: 1, maximum: 10 }
        type: { type: string, enum: [scene, review, rehearsal] }
        status: { type: string, enum: [locked, building, open, in_progress, closed] }
        lock_reason:
          type: [string, 'null']
          enum: [date, subscription, null]
          description: >-
            WHY a `locked` day is locked (наряд ACC-1 §2); null for a day that is not locked (`building` is not a lock).
            `date` — its calendar day has not come, the day before it is not closed, the plan is not started (every lock
            before the наряд). `subscription` — the paywall holds it: the learner has no subscription, and the day is past
            day 1 of their free plan (their first plan ever) or of another plan. Days in progress and closed days are never
            locked by it. Only while `access.paywall_enabled` is on; off, a day is never `subscription`.
        scene_id: { type: [string, 'null'] }
        title_native: { type: [string, 'null'], description: '≤ 18 characters by the prompt''s rule; the client ellipsises a longer one' }
        title_target: { type: [string, 'null'] }
        teaches_native: { type: [string, 'null'], description: '≤ 34 characters by the prompt''s rule' }
        lesson_status: { type: [string, 'null'], enum: [pending, building, ready, failed, null] }
        opens_on: { type: [string, 'null'], format: date }
        slot: { $ref: '#/components/schemas/PlanDaySlot' }
        cards_total: { type: integer, description: 'The cards dealt to the day; grows when a failed card is dealt again' }
        cards_done: { type: integer, description: 'Refolded on every answer — a day being walked shows its own progress, not a zero until it closes' }
        minutes_spent: { type: integer }
        opened_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        stages:
          type: array
          items: { $ref: '#/components/schemas/PlanRouteStage' }
          description: >-
            ONLY the stages the day has, in walking order — a stage with no cards is omitted, never
            `absent`. A dealt day (open / in_progress / closed) is counted off its cards: all
            answered → `done`, the first unfinished → `current`, the rest `locked`; a closed day is
            all `done`. A day not dealt yet: the current day with a written lesson shows what the
            dealer will deal, any other day its type's stages (scene — five, review — words and
            speak, rehearsal — speak); its first stage is `current` only when it is the plan's
            current day and may be started today, otherwise all `locked`.

    PlanScene:
      type: object
      required: [id, order, kind, priority, title_native, title_target, teaches_native, goals_native, lesson_status]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        order: { type: integer }
        kind: { type: string, enum: [situation, variant] }
        priority: { type: integer, description: '1 is the core — the one scene that is never dropped' }
        title_native: { type: string }
        title_target: { type: string }
        teaches_native: { type: string }
        goals_native: { type: array, items: { type: string }, description: '3–4 goals, each ≤ 30 characters by the prompt''s rule' }
        learner_role_target: { type: string }
        learner_role_native: { type: string }
        partner_role_target: { type: string }
        partner_role_native: { type: string }
        image:
          oneOf:
            - $ref: '#/components/schemas/PlanSceneImage'
            - type: 'null'
        lesson_status: { type: string, enum: [pending, building, ready, failed], description: '`building` also while the lesson is written and its photos are being found — a day is `ready` with its pictures on it (DAY-UI-3)' }
        lesson_fail_reason: { type: [string, 'null'], description: 'Why a `failed` lesson failed — for logs and the admin, not parsed by the client. A lesson the gate failed (a fatal validator finding left after two card repairs, or one no card can take) reads `fatal: <codes>`, e.g. `fatal: line.ne_frame, check.shape` (GEN-2a)' }
        day_number: { type: [integer, 'null'], description: 'Which day the scene stands on; null for a scene not (yet) on the route' }
        cost_usd: { type: [string, 'null'] }
        latency_ms: { type: [integer, 'null'] }
        prompt_version: { type: [string, 'null'] }

    PlanRescuePhrase:
      type: object
      required: [text_target, text_native, pronunciation_native]
      properties:
        text_target: { type: string }
        text_native: { type: string }
        pronunciation_native: { type: string }

    Plan:
      type: object
      description: >-
        The plan, whole — tab and preview alike (docs/plan-v2.md). Every event-inflecting string
        arrives ready: `until_phrase` («До приёма · 5 дней»), `overdue_native` («Приём был вчера»),
        `route_summary` («5 дней · 3 ситуации, 1 повторение, репетиция»), the day slots. Dates and
        numbers are raw; the client formats them.
      required: [id, status, goal_text, target_lang, native_lang, level, days_total, days_requested, route_summary, days, scenes, rescue_kit, cost_usd, versions, created_at, catch_up]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        status: { type: string, enum: [building, unclear, failed, ready, active, finished, overdue], description: '`overdue` is derived — an active plan whose event date has passed' }
        goal_text: { type: string }
        target_lang: { type: string }
        native_lang: { type: string }
        level: { type: string, enum: [beginner, intermediate] }
        days_total: { type: integer, minimum: 1, maximum: 10 }
        days_requested: { type: integer, description: 'What the learner asked for; larger than `days_total` when the date shortened the plan' }
        days_shortened_from: { type: [integer, 'null'], description: 'Non-null when the event date shortened the plan — the client shows the line' }
        event_date: { type: [string, 'null'], format: date }
        days_left: { type: [integer, 'null'], description: 'Calendar days until the event; negative once it has passed; null without a date' }
        title_native: { type: [string, 'null'] }
        title_target: { type: [string, 'null'] }
        event_native: { type: [string, 'null'] }
        until_phrase: { type: [string, 'null'], description: 'The countdown header, ready — null without a date or once the event has passed' }
        overdue_native: { type: [string, 'null'], description: 'The prompt''s own sentence, present only while the plan is overdue' }
        route_summary: { type: string }
        catch_up:
          type: boolean
          description: >-
            «Догоняем» (GEN-3 §11): the calendar days left until the event, its own day included, are no more than the days
            not passed — no day waits for its date, the next one opens as soon as the one before it closes. Always false
            without an event date and after it.
        reminder_hour:
          type: integer
          minimum: 8
          maximum: 23
          description: >
            Local hour of the daily reminder and «сегодня разговор» — ONE rule for the server and the
            phone: the learner's usual visit hour (median of the last seven visits, down to the hour),
            19 without visits, never before 8.
        summary:
          type: [string, 'null']
          description: >-
            The plan in one sentence, computed on read: the first three scene days' titles in route
            order (never a review or the rehearsal), lowercased and joined, the first letter raised,
            then the promise — «Регистрация на рейс, заселение в отель, ресторан. К 17 сентября
            скажешь всё это сам», or «… Скажешь всё это сам» without a date. In the learner's native
            language (ru, uk, en; others fall back to English). Null when no scene has a title.
        learner_role_target: { type: [string, 'null'] }
        learner_role_native: { type: [string, 'null'] }
        cover_image:
          oneOf:
            - $ref: '#/components/schemas/PlanImage'
            - type: 'null'
        collection_id: { type: [string, 'null'], description: 'The plan''s collection once a day has been closed (origin `plan`)' }
        unclear_reason: { type: [string, 'null'] }
        fail_reason: { type: [string, 'null'] }
        current_day:
          oneOf:
            - $ref: '#/components/schemas/PlanDayRoute'
            - type: 'null'
          description: The first day that is not closed; null when every day is closed
        days:
          type: array
          items: { $ref: '#/components/schemas/PlanDayRoute' }
        scenes:
          type: array
          items: { $ref: '#/components/schemas/PlanScene' }
        rescue_kit:
          type: array
          description: The language pack's five rescue phrases — a static list, the same in every plan of the pair
          items: { $ref: '#/components/schemas/PlanRescuePhrase' }
        cost_usd: { type: string, description: 'The plan call plus every lesson call, USD six decimals' }
        versions: { $ref: '#/components/schemas/PlanVersions' }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    PlanStageProgress:
      type: object
      required: [stage, total, done, state, cards]
      properties:
        stage: { type: string, enum: [words, phrases, dialogue, listen, speak, recall, repetition, conversation], description: 'Every stage of cards in walking order, `absent` where the day has none — `recall` is the rehearsal''s, `repetition` the review''s (наряд BACK-TAILS-2 §3); the talk''s row (`conversation`) has no cards: `total` and `done` are 0, `cards` empty; `done` once the stage is walked (наряд CONV-2)' }
        total: { type: integer }
        done: { type: integer }
        state:
          type: string
          enum: [locked, current, done, absent]
          description: >-
            The first stage with an unanswered card is `current`, the ones before it `done`, the
            ones after `locked`. A day whose lesson is written knows its stages BEFORE it is opened
            — the totals are what `POST …/open` will deal — so `absent` means «no lesson yet», not
            «not opened yet».
        cards:
          type: array
          description: >-
            Карточки этапа в порядке `position` — с ними этап можно проходить, не спрашивая
            `…/cards` отдельно (наряд SESSION-1a, D-04, аддитивно). Пустой список у дня, который ещё
            не открывали: у его наброска есть числа, но нет id, а отвечать можно только по id.
          items: { $ref: '#/components/schemas/PlanCard' }

    PlanProgramUnit:
      type: object
      description: >-
        One unit of the day's program — a word, a phrase or an exchange — and where it stands: what
        the tab's plate counts («8 новых слов», «вернутся в день N»). The words of the programme are
        the window's (`PlanDayWindow.program`). The listen stage's `day` unit is not a unit of the
        programme and is never listed here (наряд SESSION-1a, D-05).
      required: [unit_kind, source, state]
      properties:
        unit_kind: { type: string, enum: [word, phrase, exchange] }
        source: { type: string, enum: [today, returned] }
        state: { type: string, enum: [pending, passed, failed] }

    PlanDayMetrics:
      type: object
      required: [cards_total, minutes_spent]
      properties:
        cards_total: { type: integer }
        minutes_spent: { type: integer, description: 'The cards'' minutes, from answer timestamps (gaps over two minutes not counted — the learner away, наряд FIX-3 §2), plus `summary.minutes` of the talk that walked the sixth stage — from the moment it walked it; a replay adds nothing (наряд BACK-TAILS-2 §8)' }

    PlanWindowSummary:
      type: object
      description: The counts a programme tab's brow is worded from — «ДИАЛОГ · 15 · 8 СВОИХ · 7 ВЕРНУЛОСЬ». The client counts nothing.
      required: [total, done, returns]
      properties:
        total: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0, description: 'Units every card of which is answered, none failed twice' }
        returns: { type: integer, minimum: 0, description: 'Units of the tab that CAME BACK from earlier days — `source: returned` (наряд FIX-3 §9: the gym day 2 dialogue is 8 own lines and 7 returned, `returns` 7). Not the units that will come back tomorrow: those are the items with `state: returns_tomorrow`' }

    PlanWindowSource:
      type: string
      enum: [own, returned]
      description: 'Where a unit of the programme comes from (наряд FIX-3 §9): `own` — the day''s own scene; `returned` — an earlier day, back to be walked again (its `scene` says which)'

    PlanWindowUnitScene:
      type: object
      additionalProperties: false
      description: 'The scene a unit of the programme is from, as the plan names it (наряд FIX-3 §9) — the day''s own scene for `own`, the earlier one for `returned`'
      required: [id, title_native, day_number]
      properties:
        id: { type: string }
        title_native: { type: string }
        day_number: { type: [integer, 'null'], minimum: 1, description: 'The day of the route the scene stands on; null for a scene with no day of its own (a stand put together by hand)' }

    PlanStageSummary:
      type: object
      additionalProperties: false
      description: >-
        «Итог этапа» (кадр 30-6, наряд FIX-3 §10) — counted by the server over the stage's cards, the client counts nothing.
        A stage of words, phrases, dialogue or speech counts its UNITS: walked when every card of the unit is answered,
        first-try when every one of them passed at the first attempt, coming back when a card of it says so. «Слушаю и
        отвечаю» counts its questions, «Повторение» its cards as dealt, «Вспомнить» the lines said aloud without the sheet.
      required: [done, total, first_try, returns]
      properties:
        done: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        first_try: { type: integer, minimum: 0, description: '«С первого раза»' }
        returns: { type: integer, minimum: 0, description: 'What comes back tomorrow' }

    PlanWindowUnitState:
      type: string
      enum: [pending, done, returns_tomorrow]
      description: >-
        Where a unit stands, over all its cards of the day. The listen stage's own cards are about
        the visit as a whole (`unit.kind = day`) and walk no unit of the programme. Any other word
        is a contract error on the client.

    PlanWindowStage:
      type: object
      description: >-
        One stage row of the day window. `done_count`, `total` and `minutes_left` are NOT null on the
        `current` row only — the client prints a number nowhere else. A day not started has every row
        `locked` (no current row, no number); a passed day has every row `done`. `minutes` — the
        stage's planned minutes — is on EVERY row in every state (наряд BACK-TAILS-2 §4).
      required: [stage, state, done_count, total, minutes_left, minutes, share, talk_title_native, scenes_count, targets, again, summary]
      properties:
        stage: { type: string, enum: [words, phrases, dialogue, listen, speak, recall, repetition, conversation], description: 'The stages the day deals, in walking order; the rehearsal has `recall` and `conversation`, a review day `repetition` (its own cards, наряд BACK-TAILS-2 §3; `words` and `phrases` when something comes back to them) and `conversation`' }
        state: { type: string, enum: [done, current, locked] }
        done_count: { type: [integer, 'null'], description: 'Null on the talk''s row always: it has no cards to count' }
        total: { type: [integer, 'null'] }
        minutes_left: { type: [integer, 'null'], description: 'By the pace of the stage (`DayPace`), rounded up; on the talk''s row — the talk''s own budget' }
        minutes: { type: integer, minimum: 0, description: 'What the WHOLE stage is reckoned to take, in whole minutes, rounded up — «около 4 минут» on the rows of a day not opened yet (кадры 37-1, 37-2). A stage of cards: every card of it by the PLAN''s price list (`plans.pace`, the snapshot of `plan.pace` measured on the phone, наряд FIX-3 §2; «Скажи целиком» per round, the «Вспомнить» sheet per scene, its lines said aloud per card); the talk''s row: its own budget, `plan.conversation.minutes` — 5 on a scene day, 6 on the rehearsal, 4 on a review. 0 where the day has no cards to price yet' }
        share: { type: number, minimum: 0, maximum: 1, description: 'The row''s bar: 1 done, 0 locked, answered/total current' }
        talk_title_native: { type: [string, 'null'], description: 'The talk''s row only (наряд CONV-2, п. 12): the entry title «Поговори с врачом» — the role the talk opens with, in the instrumental, inflected by the server (кадр 37-5); a talk over several scenes — every role in the order it walks them, the preposition once (наряд FIX-4c §4): «Поговори с регистратором и врачом», «Поговори с регистратором, врачом и медсестрой»; «Поговори с собеседником» («…с собеседниками» for several) when a role cannot be inflected with certainty. Null on every card row' }
        scenes_count: { type: [integer, 'null'], minimum: 0, description: 'The talk''s row only (наряд CONV-2, п. 12): how many scenes the talk walks — 1 on a scene day, all the ready scenes on the rehearsal («Разговор целиком · 3 сцены»), the repeated days'' scenes on a review day. Null on every card row' }
        targets:
          type: [array, 'null']
          maxItems: 7
          description: >-
            The talk's row only (наряд BACK-TAILS-2 §4): «Скажи в разговоре» before the talk is started — EXACTLY the
            list `POST …/days/{number}/conversation` starts the talk with (one selector of the day; no second set),
            the rehearsal over all its scenes, a review over its own. `said` is where the day's LATEST talk left each
            phrase (a replay too); false everywhere while the day has no talk yet. Null on every card row.
          items: { $ref: '#/components/schemas/PlanConversationTarget' }
        again:
          type: boolean
          description: >-
            «Ещё раз» of the row (наряд FIX-3 §8): a stage of cards — always true, on a day being walked and on a passed
            day alike (the cards are walked once more over `GET …/cards`, answers not sent); the talk's row — true once the
            day's sixth stage is walked and while the day's replays last (`plan.conversation.replays_per_day`; the replay is
            `POST …/days/{n}/conversation` with `again`, 409 `plan_conversation_replay_limit` past it)
        summary:
          description: 'A stage of cards: its «Итог этапа» (кадр 30-6, наряд FIX-3 §10). Null on the talk''s row'
          oneOf:
            - $ref: '#/components/schemas/PlanStageSummary'
            - type: 'null'

    PlanConversationTarget:
      type: object
      additionalProperties: false
      description: >-
        One target of «Скажи в разговоре» — a CONSTRUCTION, not a sentence (наряд FIX-3 §6): the frame with its window
        `___`, the value the lesson says it with, and — once said — what the learner put into the window. The same shape
        in the talk's document (`PlanConversation.targets`), its summary (`PlanConversationSummary.phrases`) and on the day
        window's talk row (`PlanWindowStage.targets`). A target is SAID when a move says it as a COHERENT PHRASE (наряд
        FIX-4 §2): the frame's part before the window as an unbroken run where a sentence of the move begins (or right
        after its opening words, or — наряд FIX-4b §1 — right after a conjunction that opens a clause: and, but, so,
        then, or), a word of the learner's own in the window, the part after straight after it — a negative is the same
        construction; ALMOST when one word is off (replaced, added, left out, another form). Only the frames of the scene
        the talk is in are judged, only the unsaid ones; said stays said, and counts once.
      required: [scene_id, ref, frame_target, frame_native, example_target, example_native, said, value_target, state]
      properties:
        scene_id: { type: string }
        ref: { type: string, description: 'The phrase — `p3`' }
        frame_target: { type: string, description: '«I''m flying to ___.» — the whole phrase for a frame without a window' }
        frame_native: { type: string, description: '«Я лечу в ___.»' }
        example_target: { type: [string, 'null'], description: 'The value the lesson says the frame with — «London»; null for a frame without a window' }
        example_native: { type: [string, 'null'] }
        said: { type: boolean, description: 'The same as `state == said` — kept for build (20)' }
        value_target: { type: [string, 'null'], description: 'What the learner put into the window, as heard — «Lisbon»; null until said, and for a frame without a window. A window with nothing after it ends before the conjunction of the next construction the same move said (наряд FIX-4b §1: «my first visit», not «my first visit and I have about a year of experience»)' }
        state:
          type: string
          enum: [none, almost, said]
          description: 'Where the construction stands in the talk (наряд FIX-4 §2): `said`; `almost` — a move said it one word off, which does not close it; `none`. Added last — build (20) reads the keys before it as they were'

    PlanWindowWord:
      type: object
      description: >-
        A word or chunk card of the words tab and its sheet (23-0e, DAY-UI-3). Everything the sheet
        shows is here — how the word reads, what it means, its voice, the line of the day it is said
        in and the day it comes back on; the client derives none of it.
      required: [ref, term, translation, pronunciation, definition, image, image_tone, audio_url, usage, state, returns_day, used_in, source, scene]
      properties:
        ref: { type: string, description: 'The lesson''s own id — `v3`' }
        term: { type: string }
        translation: { type: string }
        pronunciation: { type: [string, 'null'], description: 'How the word reads in the learner''s alphabet (`pronunciation_native`) — «пэ́йнкилэр»' }
        definition: { type: [string, 'null'], description: 'What the word means, in the target language (`definition_target`)' }
        image:
          oneOf:
            - $ref: '#/components/schemas/PlanImage'
            - type: 'null'
        image_tone: { type: string, pattern: '^#[0-9A-F]{6}$', description: 'Always: the photo''s tone, else its scene''s, else the plan cover''s, else the theme''s empty slot — paint the slot with it first' }
        audio_url: { type: [string, 'null'], format: uri, description: 'The word in the learner''s voice of the scene; null until voiced — the phone reads it meanwhile' }
        usage:
          oneOf:
            - $ref: '#/components/schemas/PlanWindowUsage'
            - type: 'null'
        state: { $ref: '#/components/schemas/PlanWindowUnitState' }
        returns_day: { type: [integer, 'null'], description: 'On `returns_tomorrow`: the number of the day it comes back on («вернётся в день 3»); null otherwise, and after the last day that deals returns' }
        used_in:
          type: array
          items: { type: string }
          description: 'Where the lesson says the word (GEN-2a, additive — the client does not read it yet): frame ids `p3` (the frame or one of its fillers) and partner lines `A3` (the partner''s message of exchange 3)'
        source: { $ref: '#/components/schemas/PlanWindowSource' }
        scene:
          oneOf:
            - $ref: '#/components/schemas/PlanWindowUnitScene'
            - type: 'null'

    PlanWindowUsage:
      type: object
      description: >-
        «В разговоре» (23-0e): the line of the day a word is said in — by the lesson's `used_in`, the first
        named place that contains it (a frame id names the learner lines on that frame), else the first
        line of the visit that contains it — with the word's place in it, in characters (Unicode code
        points) of `text`, for the highlight, and the line's own voice. A word the dialogue never says (a
        filler no line uses) has no usage.
      required: [text, translation, offset, length, audio_url]
      properties:
        text: { type: string }
        translation: { type: string }
        offset: { type: integer, minimum: 0 }
        length: { type: integer, minimum: 1 }
        audio_url: { type: [string, 'null'], format: uri }

    PlanWindowPhrase:
      type: object
      description: >-
        A phrase of the phrases tab — the phrase, how it reads, its translation and its voice (the learner's of
        the scene, DAY-UI-3). A phrase is a frame (`lesson_day.v4.5`): `text`, `translation` and `pronunciation`
        are the frame said with the filler of its first dialogue line; `frame` is the frame itself (GEN-2a,
        additive — the client does not read it yet).
      required: [ref, text, translation, pronunciation, audio_url, state, frame, source, scene]
      properties:
        ref: { type: string, description: '`p2`' }
        text: { type: string }
        translation: { type: string }
        pronunciation: { type: [string, 'null'] }
        audio_url: { type: [string, 'null'], format: uri, description: 'Null until voiced — the phone reads it meanwhile' }
        state: { $ref: '#/components/schemas/PlanWindowUnitState' }
        frame:
          oneOf:
            - $ref: '#/components/schemas/PlanWindowFrame'
            - type: 'null'
        source: { $ref: '#/components/schemas/PlanWindowSource' }
        scene:
          oneOf:
            - $ref: '#/components/schemas/PlanWindowUnitScene'
            - type: 'null'

    PlanWindowFrame:
      type: object
      description: 'The frame behind a phrase (`lesson_day.v4.5`, GEN-2a): the pattern with its `___`, in both languages and read aloud, its kind, and its slot — null for a frame without one.'
      required: [target, native, pronunciation, kind, slot]
      properties:
        target: { type: string, description: '«It hurts in his ___.»' }
        native: { type: string, description: '«У него болит ___.»' }
        pronunciation: { type: string }
        kind: { type: string, enum: [answer, ask] }
        slot:
          oneOf:
            - type: object
              required: [hint, fillers]
              properties:
                hint: { type: string, description: 'What goes into the slot, in the learner''s language' }
                fillers:
                  type: array
                  items:
                    type: object
                    required: [target, native, pronunciation, in_dialogue, audio_url]
                    properties:
                      target: { type: string }
                      native: { type: string }
                      pronunciation: { type: string }
                      in_dialogue: { type: boolean, description: 'The dialogue says the frame with this filler — one per exchange that uses the frame' }
                      audio_url: { type: [string, 'null'], format: uri, description: 'The frame said with this filler, in the learner''s voice (TTS-2, additive); the filler the phrase itself is said with shares the phrase''s file. Null until voiced — the phone reads it meanwhile' }
            - type: 'null'

    PlanWindowPair:
      type: object
      description: >-
        One exchange of the dialogue tab. Both bubbles carry their voice (DAY-UI-3: every line is
        voiced, the partner's in the partner's voice, the learner's in the learner's — two voices of
        different gender); the learner's also carries its state. The learner's line is the server's
        assembly of its frame and filler (`lesson_day.v4.5`). `kind`, `phrase_ref` and `filler` are
        additive (GEN-2a) — the client does not read them yet.
      required: [step, kind, partner, learner, source, scene]
      properties:
        step: { type: integer }
        kind: { type: [string, 'null'], enum: [answer, ask, rescue, null], description: 'The exchange''s kind; null when the scene''s lesson is not at hand' }
        partner:
          oneOf:
            - type: object
              required: [text, translation, audio_url]
              properties:
                text: { type: string }
                translation: { type: string }
                audio_url: { type: [string, 'null'], format: uri }
            - type: 'null'
        learner:
          oneOf:
            - type: object
              required: [text, translation, audio_url, state, phrase_ref, filler]
              properties:
                text: { type: string }
                translation: { type: string }
                audio_url: { type: [string, 'null'], format: uri }
                state: { $ref: '#/components/schemas/PlanWindowUnitState' }
                phrase_ref: { type: [string, 'null'], description: 'The frame the line stands on — `p3`; null for a rescue line' }
                filler: { type: [string, 'null'], description: 'The filler the line says the frame with' }
            - type: 'null'
        source: { $ref: '#/components/schemas/PlanWindowSource' }
        scene:
          oneOf:
            - $ref: '#/components/schemas/PlanWindowUnitScene'
            - type: 'null'

    PlanDayWindow:
      type: object
      description: >-
        «Окно дня» (DAY-UI-2, DAY-UI-3, кадры 23-0a…0e): the day's own reading of its cards for the one-screen
        window — what the plate, the compact header, the three programme tabs and the one button
        draw. Everything countable is counted here; the client words it.
      required: [day, stages, day_progress, program, allowed_action, listening, highlights, sources]
      properties:
        day:
          type: object
          required: [index, type, title_native, title_target, image, image_tone, status, minutes_estimate, minutes_spent, goals]
          properties:
            index: { type: integer, description: 'The day''s number' }
            type: { type: string, enum: [scene, review, rehearsal] }
            title_native: { type: [string, 'null'], description: 'The scene''s; null on a review and the rehearsal' }
            title_target: { type: [string, 'null'] }
            image:
              oneOf:
                - $ref: '#/components/schemas/PlanSceneImage'
                - type: 'null'
            image_tone: { type: string, pattern: '^#[0-9A-F]{6}$' }
            status:
              type: string
              enum: [not_started, in_progress, passed, locked, building]
              description: >-
                One word for the day. Day one of a built, unstarted plan is `not_started` («Начать»
                starts the plan first). `locked` is not a window state: the client refuses to draw it.
                `building` — the day is next in line and its lesson is not back yet: no `allowed_action`, ask again.
            minutes_estimate: { type: [integer, 'null'], description: 'What the day still asks for — all of it before the start, what is left while walked; null once passed or without cards' }
            minutes_spent: { type: [integer, 'null'], description: 'A passed day only: the cards and the talk that walked the sixth stage (наряд BACK-TAILS-2 §8)' }
            goals:
              type: array
              items:
                type: object
                required: [text, passed]
                properties:
                  text: { type: string }
                  passed: { type: boolean, description: 'True for every goal of a passed day, false otherwise' }
        stages:
          type: array
          description: The stages the day deals, in walking order
          items: { $ref: '#/components/schemas/PlanWindowStage' }
        day_progress: { type: number, minimum: 0, maximum: 1, description: 'The share of stages done — the compact header''s bar' }
        program:
          type: object
          required: [words, phrases, dialogue]
          properties:
            words:
              type: object
              required: [summary, items]
              properties:
                summary: { $ref: '#/components/schemas/PlanWindowSummary' }
                items: { type: array, items: { $ref: '#/components/schemas/PlanWindowWord' } }
            phrases:
              type: object
              required: [summary, items]
              properties:
                summary: { $ref: '#/components/schemas/PlanWindowSummary' }
                items: { type: array, items: { $ref: '#/components/schemas/PlanWindowPhrase' } }
            dialogue:
              type: object
              required: [summary, items]
              properties:
                summary: { $ref: '#/components/schemas/PlanWindowSummary' }
                items: { type: array, items: { $ref: '#/components/schemas/PlanWindowPair' } }
        allowed_action:
          type: [string, 'null']
          enum: [start, continue, null]
          description: >-
            The one button: «Начать» (`POST /start` for an unstarted plan, then `…/open`),
            «Продолжить» (`…/open`). Null: no button — a passed day among them: «Ещё раз» is each row's own
            (`stages[].again`, наряд FIX-3 §8), not the day's.
        sources:
          type: array
          description: >-
            «Из каких сцен» / «Из каких дней» (кадры 37-1, 37-2; наряд BACK-TAILS-2 §4) — the scenes the day
            is made of: the rehearsal — every content scene of the plan (the ones its «Вспомнить» and its talk
            walk); a review — the scenes of the two scene days it repeats (the ones whose returns it takes); a
            scene day — its own scene. In the plan's order of scenes — the order «Вспомнить» and the talk walk
            them in, the order of their days in a plan the generator built. Named as the plan names the scene
            (§6); the photo is the plan's scene's, by `scene_id` (`Plan.scenes[].image`).
          items:
            type: object
            additionalProperties: false
            required: [scene_id, title_native, day_number, partner_gender]
            properties:
              scene_id: { type: string }
              title_native: { type: string }
              day_number: { type: [integer, 'null'], minimum: 1, description: 'The day of the route the scene stands on. Null for a scene with no day of its own — never in a plan the generator built, where every scene has its day; a stand put together by hand has one (the e2e rehearsal''s «Запись к врачу»)' }
              partner_gender:
                type: string
                enum: [male, female]
                description: 'The grammatical gender of the scene''s partner role (наряд FIX-4c §3) — «Регистратор начнёт первым», «Медсестра начнёт первой»: the gender the scene''s lesson gave the role (`plan_scenes.partner_voice_gender`), `female` — the default cast — for a scene whose lesson is not written yet'
        highlights:
          type: array
          description: >-
            «Что было хорошо» (кадр 37-13, наряд CONV-1): two or three ready lines on the summary of a
            day — «Сказал сам 6 реплик из 8», «В разговоре использовал 5 фраз из 7», «Понял все
            вопросы». Written by the server, inflected by the server; the client prints them in order.
            Filled the moment EVERY stage of the day is walked — before «Закрыть день», for кадр 30-7
            (наряд CONV-2, п. 9) — and on a passed day; empty until then, and without the talk's two
            lines when the day held none. The talk's lines read the talk that walked the stage, over its
            targets.
          items: { type: string }
        listening:
          type: array
          description: >-
            The questions about the day's whole visit, heard once without text (`lesson_day.v4.5`, LISTENING):
            in the learner's language, three options, the right one marked where the server shuffled it. Empty
            on a review and the rehearsal. Additive (GEN-2a) — the client does not read it yet.
          items:
            type: object
            required: [question, options, explanation_native]
            properties:
              question: { type: string }
              options:
                type: array
                items:
                  type: object
                  required: [text, correct]
                  properties:
                    text: { type: string }
                    correct: { type: boolean }
              explanation_native: { type: string }

    PlanDayRoom:
      type: object
      description: >-
        The day: the tab's plate reads `stages`, `metrics` and `program`, the session `day` and
        `scene`, the day window its own block `window` (DAY-UI-2). The old day room's `goals_native`,
        `sheet_available`, the unit texts and the first-try/hardest metrics went with that room.
      required: [plan_id, day, stages, program, window, speech]
      properties:
        plan_id: { type: string }
        day: { $ref: '#/components/schemas/PlanDayRoute' }
        scene:
          oneOf:
            - $ref: '#/components/schemas/PlanScene'
            - type: 'null'
        stages:
          type: array
          items: { $ref: '#/components/schemas/PlanStageProgress' }
        metrics:
          oneOf:
            - $ref: '#/components/schemas/PlanDayMetrics'
            - type: 'null'
          description: >-
            Filled from the moment the day is opened and refolded on every answer, so a day being
            walked shows its own progress. Null for a day that has not been opened.
        program:
          type: array
          description: >-
            Every unit of the day. Known as soon as the lesson is written — before the day is
            opened, every unit is `pending`.
          items: { $ref: '#/components/schemas/PlanProgramUnit' }
        window: { $ref: '#/components/schemas/PlanDayWindow' }
        speech: { $ref: '#/components/schemas/PlanSpeechRules' }

    PlanCard:
      type: object
      description: >-
        ONE CARD OF A DAY, in the envelope of the registry of trainers (наряд SESSION-1a, разд. 0).
        `payload` is everything the client needs to SHOW and to GRADE the card — it holds no id, no
        address and nothing that points back at the model — and what could not be known when the day
        was dealt is resolved at read time: every sound of it is a `PlanCardAudio` with the address
        of its file and its length, every photo slot of a word card a `PlanCardImage`. Which schema
        `payload` has is decided by `kind`, one schema per kind.


        The card does not choose the mode: chips, tiles or voice are all in the payload, and the
        client picks by the plan's level and the «Без подсказок» switch. `unit` is what the card
        teaches — the word `v3`, the frame `p2`, the exchange `x4` of the scene in
        `payload.scene_id`, or the whole visit (`day`), which teaches no unit of the programme and
        never returns.


        The flat keys `unit_kind`, `unit_ref`, `source_day_id`, `answered_at` and `returns` stay
        beside the new ones and say the same thing — the move is additive (D-03).
      required:
        [id, stage, position, kind, unit, source, source_day, retry_of, payload, result, attempts,
         response, unit_kind, unit_ref, source_day_id, answered_at, returns]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        stage: { type: string, enum: [words, phrases, dialogue, listen, speak, recall, repetition], description: 'The stage of cards the card is walked in — a review day''s spoken cards stand in `repetition` (наряд BACK-TAILS-2 §3); the talk has no cards' }
        position: { type: integer, minimum: 1, description: 'Within the stage; a requeued card takes the next position' }
        kind:
          type: string
          description: >-
            Which trainer this is — the 30 values of the registry: the 29 that are dealt, and
            `listen_pairs`, which is RESERVED in the enum and never dealt (the lesson has no two
            alike lines to pair; its source is v4.6). A client that meets a kind it does not know
            shows nothing rather than guessing.
          enum:
            [word_intro, word_repeat, word_choose, word_listen, word_assemble, word_in_line,
             phrase_intro, phrase_assemble, phrase_choose_back, phrase_slot, phrase_slot_listen,
             phrase_repeat, phrase_other_slot, phrase_combine,
             dialogue_partner, dialogue_answer, dialogue_ask, dialogue_rescue,
             listen_dialogue, listen_question, listen_review, listen_pairs, listen_predict,
             listen_pace, listen_number,
             speak_answer, speak_echo, speak_retell,
             recall_scenes]
        unit: { $ref: '#/components/schemas/PlanCardUnit' }
        source: { type: string, enum: [today, returned], description: 'A card of today''s scene, or a unit coming back after failing twice' }
        source_day: { type: [integer, 'null'], description: 'The NUMBER of the day the unit failed on — only on `source: returned`' }
        retry_of: { type: [string, 'null'], description: 'The card this one re-deals after a first failure (its options and tiles in another order)' }
        payload:
          description: >-
            The schema is the one of this card's `kind` — `PlanCardPayloadWordIntro` for
            `word_intro`, and so on for each of the 29 dealt kinds (the schema's `title` IS the
            kind). Every payload carries `scene_id`, holds every key it names and no other
            (`additionalProperties: false`), so exactly one of the schemas below fits a given
            payload: `dialogue_answer` and `dialogue_ask` carry the same keys and are told apart by
            `exchange.kind` (`answer` / `ask`), as the dealer deals them.
          oneOf:
            - $ref: '#/components/schemas/PlanCardPayloadWordIntro'
            - $ref: '#/components/schemas/PlanCardPayloadWordRepeat'
            - $ref: '#/components/schemas/PlanCardPayloadWordChoose'
            - $ref: '#/components/schemas/PlanCardPayloadWordListen'
            - $ref: '#/components/schemas/PlanCardPayloadWordAssemble'
            - $ref: '#/components/schemas/PlanCardPayloadWordInLine'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseIntro'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseAssemble'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseChooseBack'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseSlot'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseSlotListen'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseRepeat'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseOtherSlot'
            - $ref: '#/components/schemas/PlanCardPayloadPhraseCombine'
            - $ref: '#/components/schemas/PlanCardPayloadDialoguePartner'
            - $ref: '#/components/schemas/PlanCardPayloadDialogueAnswer'
            - $ref: '#/components/schemas/PlanCardPayloadDialogueAsk'
            - $ref: '#/components/schemas/PlanCardPayloadDialogueRescue'
            - $ref: '#/components/schemas/PlanCardPayloadListenDialogue'
            - $ref: '#/components/schemas/PlanCardPayloadListenQuestion'
            - $ref: '#/components/schemas/PlanCardPayloadListenReview'
            - $ref: '#/components/schemas/PlanCardPayloadListenPredict'
            - $ref: '#/components/schemas/PlanCardPayloadListenPace'
            - $ref: '#/components/schemas/PlanCardPayloadListenNumber'
            - $ref: '#/components/schemas/PlanCardPayloadSpeakAnswer'
            - $ref: '#/components/schemas/PlanCardPayloadSpeakEcho'
            - $ref: '#/components/schemas/PlanCardPayloadSpeakRetell'
            - $ref: '#/components/schemas/PlanCardPayloadRecallScenes'
        result:
          type: [string, 'null']
          enum: [passed, hinted, failed, skipped, null]
          description: >-
            Null while the card is unanswered — and on a judged card whose attempt the judge did not
            accept: that is another attempt, not a result. What each kind may be given is D-31, on
            `POST …/cards/{cardId}/answer`.
        attempts: { type: integer, minimum: 0, description: 'How many attempts the card took; a judged card counts one more on every call to `…/judge`' }
        response:
          oneOf:
            - $ref: '#/components/schemas/PlanCardResponse'
            - type: 'null'
          description: 'What the last attempt left behind — the client''s (`…/answer`) or the judge''s (`…/judge`); null while the card is untouched'
        unit_kind: { type: string, enum: [word, phrase, exchange, day], description: 'The same as `unit.kind` (kept)' }
        unit_ref: { type: string, description: 'The same as `unit.ref` (kept)' }
        source_day_id: { type: [string, 'null'], description: 'For a returned card: the id of the day it failed twice on (kept; `source_day` is its number)' }
        answered_at: { type: [string, 'null'], format: date-time }
        returns: { type: boolean, description: 'Failed twice — the unit returns on the next content day (never a `day` unit)' }

    PlanCardUnit:
      type: object
      description: >-
        Что карточка учит: слово `v3`, каркас `p2`, обмен `x4` сцены из `payload.scene_id` — или весь
        визит (`day`, у карточек «Слушаю и отвечаю»; у listen_question ref вида `L2` — номер вопроса).
        По единице клиент сводит карточки этапа в один пункт программы; единица `day` в программе не
        показывается и никогда не возвращается.
      required: [kind, ref]
      properties:
        kind: { type: string, enum: [word, phrase, exchange, day] }
        ref: { type: string, description: '`v3`, `p2`, `x4`, `day` или `L2`' }

    PlanCardAnswerResponse:
      type: object
      description: >-
        Что клиент прикладывает к ответу (наряд SESSION-1a, D-30). Все ключи необязательны, любой
        другой отбрасывается и не хранится; сервер возвращает их в `PlanCard.response` как есть.
      properties:
        heard: { type: [string, 'null'], maxLength: 1000, description: 'Что распознал микрофон на голосовой карточке' }
        hinted_at: { type: [string, 'null'], maxLength: 40, description: 'Какая подсказка была открыта до ответа — почему итог `hinted`' }
        slot_value: { type: [string, 'null'], maxLength: 200, description: 'Что клиент считает сказанным в окне каркаса' }
        filler_index: { type: [integer, 'null'], minimum: 0, maximum: 9, description: 'Какое наполнение каркаса выбрано чипом' }
        mode: { type: [string, 'null'], enum: [chips, tiles, voice_hint, voice_blind, rounds, null], description: 'В каком режиме карточка пройдена — чипы, плитки, голос по подсказке, вслепую или серией раундов (хвост SESSION-1b: фраза вслух по разным наполнениям в одной карточке)' }
        no_mic: { type: [boolean, 'null'], description: 'Микрофона не было — карточка пройдена без голоса' }
        choice: { type: [string, 'null'], description: '`id` варианта, выбранного на карточке с проверкой (`dialogue_ask`) — сервер кладёт сюда то, что пришло в `choice` тела запроса' }

    PlanCardResponse:
      type: object
      description: >-
        Что осталось от последней попытки. Обычный ответ кладёт сюда присланное клиентом
        (`PlanCardAnswerResponse`); карточку по смыслу пишет судья — `heard`, `slot_value`, `hinted`
        и `judge`. Клиент читает это, чтобы показать услышанное и причину отказа, когда возвращается
        к карточке.
      properties:
        heard: { type: [string, 'null'], description: 'Что было услышано на последней попытке' }
        hinted_at: { type: [string, 'null'], description: 'Какая подсказка была открыта до ответа' }
        slot_value: { type: [string, 'null'], description: 'Значение окна: слова клиента или то, что выделил судья' }
        filler_index: { type: [integer, 'null'], description: 'Выбранное наполнение каркаса' }
        mode: { type: [string, 'null'], enum: [chips, tiles, voice_hint, voice_blind, null], description: 'Режим, в котором карточка пройдена' }
        no_mic: { type: [boolean, 'null'], description: 'Попытка без микрофона' }
        hinted: { type: boolean, description: 'Каркас был на экране до попытки — судья пишет `hinted`, а не `passed` (пишет только судья)' }
        judge: { $ref: '#/components/schemas/PlanCardJudgeVerdict' }

    PlanCardJudgeVerdict:
      type: object
      description: >-
        Вердикт судьи окна по последней попытке и чей он (наряд SESSION-1a, разд. 4): `code` — решила
        программа (каркас не прозвучал, окна нет или в окне услышано наполнение урока), `model` —
        решила модель, `unavailable` — модель молчала, ответила не по форме или кончился суточный кап,
        и попытка зачтена по коду. Поля вызова заполнены только у `model`; клиент показывает
        `reason_native` и больше ничего из этого не читает.
      required: [accepted, reason_native, by]
      properties:
        accepted: { type: boolean, description: 'Зачтена ли попытка' }
        reason_native: { type: [string, 'null'], description: 'Одна фраза на родном, чего не хватило; null при зачёте' }
        by: { type: string, enum: [code, model, unavailable], description: 'Кто вынес вердикт' }
        model: { type: [string, 'null'], description: 'Имя модели, если звали её' }
        prompt_version: { type: [string, 'null'], description: 'Версия промта судьи — `slot_judge.v3` (наряд CONV-2; вердикты, записанные раньше, называют свою)' }
        cost_usd: { type: [string, 'null'], description: 'Цена вызова, шесть знаков после точки' }
        latency_ms: { type: [integer, 'null'], description: 'Сколько отвечала модель' }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }

    PlanCardAudio:
      type: object
      description: >-
        Звучащий элемент карточки. `ref` — имя файла так, как его называет сцена: `x3` — реплика
        партнёра третьего обмена, `x3b` — своя реплика, `p2` — каркас с наполнением первой реплики,
        `p2.f3` — он же с наполнением 3, `v5` — слово. Клиент играет по `url`; пока файла нет, `url` и
        `duration_ms` null — телефон читает текст сам.
      required: [ref, url, duration_ms, voice]
      properties:
        ref: { type: string, description: 'Имя файла в сцене — по нему звук узнаётся между карточками' }
        url: { type: [string, 'null'], format: uri, description: 'Адрес файла (`GET /plans/audio/{audioId}`); null, пока звук не записан' }
        duration_ms: { type: [integer, 'null'], description: 'Длительность файла в миллисекундах — оценка по байтам; null, пока звука нет' }
        voice: { type: string, enum: [partner, learner], description: 'Чей это голос — партнёра или ученика' }

    PlanCardImage:
      type: object
      description: 'Фото слова: адрес и тон. Тоном заливается место фото, пока картинка грузится и если её нет вовсе.'
      required: [url, tone]
      properties:
        url: { type: [string, 'null'], format: uri, description: 'Адрес фото у поставщика; null, если фото нет' }
        tone: { type: [string, 'null'], pattern: '^#[0-9A-F]{6}$', description: 'Тон фото — им красят пустое место' }

    PlanCardTerm:
      type: object
      description: 'Слово или чанк так, как его показывают карточки слов: сам термин, его чтение, перевод, определение на языке цели и фото.'
      required: [ref, text_target, pronunciation_native, text_native, definition_target, image]
      properties:
        ref: { type: string, description: '`v3` — адрес слова в сцене' }
        text_target: { type: string, description: 'Слово на языке цели — что показать крупно' }
        pronunciation_native: { type: [string, 'null'], description: 'Как слово читается родным алфавитом — под словом' }
        text_native: { type: string, description: 'Перевод — что слово значит' }
        definition_target: { type: [string, 'null'], description: 'Определение на языке цели — вторая строка карточки знакомства' }
        image: { $ref: '#/components/schemas/PlanCardImage' }

    PlanCardFiller:
      type: object
      description: >-
        Наполнение окна каркаса. Из наполнений клиент делает чипы и варианты выбора; `index` — то, чем
        выбор называют в ответе (`filler_index`).
      required: [index, target, native, pronunciation_native, in_dialogue, native_line, audio]
      properties:
        index: { type: integer, minimum: 0, description: 'Номер наполнения в окне — им называют выбор' }
        target: { type: string, description: 'Значение на языке цели — что произнести или написать в окне' }
        native: { type: string, description: 'Оно же на родном — чем просят заполнить окно' }
        pronunciation_native: { type: string, description: 'Как значение читается родным алфавитом' }
        in_dialogue: { type: boolean, description: 'Этим наполнением каркас звучит в диалоге дня' }
        native_line: { type: string, description: 'Каркас с этим наполнением целиком на родном — так наполнение выглядит вариантом' }
        audio:
          oneOf:
            - $ref: '#/components/schemas/PlanCardAudio'
            - type: 'null'
          description: 'Каркас, сказанный с этим наполнением; null, если такой строки не записано'

    PlanCardFrame:
      type: object
      description: >-
        Каркас реплики: текст с окном `___` на языке цели, его перевод и чтение, и само окно. Клиент
        показывает `frame_target` и подставляет в окно выбранное наполнение; `slot` null у каркаса без
        окна — такой показывают целиком.
      required: [ref, kind, frame_target, frame_native, frame_pronunciation_native, slot]
      properties:
        ref: { type: string, description: '`p2` — адрес каркаса в сцене' }
        kind: { type: string, enum: [answer, ask], description: 'Этим каркасом ученик отвечает или спрашивает' }
        frame_target: { type: string, description: 'Каркас на языке цели с `___` — что показать и что произнести' }
        frame_native: { type: string, description: 'Он же на родном — задание словами ученика' }
        frame_pronunciation_native: { type: string, description: 'Как каркас читается родным алфавитом' }
        slot:
          description: 'Окно каркаса; null — окна нет'
          oneOf:
            - type: object
              required: [hint_native, fillers]
              properties:
                hint_native: { type: string, description: 'Что кладут в окно, на родном — «где болит»' }
                fillers:
                  type: array
                  description: 'Наполнения окна в порядке урока — без тех, чей родной шов судья швов не принял (`filler.native_seam`) и которых диалог не говорит (SESSION-1e); `index` у оставшихся прежний'
                  items: { $ref: '#/components/schemas/PlanCardFiller' }
            - type: 'null'

    PlanCardSaid:
      type: object
      description: 'Фраза так, как её говорят в диалоге дня — каркас с наполнением своей первой реплики. Это то, что ученик слышит и повторяет.'
      required: [filler_index, text_target, text_native, pronunciation_native, audio]
      properties:
        filler_index: { type: [integer, 'null'], description: 'Каким наполнением сказано; null у каркаса без окна — он сказан сам собой' }
        text_target: { type: string, description: 'Фраза целиком на языке цели' }
        text_native: { type: string, description: 'Она же на родном' }
        pronunciation_native: { type: [string, 'null'], description: 'Как фраза читается родным алфавитом' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardExchange:
      type: object
      description: 'Обмен диалога, о котором карточка: адрес, шаг и вид — ученик отвечает, спрашивает или просит повторить.'
      required: [ref, step, kind]
      properties:
        ref: { type: string, description: '`x3`' }
        step: { type: integer, minimum: 1, description: 'Номер обмена в визите — им карточки одного обмена держатся вместе' }
        kind: { type: string, enum: [answer, ask, rescue] }

    PlanCardLine:
      type: object
      description: 'Реплика обмена: адрес (`x3` — партнёра, `x3b` — своя), оба текста и звук. Что из текстов показать до ответа, решает кадр.'
      required: [ref, text_target, text_native, audio]
      properties:
        ref: { type: string, description: 'Адрес реплики — он же имя её файла' }
        text_target: { type: string, description: 'Реплика на языке цели' }
        text_native: { type: string, description: 'Её перевод' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardOwnLine:
      type: object
      description: 'Своя реплика обмена и всё, что сервер о ней знает: на каком каркасе она стоит, каким наполнением сказана и с каких слов её просят начать.'
      required: [ref, text_target, text_native, frame_ref, filler_index, key, audio]
      properties:
        ref: { type: string, description: '`x3b` — адрес своей реплики' }
        text_target: { type: string, description: 'Что ученик говорит, целиком' }
        text_native: { type: string, description: 'Перевод своей реплики — из него делают задание' }
        frame_ref: { type: [string, 'null'], description: 'Каркас реплики — `p3`; null у реплики вне каркаса' }
        filler_index: { type: [integer, 'null'], description: 'Каким наполнением каркаса сказана; null, если не определено' }
        key: { type: [string, 'null'], description: 'Ключ произнесения — до четырёх слов каркаса, с которых просят начать; наполнения в нём нет' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardVisitLine:
      type: object
      description: 'Реплика визита так, как её играет лента слушания: кто говорит и в каком обмене, оба текста и звук.'
      required: [ref, role, exchange_step, text_target, text_native, audio]
      properties:
        ref: { type: string, description: '`x3` или `x3b`' }
        role: { type: string, enum: [partner, learner], description: 'Чья реплика — по ней рисуют сторону пузыря' }
        exchange_step: { type: integer, minimum: 1, description: 'Обмен, к которому реплика относится' }
        text_target: { type: string, description: 'Реплика на языке цели — лента её не показывает, разбор показывает' }
        text_native: { type: string, description: 'Её перевод' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardOption:
      type: object
      description: >-
        Один вариант выбора: `id` вида `o1` в показанном порядке и текст. `audio` есть только там, где
        вариант можно послушать. Верный назван в `correct` тем же `id`; тексты вариантов не совпадают
        между собой без учёта регистра.
      required: [id, text]
      properties:
        id: { type: string, description: '`o1`…`o4` в порядке показа — этим же id назван верный' }
        text: { type: string, description: 'Что написано на варианте' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardLineOption:
      type: object
      description: >-
        Вариант, который есть РЕПЛИКА дня (наряд BACK-TAILS-1 §1.2, `listen_predict`): `id` вида `o1` в
        показанном порядке, имя реплики, оба текста и звук. До ответа клиент даёт слушать и текстов не
        показывает; верный назван в `correct` тем же `id`. Тексты цели у вариантов не совпадают между
        собой без учёта регистра.
      required: [id, ref, text_target, text_native, audio]
      properties:
        id: { type: string, description: '`o1`…`o3` в порядке показа — этим же id назван верный' }
        ref: { type: string, description: 'Имя реплики визита — `x3` (агент) или `x3b` (ученик)' }
        text_target: { type: string, description: 'Реплика на языке цели — показывают после ответа' }
        text_native: { type: string, description: 'Её перевод — показывают после ответа' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardPayloadWordIntro:
      type: object
      title: word_intro
      additionalProperties: false
      description: 'Знакомство со словом (31-1): слово, фото, чтение, определение и строка дня, в которой оно звучит. Зачёта нет — «Дальше».'
      required: [scene_id, term, used_in, audio]
      properties:
        scene_id: { type: string, description: 'Сцена карточки — по ней карточки одного дня держатся вместе' }
        term: { $ref: '#/components/schemas/PlanCardTerm' }
        used_in:
          description: 'Строка дня, в которой слово звучит; null — такой строки нет, блок «В разговоре» не показывают'
          oneOf:
            - type: object
              required: [ref, line_ref, text_target, text_native, term_span]
              properties:
                ref: { type: string, description: 'Чем строка названа: `A3` — реплика партнёра, `p3` — каркас своей реплики, `B3` — своя реплика без каркаса' }
                line_ref: { type: string, description: 'Имя звукового файла строки — `x3` или `x3b`' }
                text_target: { type: string, description: 'Строка целиком на языке цели' }
                text_native: { type: string, description: 'Её перевод' }
                term_span:
                  type: array
                  description: 'Место слова в `text_target`, [начало, конец) в символах — им подсвечивают слово'
                  items: { type: integer, minimum: 0 }
                  minItems: 2
                  maxItems: 2
            - type: 'null'
        audio:
          type: object
          description: 'Звук слова и звук строки — две кнопки карточки'
          required: [term, line]
          properties:
            term: { $ref: '#/components/schemas/PlanCardAudio' }
            line:
              description: 'Звук строки дня; null, когда строки нет'
              oneOf:
                - $ref: '#/components/schemas/PlanCardAudio'
                - type: 'null'

    PlanCardPayloadWordRepeat:
      type: object
      title: word_repeat
      additionalProperties: false
      description: 'Повтори слово вслух (31-2). Клиент зачитывает сам — покрытие услышанного по `expected_text`; две попытки без зачёта — `skipped`.'
      required: [scene_id, term, expected_text, speech_mode, audio]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        term: { $ref: '#/components/schemas/PlanCardTerm' }
        expected_text: { type: string, description: 'Что должно прозвучать — слово на языке цели' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
        audio:
          type: object
          description: 'Образец — как слово звучит'
          required: [term]
          properties:
            term: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardPayloadWordChoose:
      type: object
      title: word_choose
      additionalProperties: false
      description: >-
        Выбор перевода или слова (31-3 / 31-4). Направление задано сервером и чередуется по выборам дня
        (SESSION-1e) у любого уровня: `term_to_native` — слово с фото и звуком, выбирают перевод;
        `native_to_term` — перевод под фото, выбирают слово, звук у вариантов, а не у вопроса. Зачёт у
        клиента по `correct`.
      required: [scene_id, direction, prompt, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        direction: { type: string, enum: [term_to_native, native_to_term], description: 'Что показано в вопросе и что выбирают: слово → перевод или перевод → слово' }
        prompt:
          description: 'Вопрос — по направлению'
          oneOf:
            - type: object
              description: '`term_to_native`: слово, фото и звук'
              required: [text_target, image, audio]
              properties:
                text_target: { type: string, description: 'Слово на языке цели — вопрос' }
                image: { $ref: '#/components/schemas/PlanCardImage' }
                audio: { $ref: '#/components/schemas/PlanCardAudio' }
            - type: object
              description: '`native_to_term`: перевод под фото, звука нет — он у вариантов'
              required: [text_native, image]
              properties:
                text_native: { type: string, description: 'Перевод — вопрос' }
                image: { $ref: '#/components/schemas/PlanCardImage' }
        options:
          type: array
          description: 'Четыре варианта в показанном порядке; при `native_to_term` каждый со своим звуком'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта — по нему клиент зачитывает' }

    PlanCardPayloadWordListen:
      type: object
      title: word_listen
      additionalProperties: false
      description: 'Звук → перевод (31-5, SESSION-1e): играет слово, ученик выбирает, что оно значит. В вопросе нет ни текста, ни фото; варианты — на родном языке, без звука; текста цели на карточке нет.'
      required: [scene_id, direction, audio, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        direction: { type: string, enum: [term_to_native], description: 'Что звучит и что выбирают: слово → перевод; варианты — родной язык (рисуются как у `word_choose` с `term_to_native`)' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }
        options:
          type: array
          description: 'До четырёх вариантов в показанном порядке — родной язык: перевод этого слова и переводы других слов дня (добор из каталога, когда слов дня меньше четырёх)'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadWordAssemble:
      type: object
      title: word_assemble
      additionalProperties: false
      description: 'Собери чанк из плиток (31-6) — только для терминов из двух слов и больше. Зачёт у клиента: собранное должно совпасть с `expected` по порядку.'
      required: [scene_id, term, tiles, expected]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        term: { $ref: '#/components/schemas/PlanCardTerm' }
        tiles:
          type: array
          description: 'Плитки в лотке, уже перемешанные: слова термина и до трёх лишних из других слов дня'
          items: { type: string }
        expected:
          type: array
          description: 'Слова термина по порядку без артиклей языка цели — с этим сравнивают собранное'
          items: { type: string }

    PlanCardPayloadWordInLine:
      type: object
      title: word_in_line
      additionalProperties: false
      description: 'Слово в строке дня (31-7): строка с пропуском `___` на месте слова и до четырёх слов дня на выбор. Зачёт у клиента по `correct`.'
      required: [scene_id, line, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        line:
          type: object
          description: 'Строка дня с пропуском — та, где слово стоит ВНЕ окна каркаса: сначала реплика собеседника, потом реплика ученика вне её наполнения; такой нет — строка, где слово звучит (SESSION-1d)'
          required: [ref, line_ref, text_target, text_native, audio]
          properties:
            ref: { type: string, description: 'Чем строка названа: `A3`, `p3` или `B3`' }
            line_ref: { type: string, description: 'Имя звукового файла строки — `x3` или `x3b`' }
            text_target: { type: string, description: 'Строка на языке цели, где на месте слова стоит `___`' }
            text_native: { type: string, description: 'Перевод строки целиком, со словом (пропуска в переводе нет)' }
            audio: { $ref: '#/components/schemas/PlanCardAudio' }
        options:
          type: array
          description: 'До четырёх слов дня, каждое со своим звуком; верное — в той форме, в какой оно стоит в строке; ложные — никогда не наполнения того каркаса, окно которого слово заполняет'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadPhraseIntro:
      type: object
      title: phrase_intro
      additionalProperties: false
      description: 'Знакомство с каркасом (32-1): каркас с окном, его наполнения, фраза так, как её говорят в диалоге, и обмен, в котором она звучит. Зачёта нет — «Дальше».'
      required: [scene_id, frame, said, usage]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        said: { $ref: '#/components/schemas/PlanCardSaid' }
        usage:
          type: [object, 'null']
          description: >-
            «В разговоре» (32-1, наряд CONV-2, п. 12): первая реплика визита, стоящая на каркасе, реплика собеседника того же
            обмена и место фразы в реплике ученика — в символах, как `usage` у слова окна (23-0e). Клиент собирал блок сверкой
            текстов с диалогом дня, и фраза, которой сверка не нашла, блока не получала (CLIENT-CONV-1a §5 п. 5). `offset` /
            `length` — null, когда фраза стоит в реплике не дословно; всё поле — null, когда ни одна реплика визита не стоит на
            каркасе.
          required: [exchange, line, offset, length, partner_line]
          properties:
            exchange: { $ref: '#/components/schemas/PlanCardExchange' }
            line: { $ref: '#/components/schemas/PlanCardLine' }
            offset: { type: [integer, 'null'], minimum: 0 }
            length: { type: [integer, 'null'], minimum: 1 }
            partner_line:
              oneOf:
                - $ref: '#/components/schemas/PlanCardLine'
                - type: 'null'

    PlanCardPayloadPhraseAssemble:
      type: object
      title: phrase_assemble
      additionalProperties: false
      description: >-
        Собери фразу из плиток (32-2): плитки — слова каркаса вне окна и два лишних слова соседних
        каркасов, окно в строке — пустой чип до выбора наполнения. Зачёт у клиента: `expected.words`
        по порядку и `expected.filler_index` в окне. Узнавание каркаса (SESSION-1d): второе или третье,
        никогда первое; своё наполнение.
      required: [scene_id, frame, target_native, tiles, chips, expected]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        target_native: { type: string, description: 'Предложение целиком на родном — каркас с наполнением `expected.filler_index`, что нужно собрать' }
        tiles:
          type: array
          description: 'Плитки в лотке, уже перемешанные и в том же написании, что и `expected.words`'
          items: { type: string }
        chips:
          type: array
          description: 'Наполнения окна — из них выбирают то, что встаёт в пустой чип'
          items: { $ref: '#/components/schemas/PlanCardFiller' }
        expected:
          type: object
          description: 'С чем сравнивать собранное'
          required: [words, slot_at, filler_index]
          properties:
            words:
              type: array
              description: 'Слова каркаса по порядку — в написании плиток'
              items: { type: string }
            slot_at: { type: integer, minimum: 0, description: 'Сколько слов стоит до окна — куда встаёт чип' }
            filler_index: { type: integer, minimum: 0, description: 'Номер верного наполнения — того, чьё предложение показано в `target_native` (у каждого узнавания каркаса своё, SESSION-1d)' }

    PlanCardPayloadPhraseChooseBack:
      type: object
      title: phrase_choose_back
      additionalProperties: false
      description: 'Узнавание фразы назад (32-3): каркас, сказанный с одним наполнением, звучит и показан на языке цели, ученик выбирает его перевод. Зачёт у клиента по `correct`.'
      required: [scene_id, prompt, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        prompt:
          type: object
          description: 'Вопрос — каркас с наполнением этой карточки (у каждого узнавания каркаса своё, SESSION-1d)'
          required: [text_target, pronunciation_native, filler_index, audio]
          properties:
            text_target: { type: string, description: 'Фраза на языке цели — каркас с этим наполнением' }
            pronunciation_native: { type: [string, 'null'], description: 'Как она читается родным алфавитом' }
            filler_index: { type: [integer, 'null'], description: 'Каким наполнением сказана; null у каркаса без окна' }
            audio: { $ref: '#/components/schemas/PlanCardAudio' }
        options:
          type: array
          description: 'До четырёх предложений на родном: верное, тот же каркас с другими наполнениями, добор — наполнения следующих каркасов'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadPhraseSlot:
      type: object
      title: phrase_slot
      additionalProperties: false
      description: 'Наполнение окна выбором (32-4): каркас с `___` и задание на родном — предложение с наполнением этой карточки, варианты — наполнения на языке цели, каждое можно послушать. Зачёт у клиента по `correct`.'
      required: [scene_id, frame, prompt_native, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        prompt_native: { type: string, description: 'Что нужно сказать, на родном — целиком: `frame_native` с `native` верного наполнения' }
        options:
          type: array
          description: 'До четырёх наполнений со звуком: сначала другие наполнения этого каркаса, добор — наполнения следующих каркасов'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта — наполнения, чьё предложение в `prompt_native` (у каждого узнавания каркаса своё, SESSION-1d)' }

    PlanCardPayloadPhraseSlotListen:
      type: object
      title: phrase_slot_listen
      additionalProperties: false
      description: 'Окно на слух (32-5): звучит каркас с одним наполнением, ученик выбирает, какое это было. Текста наполнения в вопросе нет, у вариантов звука нет.'
      required: [scene_id, frame, filler_index, audio, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        filler_index: { type: integer, minimum: 0, description: 'Какое наполнение прозвучало — ответ, клиенту нужен для разбора после выбора (у каждого узнавания каркаса своё, SESSION-1d)' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }
        options:
          type: array
          description: 'До четырёх наполнений без звука: сначала другие наполнения этого каркаса, добор — наполнения следующих каркасов'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadPhraseRepeat:
      type: object
      title: phrase_repeat
      additionalProperties: false
      description: 'Повтори фразу вслух (32-6). Клиент зачитывает сам — покрытие услышанного по `expected_text`; две попытки без зачёта — `skipped`, и это провал каркаса (копия с другим наполнением, второй — возврат; SESSION-1d, п. 327).'
      required: [scene_id, frame, filler_index, expected_text, key, speech_mode, audio]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        filler_index: { type: [integer, 'null'], description: 'С каким наполнением сказать фразу — у раздачи дня ещё не сказанным учеником (у каркаса с одним наполнением — сказанным в диалоге); null у каркаса без окна' }
        expected_text: { type: string, description: 'Что должно прозвучать — каркас с этим наполнением целиком; `audio` звучит с ним же' }
        key: { type: [string, 'null'], description: 'Ключ произнесения — слова, с которых просят начать' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
        audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanCardPayloadPhraseOtherSlot:
      type: object
      title: 'phrase_other_slot · «Скажи целиком»'
      additionalProperties: false
      description: >-
        «Скажи целиком» (32-7) — единственный способ произнести каркас С ОКНОМ, на любом уровне (наряд
        FIX-2, п. 5). Карточка идёт КРУГАМИ: значение стоит в окне, ученик говорит фразу целиком,
        следующее значение встаёт в окно; ПОСЛЕДНИЙ круг — своё слово ученика, и его судит сервер
        (`own_round.judge`, `POST …/judge`). Уровни различаются только числом кругов: beginner — два
        значения, intermediate — все видимые наполнения окна.

        Под потолком этапа «Фразы» (решение архитектора 20.09) у карточки убавляются КРУГИ ЗНАЧЕНИЙ —
        сначала третий, потом второй, у каркасов с наименьшим числом реплик в диалоге. Ниже одного
        круга значений она не опускается, а круг «со своим словом» не снимается никогда.

        Круги значений зачитывает клиент (`speech_mode: repeat` — весь текст на экране). Две попытки
        без зачёта на КРУГЕ ЗНАЧЕНИЯ — `skipped`, и это провал каркаса (копия карточки целиком,
        второй раз — возврат; SESSION-1d, п. 327). Круг «со своим словом» — ТРЕНИРОВКА: промах или
        «Пропустить» на нём не создают копию и не возвращают единицу, и вердикт судьи карточку не
        закрывает — итог карточки пишет клиент по кругам значений.
      required: [scene_id, frame, partner_line, key, rounds, speech_mode, own_round]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        partner_line:
          description: 'Реплика партнёра, рядом с которой каркас звучит в диалоге — её читает СУДЬЯ (`PARTNER_LINE`); на экране её нет (кадр 32-7). Null, если такой реплики нет'
          oneOf:
            - $ref: '#/components/schemas/PlanCardLine'
            - type: 'null'
        key: { type: [string, 'null'], description: 'Ключ произнесения — слова, с которых просят начать' }
        rounds:
          type: array
          minItems: 1
          description: 'Круги значений, по порядку окна: сказанное диалогом первым, остальные по индексу. Beginner берёт первые два, intermediate — все; под потолком этапа их может остаться меньше'
          items:
            type: object
            additionalProperties: false
            required: [filler_index, expected_text, task_native]
            properties:
              filler_index: { type: integer, minimum: 0, description: 'Значение окна этого круга' }
              expected_text: { type: string, description: 'Что должно прозвучать — каркас с этим значением целиком' }
              task_native: { type: string, description: 'Та же фраза на родном — задание круга' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
        own_round:
          type: object
          additionalProperties: false
          description: 'Последний круг — своё слово в окне, зачёт по смыслу сервером. Есть всегда: потолок этапа его не снимает'
          required: [task_native, examples, speech_mode, judge]
          properties:
            task_native: { type: string, description: 'Каркас с окном на родном — задание круга' }
            examples:
              type: array
              description: 'Наполнения урока на родном — показать как примеры, не как ответы'
              items: { type: string }
            speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
            judge: { type: boolean, description: 'Всегда true: этот круг зачитывает `POST …/judge`' }

    PlanCardPayloadPhraseCombine:
      type: object
      title: phrase_combine
      additionalProperties: false
      description: >-
        Собери ответ на реплику (32-8), одна на день и только на вопрос (SESSION-1e): звучит вопрос
        партнёра, ученик выбирает нужный каркас из трёх — каждый показан целой фразой (`said`) — и
        наполнение к нему. Зачёт у клиента: каркас должен быть `correct_frame`, наполнение — любое из
        `chips`.
      required: [scene_id, exchange, partner_line, frames, correct_frame, chips, correct_filler]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        partner_line:
          description: 'Реплика партнёра, на которую отвечают; null, если её нет'
          oneOf:
            - $ref: '#/components/schemas/PlanCardLine'
            - type: 'null'
        frames:
          type: array
          description: 'Три каркаса в показанном порядке — нужный и два чужих с окнами: каркасы самых далёких по шагу обменов (SESSION-1d)'
          items:
            type: object
            required: [ref, frame_target, frame_native, said]
            properties:
              ref: { type: string, description: '`p2` — по нему сверяют выбор с `correct_frame`' }
              frame_target: { type: string, description: 'Каркас на языке цели с `___`' }
              frame_native: { type: string, description: 'Он же на родном' }
              said:
                type: object
                description: 'Каркас целой фразой — так вариант показывают (SESSION-1e): у нужного — с наполнением, которым ответили в этом обмене; у чужого — с наполнением, которым его говорит диалог (не говорит — с первым)'
                required: [index, text_target, text_native, audio]
                properties:
                  index: { type: [integer, 'null'], description: 'Номер наполнения фразы; null — фраза сказана не наполнением окна' }
                  text_target: { type: string, description: 'Фраза целиком на языке цели' }
                  text_native: { type: string, description: 'Она же на родном' }
                  audio: { $ref: '#/components/schemas/PlanCardAudio' }
        correct_frame: { type: string, description: '`ref` верного каркаса' }
        chips:
          type: array
          description: 'Наполнения верного каркаса — годится любое'
          items: { $ref: '#/components/schemas/PlanCardFiller' }
        correct_filler: { type: [integer, 'null'], description: 'Каким наполнением ответили в этом обмене — для разбора после выбора; null, если не определено' }

    PlanCardPayloadDialoguePartner:
      type: object
      title: dialogue_partner
      additionalProperties: false
      description: 'Что имел в виду партнёр (33-1): звучит его реплика, ученик выбирает пересказ на родном. Текст реплики открывают после верного ответа — это решает клиент.'
      required: [scene_id, exchange, partner_line, question_native, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        partner_line: { $ref: '#/components/schemas/PlanCardLine' }
        question_native: { type: string, description: 'Вопрос проверки на родном — заголовок карточки' }
        options:
          type: array
          description: 'Четыре варианта на родном: три от проверки этого обмена и верный вариант самого дальнего обмена'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadDialogueAnswer:
      type: object
      title: dialogue_answer
      additionalProperties: false
      description: >-
        Ответь партнёру своей репликой (33-2 / 33-3 / 33-4). Режим выбирает клиент: beginner — чипы,
        intermediate — голос по подсказке, «Без подсказок» — голос по пустому каркасу. Зачёт у клиента:
        покрытие слов каркаса; окно — любое.
      required: [scene_id, exchange, partner_line, own_line, frame, modes, speech_mode]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange:
          description: 'Обмен, в котором отвечает ученик — всегда `answer`'
          allOf:
            - $ref: '#/components/schemas/PlanCardExchange'
            - properties: { kind: { const: answer } }
        partner_line: { $ref: '#/components/schemas/PlanCardLine' }
        own_line: { $ref: '#/components/schemas/PlanCardOwnLine' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        modes:
          type: object
          description: 'Данные для всех трёх режимов сразу — карточка режим не выбирает'
          required: [chips, voice_hint, voice_blind]
          properties:
            chips:
              type: array
              description: 'Наполнения каркаса — верны все; пустой список у каркаса без окна'
              items: { $ref: '#/components/schemas/PlanCardFiller' }
            voice_hint: { type: string, description: 'Своя реплика целиком — подсказка на экране, пока говорят' }
            voice_blind: { type: string, description: 'Каркас с пустым окном — то же без подсказки' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }

    PlanCardPayloadDialogueAsk:
      type: object
      title: dialogue_ask
      additionalProperties: false
      description: >-
        Спроси первым (33-5): ученик говорит, ответ партнёра звучит после — и тут же проверка
        понимания этого обмена (наряд BACK-TAILS-1 §1.5). Одна карточка, один экран: реплика ученика,
        закрытый текст ответа агента, вопрос и четыре варианта, текст открывается после ответа.
        Отдельной карточки проверки у ask-обменов больше нет. Голосовые ключи — как у
        `dialogue_answer`; `question_native`, `options` и `correct` — те же имена и то же правило
        состава, что у `dialogue_partner`. Итог карточки — голосовой (`passed` / `hinted` /
        `skipped`); выбор варианта клиент зачитывает сам по `correct`.


        Три ключа проверки приходят **вместе или не приходят вовсе**: у обмена, чью проверку не
        собрать (варианты совпали по тексту, и выбирать не из чего), карточка раздаётся без них —
        реплика ученика есть, а спрашивать нечего. Обязательными их не делает `required`: иначе
        сервер отдавал бы payload мимо своей же схемы (терпимость сборки, `docs/plan-v2.md` §6).
      required: [scene_id, exchange, partner_line, own_line, frame, modes, speech_mode]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange:
          description: 'Обмен, в котором ученик спрашивает первым — всегда `ask`'
          allOf:
            - $ref: '#/components/schemas/PlanCardExchange'
            - properties: { kind: { const: ask } }
        partner_line: { $ref: '#/components/schemas/PlanCardLine' }
        own_line: { $ref: '#/components/schemas/PlanCardOwnLine' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        modes:
          type: object
          description: 'Данные для всех трёх режимов сразу'
          required: [chips, voice_hint, voice_blind]
          properties:
            chips:
              type: array
              description: 'Наполнения каркаса — верны все; пустой список у каркаса без окна'
              items: { $ref: '#/components/schemas/PlanCardFiller' }
            voice_hint: { type: string, description: 'Своя реплика целиком — подсказка на экране' }
            voice_blind: { type: string, description: 'Каркас с пустым окном' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
        question_native: { type: string, description: 'Вопрос проверки на родном — про ответ агента, звучащий на этой же карточке' }
        options:
          type: array
          description: 'Четыре варианта на родном: три от проверки этого обмена и верный вариант самого дальнего обмена — правило `dialogue_partner`'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadDialogueRescue:
      type: object
      title: dialogue_rescue
      additionalProperties: false
      description: >-
        «Не понял» (33-6): ученик просит повторить, партнёр говорит то же медленнее. Микрофона у кадра
        нет — карточку проходят насквозь: `passed` или `skipped`.
      required: [scene_id, exchange, asked_line, rescue_line, partner_repeat, slow_rate, expected_text, speech_mode]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        asked_line:
          description: 'Реплика партнёра из предыдущего обмена — та, которую не поняли; null, если её нет'
          oneOf:
            - $ref: '#/components/schemas/PlanCardLine'
            - type: 'null'
        rescue_line: { $ref: '#/components/schemas/PlanCardLine' }
        partner_repeat: { $ref: '#/components/schemas/PlanCardLine' }
        slow_rate: { type: number, description: 'Темп, которым переигрывают реплику партнёра — 0.75' }
        expected_text: { type: string, description: 'Что говорит ученик — реплика-выручалка целиком' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }

    PlanCardPayloadListenDialogue:
      type: object
      title: listen_dialogue
      additionalProperties: false
      description: 'Весь визит один раз на слух (34-1). Текстов клиент не показывает — только метки говорящих и время; итог — `passed` по «Дальше».'
      required: [scene_id, lines, total_ms]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        lines:
          type: array
          description: 'Все реплики визита по порядку — их и играют подряд'
          items: { $ref: '#/components/schemas/PlanCardVisitLine' }
        total_ms: { type: [integer, 'null'], description: 'Сколько длится вся лента; null, пока хотя бы у одной реплики нет звука' }

    PlanCardPayloadListenQuestion:
      type: object
      title: listen_question
      additionalProperties: false
      description: 'Вопрос по услышанному (34-2): вопрос на родном и четыре ответа на родном. Зачёт у клиента по `correct`.'
      required: [scene_id, question, options, correct, exchange_step]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        question:
          type: object
          description: 'Вопрос листенинга'
          required: [ref, text_native]
          properties:
            ref: { type: string, description: '`L2` — адрес вопроса; он же `unit.ref` карточки' }
            text_native: { type: string, description: 'Вопрос на родном' }
        options:
          type: array
          description: 'Четыре варианта на родном: три от этого вопроса и один неверный от другого'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }
        exchange_step: { type: [integer, 'null'], description: 'Обмен, о котором вопрос — для разбора; null, когда сервер его не определил' }

    PlanCardPayloadListenReview:
      type: object
      title: listen_review
      additionalProperties: false
      description: 'Разбор услышанного (34-3): та же лента, но с текстами, и указание, где стоял ответ на каждый вопрос. Зачёта нет — «Дальше».'
      required: [scene_id, lines, total_ms, answers]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        lines:
          type: array
          description: 'Все реплики визита по порядку — теперь с текстами'
          items: { $ref: '#/components/schemas/PlanCardVisitLine' }
        total_ms: { type: [integer, 'null'], description: 'Сколько длится вся лента; null, пока хотя бы у одной реплики нет звука' }
        answers:
          type: array
          description: 'Где в ленте стоял ответ на каждый вопрос — это подсвечивают'
          items:
            type: object
            required: [question_ref, exchange_step, line_ref, span]
            properties:
              question_ref: { type: string, description: '`L2` — какой это вопрос' }
              exchange_step: { type: [integer, 'null'], description: 'Обмен с ответом; null, когда он не определён' }
              line_ref: { type: [string, 'null'], description: 'Реплика с ответом — `x3` или `x3b`; null, когда обмен не определён' }
              span:
                description: 'Место ответа внутри `text_target` реплики, [начало, конец) в символах; null — подсвечивать нечего, показывают всю реплику'
                oneOf:
                  - type: array
                    items: { type: integer, minimum: 0 }
                    minItems: 2
                    maxItems: 2
                  - type: 'null'

    PlanCardPayloadListenPredict:
      type: object
      title: listen_predict
      additionalProperties: false
      description: >-
        «Что прозвучит в ответ?» (34-5, наряд BACK-TAILS-1 §1.2): своя реплика-вопрос звучит и
        показана, ученик выбирает на СЛУХ, что ответит агент. Варианты — не строки на родном, а
        реплики дня: у каждого `text_target`, `text_native` и звук. До ответа клиент даёт слушать и
        текстов не показывает, после — открывает оба. Неверно — окончательно, без копии.
      required: [scene_id, exchange, own_line, options, correct, partner_line]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        own_line: { $ref: '#/components/schemas/PlanCardLine' }
        options:
          type: array
          description: 'Три реплики агента: та, что реально звучит в ответ (верная), и две другие того же рода — отвечающие ученику (обмены `ask` и `rescue`); таких не хватает — добор репликами той же формы, потом любыми'
          items: { $ref: '#/components/schemas/PlanCardLineOption' }
        correct: { type: string, description: '`id` верного варианта' }
        partner_line: { $ref: '#/components/schemas/PlanCardLine' }

    PlanCardPayloadListenPace:
      type: object
      title: listen_pace
      additionalProperties: false
      description: 'Темп речи (34-6): одна длинная реплика партнёра, сначала медленно, потом обычно. Зачёта нет — `passed` по «Понял».'
      required: [scene_id, exchange, partner_line, rates]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        partner_line: { $ref: '#/components/schemas/PlanCardLine' }
        rates:
          type: array
          description: 'Темпы, которыми играют реплику, по порядку — 0.75 и 1.0'
          items: { type: number }

    PlanCardPayloadListenNumber:
      type: object
      title: listen_number
      additionalProperties: false
      description: >-
        «Поймай число» (34-7): звучит реплика с числом, ученик выбирает его значение на родном. Зачёт
        у клиента по `correct`. Варианты — только числа и количества дня (наряд BACK-TAILS-1 §1.3):
        числительное или единица, в которой что-то считают («через неделю», «два дня»); «сегодня»,
        «завтра», «раньше» — не числа и вариантами не бывают.
      required: [scene_id, line, span, options, correct]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        line: { $ref: '#/components/schemas/PlanCardVisitLine' }
        span:
          type: array
          description: 'Место числа в `line.text_target`, [начало, конец) в символах — его подсвечивают при разборе'
          items: { type: integer, minimum: 0 }
          minItems: 2
          maxItems: 2
        options:
          type: array
          description: 'Три значения на родном: верное и два других числа или количества этого дня'
          items: { $ref: '#/components/schemas/PlanCardOption' }
        correct: { type: string, description: '`id` верного варианта' }

    PlanCardPayloadSpeakAnswer:
      type: object
      title: speak_answer
      additionalProperties: false
      description: >-
        Ответь сам (35-2): звучит реплика партнёра, ученик говорит свою по смыслу; каркас — подсказка,
        которую открывают по кнопке или после 5 с молчания. Зачёт ТОЛЬКО сервером (`judge: true`,
        `POST …/judge`, `hinted: true`, если каркас открывали); клиенту остаётся «Пропустить».
      required: [scene_id, exchange, partner_line, own_line, task_native, task_clause_native, frame, key, speech_mode, hint, judge]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        partner_line:
          description: 'Реплика, на которую отвечают; у обмена-вопроса — реплика партнёра из предыдущего обмена, у первого обмена null'
          oneOf:
            - $ref: '#/components/schemas/PlanCardLine'
            - type: 'null'
        own_line: { $ref: '#/components/schemas/PlanCardOwnLine' }
        task_native: { type: string, description: 'Что нужно сказать, на родном — задание, предложением (его цитирует «Спроси сам»)' }
        task_clause_native: { type: string, description: 'То же задание ПРИДАТОЧНЫМ — со строчной, без точки: клиент печатает его внутри своего «Скажи, что …» (кадр 35-2, наряд FIX-3 §11): «у него болит поясница»' }
        frame: { $ref: '#/components/schemas/PlanCardFrame' }
        key: { type: [string, 'null'], description: 'Ключ произнесения — слова, с которых просят начать' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
        hint: { type: string, description: 'Каркас с окном — это и открывают подсказкой' }
        judge: { type: boolean, description: 'Всегда true: зачёт этой карточки пишет сервер' }

    PlanCardPayloadSpeakEcho:
      type: object
      title: speak_echo
      additionalProperties: false
      description: >-
        «Повтори через паузу» (35-3): звучит СВОЯ реплика ученика, текст скрыт до ответа, после паузы ученик говорит её сам.
        Клиент зачитывает сам по покрытию. С наряда CONV-2 (п. 6) — только реплика ученика: «Говорю сам» — часть ученика, и
        реплику собеседника («Please bring a towel, use clean shoes…» — день Дена 21.09) его больше не просят повторить.
        Реплика — следующая свободная (не занятая `speak_answer` и `speak_retell`), а если свободных нет — самая длинная
        реплика дня, которую не взял `speak_retell`. Чужой реплики на карточке нет ни в каком поле: временная копия под
        `partner_line` для сборки 1.0.0 (17) снята (наряд BACK-TAILS-2 §10) — звучащая реплика только `own_line`.
      required: [scene_id, exchange, own_line, expected_text, speech_mode, pause_ms]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        own_line: { $ref: '#/components/schemas/PlanCardOwnLine' }
        expected_text: { type: string, description: 'Что должно прозвучать — своя реплика целиком' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }
        pause_ms: { type: integer, description: 'Пауза после звука, прежде чем ждать речь — 3000 мс' }

    PlanCardPayloadSpeakRetell:
      type: object
      title: speak_retell
      additionalProperties: false
      description: >-
        «Повтори свою реплику» (35-4, наряд BACK-TAILS-1 §1.1): звучит СВОЯ реплика ученика, её текст
        цели закрыт, перевод оставлен подсказкой смысла — ученик говорит её вслух, и текст цели
        открывается после попытки. Зачёт у клиента: вся реплика по `speech_mode`,
        без сети. Сервер эту карточку не судит — `POST …/judge` на неё отвечает 422
        `plan_card_not_judged`.
      required: [scene_id, exchange, own_line, expected_text, speech_mode]
      properties:
        scene_id: { type: string, description: 'Сцена карточки' }
        exchange: { $ref: '#/components/schemas/PlanCardExchange' }
        own_line: { $ref: '#/components/schemas/PlanCardOwnLine' }
        expected_text: { type: string, description: 'Что должно прозвучать — своя реплика целиком' }
        speech_mode: { $ref: '#/components/schemas/PlanSpeechMode' }

    PlanCardPayloadRecallScenes:
      type: object
      title: recall_scenes
      additionalProperties: false
      description: >-
        «Вспомни свои реплики» (37-3, наряд CONV-1) — единственная карточка этапа «Вспомнить» у дня
        репетиции: лист со СВОИМИ репликами каждой сцены плана, с переводом и звуком. Ничего не
        проверяет и ничего не выбирает — это напоминание перед разговором; итог — `passed` по
        «Дальше» (или `skipped`). Сцены листаются по порядку плана. С наряда BACK-TAILS-2 (§§5–6):
        реплика листа — только `{ref, text_target, text_native, audio}` ученика, в порядке визита, и
        реплики собеседника не едут ни в каком поле; имя сцены — имя из плана (то же, что у маршрута,
        окна и разговора), не заголовок урока. Фото сцены — `Plan.scenes[].image` по `scene_id`.
      required: [scene_id, scenes]
      properties:
        scene_id: { type: string, description: 'Первая сцена листа — ключ есть у любого payload' }
        scenes:
          type: array
          description: 'Сцены плана по порядку; на каждой — свои реплики ученика'
          items:
            type: object
            additionalProperties: false
            required: [scene_id, title_target, title_native, lines]
            properties:
              scene_id: { type: string }
              title_target: { type: string, description: 'Имя сцены в плане, на языке цели (`Plan.scenes[].title_target`)' }
              title_native: { type: string, description: 'Имя сцены в плане (`Plan.scenes[].title_native`)' }
              lines:
                type: array
                description: 'Свои реплики ученика в порядке визита'
                items:
                  type: object
                  additionalProperties: false
                  required: [ref, text_target, text_native, audio]
                  properties:
                    ref: { type: string, description: '`x3b` — реплика ученика обмена 3' }
                    text_target: { type: string }
                    text_native: { type: string }
                    audio: { $ref: '#/components/schemas/PlanCardAudio' }

    PlanConversation:
      type: object
      description: >-
        THE TALK WITH THE AGENT (наряд CONV-1, кадры 37-5…37-12) — the sixth stage of a day, whole:
        the ribbon, whose move it is, the intention offered for the next one and, once it is over,
        the summary. Everything countable is counted here; the client words nothing. Since наряд CONV-2:
        the entry title, the TARGETS the talk is for (ticked off turn by turn) and whether it is a replay. Since наряд
        FIX-4 (every field added, none changed): where each target stands (`targets[].state`), the constructions said
        beside the targets (`extra_said`), the hint whole with its exact line after an «almost» (`hints.target`, `ref`),
        and the scenes' border kept by the server — each line's scene and the greeting and goodbye of a scene
        (`turns[].scene_id`, `scene_event`). Since наряд FIX-4b (added, none changed): the hint as the lesson's own
        sentence (`hints.sentence`) — the one the client shows, with no «Скажи, что …» around it; a construction is
        also heard straight after a conjunction that opens a clause («… my first visit and I have about a year of
        experience»).
      required: [id, plan_id, day, type, state, replay, talk_title_native, partner, scene, scenes, minutes_estimate, turns_left, targets, extra_said, hints, turns, summary]
      properties:
        id: { type: string, minLength: 26, maxLength: 26 }
        plan_id: { type: string }
        day: { type: integer, description: 'The day''s number' }
        replay:
          type: boolean
          description: >-
            «Ещё раз» on a walked day (наряд CONV-2, п. 2): the day's sixth stage was walked by an earlier talk that
            ended of its own, and this one began after it. A replay walks nothing and gives nothing back tomorrow
            (`summary.returns_tomorrow` false) — the day's result is the talk that walked the stage, and the day
            closes on it whether the replay is finished or not.
        talk_title_native: { type: [string, 'null'], description: '«Поговори с врачом» — the entry title (кадр 37-5), the same string as the talk''s row of the window (наряд CONV-2, п. 12); a talk over several scenes names every role in the order it walks them (наряд FIX-4c §4): «Поговори с регистратором и врачом», «Поговори с регистратором, врачом и медсестрой»' }
        type:
          type: string
          enum: [day, rehearsal, review]
          description: 'The talk at the end of a scene day, over the whole visit on the rehearsal, over the repeated days on a review day — a move per target and two more (`turns_left`), up to its minutes (5 / 6 / 4)'
        state:
          type: string
          enum: [agent_turn, your_turn, ended]
          description: >-
            Whose move it is. There is no «thinking» state: the client draws its own three dots while
            the request is in flight.
        partner:
          type: object
          description: 'Who the learner is talking to NOW — the role of the current scene (кадр 30-2b)'
          required: [role_native, role_target]
          properties:
            role_native: { type: string }
            role_target: { type: string }
        scene:
          type: object
          description: 'The scene the talk is in now'
          required: [title_native, title_target]
          properties:
            title_native: { type: string }
            title_target: { type: string }
        scenes:
          type: array
          description: 'Every scene of the talk, in the order it walks them («Из каких сцен», кадр 37-1)'
          items:
            type: object
            required: [scene_id, title_native, title_target, role_native, role_target, lines, state]
            properties:
              scene_id: { type: string }
              title_native: { type: string }
              title_target: { type: string }
              role_native: { type: string }
              role_target: { type: string }
              lines: { type: integer, description: 'How many lines of their own the learner is preparing there' }
              state: { type: string, enum: [current, done, locked] }
        minutes_estimate: { type: integer, description: '«около N минут» — the talk''s own, by its kind: 5 on a scene day, 6 on the rehearsal, 4 on a review (`plan.conversation.minutes`, наряд FIX-3 §7). It is also the talk''s HARD STOP: once the time the talk was talked reaches it, the role''s next line is its last (`ended_reason: limit`)' }
        turns_left: { type: integer, minimum: 0, description: 'The learner''s moves left — a move per target and two more (наряд FIX-3 §7: 7 targets → 9 moves); over several scenes, each scene''s moves together — a move per target of the scene and one more (наряд FIX-4 §4: 4 + 1 and 3 + 1). A rescue spends none of them. Every target said is no end of a day''s talk; a scene of a rehearsal closes on it (see `turns[].scene_event`)' }
        targets:
          type: array
          description: >-
            «Скажи в разговоре» (наряд CONV-2, п. 10): the four to seven constructions of the plan the talk is FOR (наряд
            FIX-3 §6), over its checkpoints in order — inside a scene as its visit says them, over several scenes shared
            out scene after scene. `said` turns true the move the SERVER hears the construction with a value of the
            learner's own (`value_target`), so the entry lists them and the ribbon's strip ticks them off; the summary
            prints the same list. The day window's talk row prints the same list (`PlanWindowStage.targets`). The role is
            led to them one by one (наряд FIX-3 §7).
          maxItems: 7
          items: { $ref: '#/components/schemas/PlanConversationTarget' }
        extra_said:
          type: array
          description: '«Ещё вспомнил» (наряд FIX-4 §2): the constructions of the talk''s scenes said that are no target — never in «X из Y»'
          items: { $ref: '#/components/schemas/PlanConversationTarget' }
        hints:
          type: object
          required: [enabled, delay_ms, target, scene_id, ref, sentence]
          properties:
            enabled: { type: boolean, description: 'False — «Без подсказок»: the client hides the plate and offers «Подсказать». The hint itself travels in BOTH modes (наряд FIX-4c §2): `sentence`, `target`, `scene_id` and `ref` are the same whatever `enabled` says' }
            delay_ms: { type: integer, description: 'How long the silence is before the chip comes up by itself (кадр 37-7)' }
            target:
              type: [string, 'null']
              description: 'The target''s exact line in the language of the talk («The pain is sharp when he bends.») — only on the move right after one that said it almost (наряд FIX-4 §5); else null'
            scene_id: { type: [string, 'null'], description: 'Which target the hint is — its scene…' }
            ref: { type: [string, 'null'], description: '…and its ref: `targets[]` by these two' }
            sentence:
              type: [string, 'null']
              description: >-
                The hint AS THE CLIENT SHOWS IT (наряд FIX-4b §2): the target to offer for the next move WHOLE — the
                lesson's own sentence of it, its value in it (never «у него болит …», наряд FIX-4 §5) — in the learner's
                language exactly as the lesson has it, its capital and its closing mark («У него болит поясница.», «Мне
                сказать вам его температуру?»), with no «Скажи, что …» around it: the frame read crooked for a question.
                Which target: the one the role's last line has just opened, else the first target of the scene not said
                yet; after a move that said a target ALMOST, that target. It changes with every line of the role. Null
                when the move is not the learner's, when every target of the scene is said, and when the talk has ended
                — in «Без подсказок» too (наряд FIX-4c §2). The clause for the frame of the build (20), `native`, is
                gone (наряд ACC-1 §5).
        turns:
          type: array
          description: 'The whole ribbon, oldest first — the talk is a dozen short lines, so it travels whole'
          items: { $ref: '#/components/schemas/PlanConversationTurn' }
        summary:
          oneOf:
            - $ref: '#/components/schemas/PlanConversationSummary'
            - type: 'null'

    PlanConversationTurn:
      type: object
      description: 'One line of the ribbon, written once and never changed'
      required: [index, speaker, kind, text_target, text_native, audio, understood, phrases_used, extra_said, off_topic, created_at, scene_id, scene_event]
      properties:
        index: { type: integer, minimum: 1, description: 'Its place in the journal — the server''s, not the client''s' }
        speaker: { type: string, enum: [partner, learner] }
        kind:
          type: string
          enum: [agent, said, rescue, skip]
          description: 'The role''s line, or what the learner did: said something, asked to hear it again, or let the turn go'
        text_target: { type: [string, 'null'], description: 'The role''s line, what the recogniser heard, or — on a rescue — what a learner says when they did not catch it, in the language of the talk (en «Sorry?», наряд CONV-2, п. 4а); null for a skip' }
        text_native: { type: [string, 'null'], description: 'The role''s line in the learner''s language; null on the learner''s own. An empty string when the role gave no translation twice (наряд FIX-4c §6: empty, in the language of the talk, or the same words — asked once more, then the line is said with none): the client prints no translation, never the line again' }
        audio:
          oneOf:
            - $ref: '#/components/schemas/PlanCardAudio'
            - type: 'null'
          description: 'The role''s voice for this line; null when the vendor did not say it — the phone reads it itself'
        understood: { type: [boolean, 'null'], description: 'Did the learner''s move answer what was asked — the role''s judgement; null on a rescue, a skip and the opening line, and on a move that BROKE OFF («I''m flying to», «Yes my»): an unfinished line is not a misunderstanding (наряд FIX-3 §7)' }
        phrases_used:
          type: array
          description: >-
            The targets the learner's line said — by the SERVER's judge of the construction (наряд FIX-4 §2: a coherent
            phrase in the scene the talk is in; the model's word is not read) — named by scene and ref; their frames
            and values are the talk's `targets` (наряд FIX-3 §6: the construction, not a text of its own). Empty on the
            role's own lines.
          items:
            type: object
            additionalProperties: false
            required: [scene_id, ref]
            properties:
              scene_id: { type: string }
              ref: { type: string, description: 'The phrase — `p3`' }
        extra_said:
          type: array
          description: 'The constructions of the scene the line said that are no target (наряд FIX-4 §2) — by scene and ref, their frames in `extra_said` of the talk'
          items:
            type: object
            additionalProperties: false
            required: [scene_id, ref]
            properties:
              scene_id: { type: string }
              ref: { type: string }
        off_topic: { type: [boolean, 'null'], description: 'Did the move go where this person would not go' }
        created_at: { type: string, format: date-time }
        scene_id: { type: [string, 'null'], description: 'The scene the line was said in (наряд FIX-4 §4); null on a line written before it' }
        scene_event:
          type: [string, 'null']
          enum: [start, end, null]
          description: >-
            In a talk over several scenes (наряд FIX-4 §4): `start` — the role of a scene greets the learner first (a new
            person, its own voice — the voice changes on this line) and opens the first target of its scene; `end` — the
            role's short goodbye when the server closed its scene (its targets said or its moves spent) — no door. Null
            on every other line and on every line of a day's talk.

    PlanConversationSummary:
      type: object
      description: 'THE SUMMARY (кадр 37-12) — a projection of the journal, never a second count kept beside it'
      required: [said_count, phrases_used, phrases_total, phrases, understood_all, not_understood, rescues, ended_reason, ended_by_limit, minutes, returns_tomorrow, extra_said]
      properties:
        said_count: { type: integer, description: '«Сказал сам N реплик» — moves with words of the learner''s own in them' }
        phrases_used: { type: integer, description: 'How many of the talk''s targets sounded' }
        phrases_total: { type: integer, description: 'How many targets the talk has (4–7)' }
        phrases:
          type: array
          description: 'The talk''s TARGETS — the same list and shape as `targets` (наряд FIX-3 §6): «Фразы дня в разговоре» with the value the learner said each with, and «Не прозвучало»'
          items: { $ref: '#/components/schemas/PlanConversationTarget' }
        understood_all: { type: boolean }
        not_understood: { type: integer, minimum: 0, description: 'Moves the role ruled were not an answer to what it asked' }
        rescues: { type: integer, minimum: 0, description: '«переспросил N раз» — always neutral' }
        ended_reason:
          type: [string, 'null']
          enum: [natural, limit, declined, replayed, null]
          description: >-
            `natural` — the role said goodbye (the last move, or the learner's goodbye — never «every target is
            said», наряд FIX-3 §7); `limit` — the talk reached the money or the minutes the plan allows it and the
            role closed it on its next move; `declined` — a refused subject pushed twice;
            `replayed` — «Ещё раз» closed it to make room for a new one.
        ended_by_limit:
          type: boolean
          description: >-
            A limit ended the talk (наряд FIX-4 §4): `limit`, or the role's goodbye when the learner's moves ran out
            before the talk's scenes were walked. A flag beside `ended_reason`, whose values do not change.
        extra_said:
          type: array
          description: '«Ещё вспомнил» (наряд FIX-4 §2): the constructions said beside the targets, with their values'
          items: { $ref: '#/components/schemas/PlanConversationTarget' }
        minutes: { type: [integer, 'null'], description: '«Разговор окончен · 3 минуты» — the time the talk was TALKED: the gaps between its neighbouring lines, each counted up to 60 s (наряд CONV-2, п. 3); a talk left open for five hours is two minutes, not three hundred' }
        returns_tomorrow:
          type: boolean
          description: >-
            Do the targets that did not sound come back tomorrow (`speak_retell`). False on the
            rehearsal — there is no tomorrow before the event, «повтори перед приёмом» — and on a replay:
            the day's result is the talk that walked its stage (наряд CONV-2, п. 2).

    PlanDayCards:
      type: object
      required: [plan_id, day_id, number, status, cards, speech]
      properties:
        plan_id: { type: string }
        day_id: { type: string }
        number: { type: integer }
        status: { type: string, enum: [locked, open, in_progress, closed] }
        cards:
          type: array
          description: In walking order — stage by stage, position by position
          items: { $ref: '#/components/schemas/PlanCard' }
        speech: { $ref: '#/components/schemas/PlanSpeechRules' }

    PlanSpeechRules:
      type: object
      additionalProperties: false
      description: >-
        ЧТО СРАВНЕНИЕ РЕЧИ ЗНАЕТ О ЯЗЫКЕ ЦЕЛИ (наряд FIX-2, п. 2) — списки из пакета языка и
        одна ручка, один раз на день. Они едут сюда, а не в каждую карточку, потому что относятся к
        языку плана, а не к тренажёру, и потому что телефон обязан судить попытку ТЕМ ЖЕ правилом,
        что и сервер: не своей копией английского в Dart, а пакетом, который сервер и читает.


        Язык, для которого пакет не написан, отдаёт пустые списки — тогда не прощается ничего.


        Каждое СЛОВО списков (`unstressed_words`, `articles`, записи `number_words`, `number_joiners`,
        `number_tens_joiners`) приходит уже в канонической форме текста, с которым оно сравнивается (наряд LANG-1 §4):
        свёрнуто (NFC, «ß» → «ss», «œ» → «oe», румынские «ş ţ» с седилью → «ș ț» с запятой), нижний регистр, без
        апострофа, дефис — пробел. Пакет может писать «dreißig», «quatre-vingt-dix», «şi» — сюда едут «dreissig»,
        «quatre vingt dix», «și». Сокращения (`abbreviations`) — исключение: они ищутся в тексте как он написан.
      required: [unstressed_words, articles, abbreviations, number_words, number_joiners, repeat_misses]
      properties:
        unstressed_words:
          type: array
          description: 'Слова, которые ест распознаватель (артикли, предлоги, вспомогательные глаголы): в режиме `repeat` они не считаются НИ в ожидании, НИ в услышанном'
          items: { type: string }
        articles:
          type: array
          description: 'Артикли — их прощает режим `free`, где порог это ДОЛЯ слов и снимать все служебные было бы нечего считать'
          items: { type: string }
        abbreviations:
          type: array
          description: 'Сокращения как они ПИШУТСЯ («p.m.»): точки внутри сворачиваются в буквы перед любым сравнением, иначе «3 p.m.» это три слова. Ищутся в тексте как он написан, без учёта регистра, поэтому едут с точками и регистром (только буквы — в составленной форме NFC, «ș ț» с запятой)'
          items: { type: string }
        number_words:
          type: object
          description: >-
            Запись → её цифры («three» → «3»): распознаватель пишет число и так и так, а человек сказал одно и то же.
            Запись — одно слово или НЕСКОЛЬКО через один пробел, в канонической форме (fr «soixante dix» → «70», «quatre
            vingt dix» → «90»; наряд LANG-1 §4). ПРАВИЛО СЛОЖЕНИЯ (наряд FIX-3 §4, DECISIONS п. 393), одно у сервера и у
            телефона, над каноническими словами (регистр, знаки, дефис — пробел: «forty-five» = «forty five»), слева направо:
            на каждом месте читается САМАЯ ДЛИННАЯ запись, чьи слова там стоят, — одним значением («quatre vingt dix neuf» с
            такой записью — 99, «quatre vingt» — 80, одиночное «quatre» — 4); артикль (`articles`) прямо перед разрядом —
            единица («a hundred» → 100, ro «o sută» → 100); значения одного числа складываются, пока следующее ПОДХОДИТ —
            разряд (100, 1000, …) после числа больше нуля и меньше разряда умножает его («two hundred» → 200, «two thousand
            five» → 2005), любое другое значение после значения ≥ 20 меньше его младшего разряда прибавляется («forty five» →
            45, «hundred twenty» → 120); «ten five», «twenty twelve», «two three» — два числа; соединители — см.
            `number_joiners` и `number_tens_joiners`. Сложенное пишется цифрами на месте своих слов; цифры в тексте остаются
            как есть и ни с чем не складываются. Обе стороны — и ожидание, и услышанное — сравниваются уже в цифрах: «I'll
            rest for forty-five seconds» = «I will rest for 45 seconds».
          additionalProperties: { type: string }
        number_joiners:
          type: array
          description: 'Соединители ПОСЛЕ РАЗРЯДА (en «and», de «und»; наряд FIX-3 §4): слово между разрядом (hundred, thousand, …) и числом меньше ста после него — часть одного числа: «one hundred and twenty» → 120, «two thousand and five» → 2005, de «tausend und eins» → 1001. Только там: после десятков такой соединитель начинает следующее число («between twenty and one hundred» — два числа, 20 и 100), в остальных местах это обычное слово («two hundred and a thousand», «five and six»). Пустой список — у языка их нет'
          items: { type: string }
        number_tens_joiners:
          type: array
          description: 'НЕОБЯЗАТЕЛЬНЫЙ ключ (наряд LANG-1 §4): соединители ПОСЛЕ ДЕСЯТКОВ (es «y», ro «și», fr «et») — слово между значением ≥ 20, которое не разряд и не пришло само через соединитель, и значением, которое подходит после него: «treinta y uno» → 31, «douăzeci și unu» → 21, «vingt et un» → 21, «treinta y un mil» → 31000; что не подходит, не соединяется («vingt et onze» — три слова). Отдельный список, потому что английский ставит свой «and» только после разряда. Приходит только у языка, у которого он есть; нет ключа — нет соединителей (en, ru)'
          items: { type: string }
        repeat_misses:
          type: integer
          minimum: 0
          description: 'Сколько СМЫСЛОВЫХ слов реплики на экране разрешено потерять в режиме `repeat` — ноль, пока телефон не докажет обратного (`plan.speech.repeat_misses`)'

    PlanSpeechMode:
      type: string
      enum: [repeat, free]
      description: >-
        Каким правилом судится сказанное (наряд FIX-2, п. 2) — вместо прежней доли `coverage_min`.


        `repeat` — ТЕКСТ НА ЭКРАНЕ, его читают или повторяют: все смысловые слова ожидаемого текста,
        по порядку; служебные слова пакета (`speech.unstressed_words`) не считаются ни в ожидании, ни
        в услышанном, лишние слова вокруг не мешают, а `speech.repeat_misses` говорит, сколько
        смысловых слов всё же прощается. Доля здесь была неверной меркой: «He has a rush» это 70 % от
        «He has a rash» и другое предложение.


        `free` — ученик говорит СВОЁ предложение, и проверяется только КЛЮЧ: доля слов, которых
        карточка просит (у плана — слова каркаса вне окна), всё у короткого ключа и 70 % у длинного,
        мультимножеством и без учёта порядка.

    PlanAnswerOutcome:
      type: object
      description: >-
        What one answer changed (наряд SESSION-1a, D-02 — additive): the card, its copy at the end of
        the stage if there is one, whether the unit comes back and on which day, the day's numbers and
        the minutes of this card's stage. A stage's summary (30-6 / 33-8 / 34-8 / 35-6) and the day's
        (30-7) are written from these — the client counts nothing itself.
      required: [card, requeued, unit, day, stage]
      properties:
        card: { $ref: '#/components/schemas/PlanCard' }
        requeued:
          oneOf:
            - $ref: '#/components/schemas/PlanCard'
            - type: 'null'
          description: The same card dealt again at the end of its stage after a FIRST lapse — a new id, a new position, its options and tiles reshuffled, a phrase card said with another filler of its frame (a lapse of `phrase_repeat` / `phrase_other_slot` is `skipped` after two attempts with a microphone, SESSION-1d); null otherwise, and always null in the listen stage
        unit:
          type: object
          description: The unit this card teaches, and what the answer did to it
          required: [kind, ref, returns_tomorrow, returns_day]
          properties:
            kind: { type: string, enum: [word, phrase, exchange, day] }
            ref: { type: string }
            returns_tomorrow: { type: boolean, description: 'Failed twice — the unit comes back once, on the nearest following day of any type (never a `day` unit, never from a card that is itself a return)' }
            returns_day: { type: [integer, 'null'], description: 'The number of the day it comes back on; null when it is not coming back, or no day is left to deal it' }
        day:
          type: object
          description: The day as it stands after the answer — refolded from its cards, never incremented
          required: [cards_total, cards_done, minutes_spent]
          properties:
            cards_total: { type: integer }
            cards_done: { type: integer }
            minutes_spent: { type: integer, description: 'The cards'' minutes from answer timestamps (gaps over two minutes not counted — the learner away, наряд FIX-3 §2) plus the talk that walked the sixth stage, once it has (наряд BACK-TAILS-2 §8)' }
        stage:
          type: object
          description: This card's stage, counted the same way
          required: [stage, minutes_spent]
          properties:
            stage: { type: string, enum: [words, phrases, dialogue, listen, speak, recall, repetition] }
            minutes_spent: { type: integer }

    PlanJudgeOutcome:
      type: object
      description: >-
        The judge's ruling on one attempt (наряд SESSION-1a, разд. 4) and the card as it stands after
        it: answered when accepted, one attempt more when not. `result` and `attempts` are the card's
        own, repeated at the top for the screen that shows nothing else.
      required: [accepted, heard, slot_value, reason_native, result, attempts, card]
      properties:
        accepted: { type: boolean, description: 'Whether this attempt passes' }
        heard: { type: string, description: 'What the server judged — `heard` as it arrived (наряд CONV-2, п. 8): the client prints «услышал: …» under a refusal, so a learner tells a recogniser that misheard from a judge that misjudged' }
        slot_value: { type: [string, 'null'], description: 'What the judge read as the value of the slot; null for a retelling, and when there was none' }
        reason_native: { type: [string, 'null'], description: 'One sentence in the learner''s language saying what was missing; null when accepted' }
        result: { type: [string, 'null'], enum: [passed, hinted, failed, skipped, null], description: '`passed`, or `hinted` when the frame was shown; null while no attempt has been accepted' }
        attempts: { type: integer, minimum: 0, description: 'Attempts at this card so far, this one counted' }
        card: { $ref: '#/components/schemas/PlanCard' }

    Problem:
      type: object
      description: >-
        RFC 7807 with a stable machine `code`. The plan's codes and their `meta` are listed in
        `docs/plan-api.md` («Коды 409»); one of them names a moment the client may retry at —
        `plan_conversation_replay_limit` (наряд BACK-TAILS-2 §7): `meta {day, replays_per_day,
        retry_after_utc}`, the last the learner's next midnight in UTC (`2026-09-22T21:00:00Z`).
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        meta: { type: object, additionalProperties: true }
      required: [title, status, code]

    PageMeta:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
      required: [has_more]

    PracticeTargetWord:
      type: object
      description: A word the learner should use during the dialog, and whether they have yet.
      properties:
        term_id: { type: string }
        text: { type: string }
        used: { type: boolean, description: "Monotonic — once used, stays used." }
      required: [term_id, text, used]

    StartedPracticeDialog:
      type: object
      description: The started dialog — the provider, ephemeral token, endpoint, model, and target words.
      properties:
        dialog_id: { type: string }
        provider: { type: string, enum: [openai, gemini], description: Which realtime provider to connect to. }
        endpoint: { type: string, description: "Connection endpoint (OpenAI: realtime base URL; Gemini: v1alpha BidiGenerateContentConstrained WS URL — append ?access_token=<realtime_token>)." }
        realtime_token: { type: string, description: "Ephemeral credential for the session (OpenAI client secret / Gemini auth token). Short-lived." }
        expires_at: { type: string, format: date-time, description: Absolute instant the token expires. }
        model: { type: string, description: Realtime model the session is bound to. }
        target_words:
          type: array
          items: { $ref: '#/components/schemas/PracticeTargetWord' }
        duration_seconds: { type: integer, description: Session length — the token TTL. }
        session_setup:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Gemini bare-token path: the pre-rendered BidiGenerateContentSetup (system instruction,
            model, transcription, VAD) the client applies verbatim as its first WebSocket message —
            it renders nothing itself. Null when the session is baked into the token (OpenAI).
      required: [dialog_id, provider, endpoint, realtime_token, expires_at, model, target_words, duration_seconds]

    Profile:
      type: object
      properties:
        native_language: { type: string, description: "A code of the server's language catalogue (see PUT /profile). Seeded on the first sign-in from Accept-Language when that names a plan native, else `ru` (наряд LANG-1 §7)." }
        target_language: { type: string }
        cefr_level: { type: string }
        daily_goal: { type: integer }
        tier: { type: string, enum: [free, premium], description: Subscription tier; drives the generation quota and premium-store access. }
        timezone: { type: string, description: "The user's IANA timezone; UTC until the client sends one. Drives calendar-day due rounding (F19)." }
        onboarded_at: { type: string, format: date-time, nullable: true, description: "Instant first-run onboarding finished, or null if never. The client's onboarding gate keys on this (server truth, survives reinstall)." }
        gender: { type: [string, 'null'], enum: [female, male, null], description: "The learner's gender when they said it (GEN-2a); null — not said." }

    StoreCollection:
      type: object
      description: A subscribable store collection (public or system) for a language pair.
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        topic: { type: string, nullable: true, description: Section key the client groups by. }
        source_lang: { type: string }
        target_lang: { type: string }
        is_premium: { type: boolean, description: Subscribing requires a premium tier; otherwise 403 subscription_required. }
        is_subscribed: { type: boolean, description: Whether the caller already has it in their library. }
        level: { type: string, nullable: true, description: 'CEFR range for the card, e.g. "A2–B1" or "B2" (min–max of the terms'' levels); null when none carry a level.' }
        items_count: { type: integer }
        image_url: { type: string, nullable: true }
        image_author: { type: string, nullable: true }
        image_author_url: { type: string, nullable: true }
        is_reference: { type: boolean, description: 'A phrasebook rather than a course - the studied language carries no trainers (zh, ja). Derived from the language, never stored; the same flag /sync carries for a collection already on the shelf.' }

    StoreCollectionPreview:
      type: object
      description: A free taster of a store collection — its first terms and the total item count.
      properties:
        collection_id: { type: string }
        total: { type: integer, description: Total number of terms in the collection. }
        terms:
          type: array
          description: Up to `limit` terms (default 5), in collection order.
          items:
            type: object
            properties:
              text: { type: string, description: The learned-language term. }
              translation: { type: string, nullable: true, description: Native-language translation (collection source_lang). }
              type: { type: string, description: word | phrase | idiom | phrasal_verb }
              cefr: { type: string, nullable: true, description: 'CEFR level, e.g. A2.' }

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        profile:
          oneOf:
            - { $ref: '#/components/schemas/Profile' }
            - { type: 'null' }
        qa_tools:
          type: boolean
          description: >-
            MAY THIS SESSION USE QA TOOLS — the same door the password-less dev sign-in stands
            behind (наряд SCENE-RUN, Ч.2.9). BOTH locks, answered here so the client never has to
            put them together: the account is marked `is_qa` AND the environment is not production
            with the opt-in flag on (`DevLoginGate`). Always `false` in production, whatever the
            database says. Today it gates one thing — substituting a transcript on a scene-run turn,
            which a simulator has no microphone to produce.
        generation:
          description: >
            The caller's generation allowance, so the client can grey the create button before
            submit instead of failing on a 429. `resets_at` is an absolute instant (next UTC-day
            boundary); render it in device-local time.
          type: object
          properties:
            limit: { type: integer }
            used: { type: integer }
            remaining: { type: integer }
            resets_at: { type: string, format: date-time }
        access:
          description: >-
            THE LEARNER'S ACCESS (наряд ACC-1 §2) — on `GET /auth/me`. `plan` — `premium` while a right to the paid plan
            is in force (status active or grace, no end or an end still ahead), else `free`; `expires_at` — until when
            (null: no end, or the free plan); `source` — by which right (`admin` — granted by the owner, `promo`, `apple`,
            `google`; null for the free plan). Told whether the paywall is switched on or not.
          type: object
          required: [plan, expires_at, source]
          properties:
            plan: { type: string, enum: [free, premium] }
            expires_at: { type: [string, 'null'], format: date-time }
            source: { type: [string, 'null'], enum: [admin, promo, apple, google, null] }

    GenerationRequest:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        prompt: { type: string }
        requested: { type: integer, description: Items the user asked for }
        delivered: { type: integer, nullable: true, description: Items actually produced; may be fewer than requested; null until succeeded }
        collection_id: { type: string, nullable: true }
        error: { type: string, nullable: true }
        model: { type: string, nullable: true }
        tokens_in: { type: integer, nullable: true }
        tokens_out: { type: integer, nullable: true }
        cost_usd: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    SearchHit:
      type: object
      description: One term the database already has, plus where it lives for THIS learner.
      properties:
        term_id: { type: string }
        text: { type: string }
        type: { type: string, enum: [word, phrase, idiom, phrasal_verb] }
        transcription: { type: string, nullable: true }
        translation: { type: string, nullable: true }
        description:
          type: string
          nullable: true
          description: >
            What the word means, written in the language BEING LEARNED. Null on the store
            catalogue — those terms have no description and are not being backfilled.
        example: { type: string, nullable: true }
        example_translation: { type: string, nullable: true }
        cefr: { type: string, nullable: true }
        folders:
          type: array
          description: The caller's OWN folders holding this term. Empty = not saved yet.
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              is_default: { type: boolean }

    LookupCard:
      type: object
      description: A word the model looked up. Not a term yet — nothing is written until `/search/add`.
      properties:
        lookup_id: { type: string, description: the handle `/search/add` takes }
        text: { type: string }
        type: { type: string, enum: [word, phrase] }
        transcription: { type: string, nullable: true }
        translation: { type: string, nullable: true }
        description:
          type: string
          description: >
            One or two A2–B1 sentences in the language being learned, never containing the word
            itself — a description that names its headword answers the `description_match` card
            before it is asked, and the barrier refuses one that does.
        example: { type: string, nullable: true, description: 'contains the term verbatim, or is absent' }
        example_translation: { type: string, nullable: true }
        cefr: { type: string, nullable: true }
        fresh: { type: boolean, description: true when THIS call paid for the answer }

    CollectionSummary:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        source: { type: string, enum: [curated, ai, user] }
        title: { type: string }
        description: { type: string, nullable: true }
        source_lang: { type: string }
        target_lang: { type: string }
        visibility: { type: string, enum: [private, link, public] }
        items_count: { type: integer }
        is_default:
          type: boolean
          description: >
            The owner's «Сохранённые» folder — where a one-tap save from search lands. Renameable
            (the flag is the destination, the title is only the label), never deletable.
        created_at: { type: string, format: date-time }

    CollectionItem:
      type: object
      description: A collection membership with its term content hydrated from Vocabulary.
      properties:
        term_id: { type: string }
        position: { type: integer }
        note: { type: string, nullable: true }
        text: { type: string, nullable: true }
        type: { type: string, enum: [word, phrase, idiom, phrasal_verb], nullable: true }
        transcription: { type: string, nullable: true }
        translation: { type: string, nullable: true }
        example: { type: string, nullable: true }
        example_translation: { type: string, nullable: true }

    Collection:
      allOf:
        - $ref: '#/components/schemas/CollectionSummary'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CollectionItem' }

    CollectionProgress:
      type: object
      description: >-
        Derived from (user, term) progress. mastered_count is the single "mastered" figure;
        confirmed + familiar + in_progress + new_count sum to terms_total.
      properties:
        collection_id: { type: string }
        terms_total: { type: integer }
        new_count: { type: integer, description: "Not started (no progress, or returned to new)" }
        due_count: { type: integer }
        mastered_count: { type: integer, description: confirmed + familiar }
        confirmed_count: { type: integer, description: "Proven by exercises (review, interval >= 21)" }
        familiar_count: { type: integer, description: Marked known (self-assessed) }
        in_progress_count: { type: integer, description: Started but not yet mastered }

    LanguageProgress:
      type: object
      description: >-
        The same counters as CollectionProgress, cut by the language the TERMS are written in rather
        than by the folder holding them (DECISIONS п. 139). A term is counted once, whatever its
        folders; reference languages (zh, ja) are not listed at all.
      properties:
        lang: { type: string, minLength: 2, maxLength: 2 }
        terms_total: { type: integer, description: Distinct terms in this language across the learner's collections }
        new_count: { type: integer, description: "Not started (no progress, or returned to new)" }
        due_count: { type: integer }
        mastered_count: { type: integer, description: confirmed + familiar }
        confirmed_count: { type: integer, description: "Proven by exercises (review, interval >= 21)" }
        familiar_count: { type: integer, description: Marked known (self-assessed) }
        in_progress_count: { type: integer, description: Started but not yet mastered }

    SpeechContract:
      type: object
      description: >-
        HOW SPOKEN ANSWERS ARE JUDGED — the thresholds and the abbreviation table, sent with every
        session (наряд SPEECH-2, Ч.3.3 / Ч.4.2). The client judges by THESE and keeps no numbers or
        dictionary of its own: two copies drift, and the first sign of a drift is «the phone said
        „не то“ over an answer the log counted correct» — the bug DAY-GATE-1 spent a night on.
      properties:
        thresholds:
          type: object
          properties:
            read_aloud_coverage:
              type: number
              description: 'a phrase the learner can SEE while saying it: the share of its words that must be heard'
            recall_rest_coverage:
              type: number
              description: >-
                no text on screen: with the key said, the share of the REST of the reply that must be
                heard with it. «Сказал проще» is about a phrase, not about one word.
            whole_line_coverage:
              type: number
              description: 'no text and no key: the reply, asked for entire (фикс DAY-GATE-1)'
            almost_floor:
              type: number
              description: 'below this share «почти — не хватило: …» becomes «не то»: a list holding the whole reply explains nothing'
            filler_allowance:
              type: integer
              description: 'how many eaten connectors are forgiven above the bar when reading from the screen. Articles are not counted at all and are not in this number.'
        normalization:
          type: object
          description: >-
            What a recogniser WRITES → what it actually was. «sequel» is SQL, «a p i» is API — the
            sound of a letter, not a mistake by the person. Versioned, so a disagreement between the
            phone and the server can start from «were they reading the same table».
          properties:
            version: { type: string }
            entries:
              type: object
              additionalProperties: { type: string }

    SessionCard:
      type: object
      properties:
        term_id: { type: string }
        exercise_mode: { type: string, enum: [multiple_choice, word_bank, typing, listening, cloze, scramble, dictation, pick_correct, speaking, description_match, intro] }
        type: { type: string, enum: [word, phrase, idiom, phrasal_verb], nullable: true }
        prompt: { type: string, nullable: true, description: "The cue, in the user's language — the term's translation, or for `scramble` the example sentence's translation. NULL for `dictation`: the task is the audio, and a written cue would turn it into a translation exercise. On ladder rung 1 the direction is REVERSED: the prompt is the TERM and the options are translations" }
        answer: { type: string, description: "What a correct answer must match. The target-language term, except for: the sentence modes (`scramble`, `dictation`), where this is the example sentence itself; and ladder rung 1, where the card is graded by identity and this is the card's own TERM ID. The client must not display it before the answer is committed. On `intro` it is the term, and it is never compared against anything" }
        ladder_step:
          type: integer
          minimum: 0
          maximum: 5
          nullable: true
          description: >
            The rung of the acquisition ladder this card was dealt at (0 intro, 1 recognition
            term→translation, 2 recognition translation→term, 3 assembly/choice, 4 typed
            production, 5 dictation). NULL for a `known` verification, which is outside the
            ladder. Echo it back with the answer: the pair's rung moves as that answer is folded,
            so it is the only thing that can still say what the card asked.
        option_ids:
          type: array
          nullable: true
          description: >
            Ladder rung 1 only, aligned index-for-index with `options`: the term each option's
            translation belongs to. That card is answered by TAPPING, and the client uploads the
            tapped id as `response` — which is why it is the one card whose correct option is a
            translation without any translation entering an answer key.
          items: { type: string }
        transcription: { type: string, nullable: true }
        transliteration:
          type: string
          nullable: true
          description: >
            ADDITIVE. How the term READS, spelled in the letters of the learner's own language
            («комо эстас»). Present on the `intro` card only — the one card that shows the word
            instead of asking for it — and null on every other mode, including when the term has no
            hint at all. Beside `transcription` and never instead of it: that one is IPA, one per
            term in a notation the learner has to have been taught; this one is per language pair,
            in an alphabet they already read.
        example: { type: string, nullable: true }
        example_translation: { type: string, nullable: true }
        options:
          type: array
          nullable: true
          description: multiple_choice — the answer plus distractors, shuffled
          items: { type: string }
        chips:
          type: array
          nullable: true
          description: "Tiles to assemble the answer from, shuffled (never in the answer's own order). word_bank — the term's words, or its letters when it is a single word; scramble — the example sentence's words (final `.`/`!`/`?` dropped, inner punctuation kept on its word)"
          items: { type: string }
        option_feedback:
          type: array
          nullable: true
          description: >
            `pick_correct` only. For each WRONG option: which fragment is broken and what it should
            have been. This is why the mode exists over `multiple_choice` — a wrong pick is explained
            (underline the span, show the correction) instead of merely marked. Rides with the card so
            the explanation works offline. The correct option never appears here.
          items:
            type: object
            properties:
              sentence: { type: string, description: 'the wrong option this feedback belongs to' }
              error_span: { type: string, description: 'the broken fragment, verbatim from `sentence`' }
              correction: { type: string }
        accepted_variants:
          type: array
          description: >
            Other answers that also count as correct for THIS card's `answer` (e.g. this/that,
            may/can). The client's instant check tests `{answer} ∪ accepted_variants` so it is never
            stricter than the server. Always an empty list on the sentence-graded modes
            (`scramble`, `dictation`): a variant of the term is not a variant of the sentence, and
            the server's expected set there is the sentence alone.
          items: { type: string }
        synonyms:
          type: array
          description: >
            ADDITIVE. Near-synonyms of the term that ALSO count as correct on THIS card — its own
            list, never merged into `accepted_variants`, because the two are accepted on different
            cards. Non-empty only where the card's prompt is the MEANING (the translation, or the
            description on `description_match`), which is exactly where the server accepts one; empty
            on `listening` and `cloze`, whose question is this word in particular, and empty on every
            sentence-graded mode. A client that tested `{answer} ∪ accepted_variants ∪ synonyms`
            unconditionally would be LOOSER than the server, which is the one direction the client
            check must never be wrong in.
          items: { type: string }

    TriageCard:
      type: object
      description: >-
        A minimal triage card. The triage screen only renders text + translation (and, for
        phrases, an example). `transcription` and `example`/`example_translation` are optional
        and may be absent; they are carried for FUTURE exercise modes — `transcription` as a
        typing hint, examples for cloze — not used by triage itself. Kept deliberately rather
        than trimmed, so those modes don't have to re-add them later.
      required: [term_id]
      properties:
        term_id: { type: string }
        text: { type: string, nullable: true }
        type: { type: string, enum: [word, phrase, idiom, phrasal_verb], nullable: true }
        transcription:
          type: string
          nullable: true
          description: IPA. Optional; unused by triage — reserved as a future `typing` hint.
        translation: { type: string, nullable: true }
        example:
          type: string
          nullable: true
          description: Optional; triage shows it only for phrases — reserved for `cloze` (phase 2).
        example_translation:
          type: string
          nullable: true
          description: Optional; pairs with `example`. Reserved for future exercise modes.

    HomePlan:
      type: object
      required: [state, session, in_work, edge, hardest, store]
      properties:
        state:
          type: string
          enum: [plan, done, idle, empty]
          description: >
            Which of the four home frames this is. `plan` — repeats are due (`session.repeat > 0`);
            `done` — none are, and something was answered today, so what is left is «сверх плана»;
            `idle` — none are and nothing was answered: the schedule is simply ahead. Untaught pool
            words and unsorted collection words are OFFERS in those two states («Взять новые слова»,
            «Разобрать ещё N»), never work the day claims. `empty` — the very first day: no
            collections, no pool, nothing answered. Named on the server so two screens cannot derive
            it two ways.
        session:
          type: object
          required: [repeat, new, triage, total, avg_seconds_per_card]
          properties:
            repeat:
              type: integer
              description: Due repeats the session would deal.
            new:
              type: integer
              description: First meetings it would introduce, under the day's remaining quota.
            triage:
              type: integer
              description: >
                Terms of the learner's collections with neither a verdict nor a progress row — the
                swipe pass, and deliberately NOT part of `total`. Those words are CATALOGUE: a
                collection is a catalogue of a topic and the pool is the queue, so adding a
                twenty-word set must not add twenty words to «сегодня». Offered once the repeats are
                done, priced by `triage_minutes`.
            total:
              type: integer
              description: repeat + new — the pool's work for today, in WORDS. See `triage` and `cards`.
            cards:
              type: integer
              description: >
                The same day in CARDS — what the session's own counter will count up to. Not
                proportional to `total`: a word met today brings its intro and both recognitions in
                one sitting, a graduated one brings a single card, so twenty words is anything from
                twenty to sixty. Counted from the same rungs the session builder reads, and from the
                same «is the intro trainer dealt» condition, so the promise and the session agree.
                The client shows both — «N слов · ~K карточек» — because a button that promises words
                while the session counts cards is a button that reads as broken halfway through.
            estimated_minutes:
              type: integer
              nullable: true
              description: >
                `cards` × `avg_seconds_per_card`, rounded to minutes, minimum 1. Null when there is
                nothing to do. The swipe pass is priced separately, in `triage_minutes`. It was
                `total` × the per-card figure until Ч.3 — two different units multiplied together,
                which under-sold every day with a new word in it.
            avg_seconds_per_card:
              type: integer
              description: >
                The learner's own pace on an EXERCISE — a winsorised (60 s ceiling) mean over their
                last 200 non-practice answers, clamped to 3..30 s. Falls back to a measured default
                (8 s) below 20 answers.
            triage_minutes:
              type: integer
              nullable: true
              description: >
                What the swipe pass would cost, in minutes; null when there is nothing to sort.
                Priced at the learner's own SWIPE rate (measured over `term_triages` the same way),
                which is a different act and measures like one — ≈3 s against ≈8–11 s — so a
                hundred-word pass reads as the five minutes it is rather than as twenty.
            triage_collection_id:
              type: string
              nullable: true
              description: The collection holding most of the swipes — where «Начать» leads. Null when `triage` is 0.
            triage_collection_title:
              type: string
              nullable: true
            chain_total:
              type: integer
              nullable: true
              description: >
                When the day's whole outstanding work is ONE word still climbing its chain, how many
                cards that chain holds in total — so the screen can say «1 слово · карточка 2 из 3»
                (position = `chain_total - cards + 1`, since `cards` is what is LEFT). Null
                otherwise, including for a lone graduated repeat, whose chain is one card and whose
                progress is nothing to report.
        in_work:
          type: object
          required: [total, waiting, per_day, new_remaining]
          properties:
            total:
              type: integer
              description: Pool size — every word taken into study.
            waiting:
              type: integer
              description: Of those, the ones never shown, waiting for a day's quota.
            per_day:
              type: integer
              description: The daily new-term quota, as the session builder applies it.
            new_remaining:
              type: integer
              description: >
                Today's leftover quota. The same figure as `/stats.new_remaining` and from the same
                source — repeated here so the whole home screen reads from one payload.
            days_until_queue:
              type: integer
              nullable: true
              description: >
                Days until the last waiting word gets its first card (today's leftover quota first,
                then whole days of `per_day`). Null when nothing waits, and null when `per_day` is 0.
        edge:
          type: array
          description: >
            «На грани забывания» — up to 3 pool words falling due within the next 3 calendar days,
            soonest first. Empty when none are near; words due TODAY are not here, they are in the
            session.
          items:
            type: object
            required: [term_id, text, due_on, in_days]
            properties:
              term_id:
                type: string
              text:
                type: string
              translation:
                type: string
                nullable: true
              due_on:
                type: string
                format: date
                description: In the learner's own timezone.
              in_days:
                type: integer
                minimum: 1
                description: 1 = «выпадет завтра».
        today:
          type: object
          nullable: true
          description: >
            What today produced. STUDY answers only — practice is activity and keeps the streak, but
            it is not the day's plan. Null when nothing was answered today.
          required: [answered, seconds]
          properties:
            answered:
              type: integer
              description: >
                Answers, which is CARDS: a word answered at three rungs today counts three times.
            words:
              type: integer
              description: >
                DISTINCT words behind those answers — the day's headline unit. The evening said
                «52 из 52» off `answered` alone, which is a count of cards wearing the shape of a
                count of words. Words lead and cards follow: «14 из 14 слов · 52 карточки · 2 мин».
            seconds:
              type: integer
              description: Sum of the answers' own latencies.
        next_review:
          type: object
          nullable: true
          description: The next scheduled day and how much lands on it. Null when nothing is scheduled ahead.
          required: [date, count]
          properties:
            date:
              type: string
              format: date
            count:
              type: integer
        hardest:
          type: array
          description: >
            «Далось труднее всего» — the terms most often answered wrong in TODAY's study answers,
            worst first. The day, not the last session: an ordinary evening is a real run plus a
            two-card mop-up, and the last-session rule emptied this block exactly on the days that
            had something to say. Empty when the day had no mistakes.
          items:
            type: object
            required: [term_id, text, errors]
            properties:
              term_id:
                type: string
              text:
                type: string
              translation:
                type: string
                nullable: true
              errors:
                type: integer
        continue:
          type: object
          nullable: true
          description: >
            One collection the learner started and left — «продолжить», and in the evening
            «можно добить N слов сверх плана». Null when there is none: a set nobody has opened is
            new, not abandoned.
          required: [collection_id, title, done, total, remaining]
          properties:
            collection_id:
              type: string
            title:
              type: string
            done:
              type: integer
              description: Terms carrying a verdict or a progress row.
            total:
              type: integer
            remaining:
              type: integer
            abandoned_days:
              type: integer
              nullable: true
              description: Whole days since the last swipe or answer in it.
        store:
          type: object
          required: [count, topics, items]
          properties:
            count:
              type: integer
              description: Ready-made sets of the learner's pair they are NOT subscribed to — «взять из 17 готовых».
            topics:
              type: array
              items:
                type: string
              description: >
                Up to 3 of the same titles, in the store's own order. The older, titles-only shape of
                the preview, kept for builds that predate `items` — derived from `items` server-side,
                so the two cannot come to name different decks.
            items:
              type: array
              description: >
                THE SHOP WINDOW (кадры 19-2, 19-3): up to 6 takeable decks with their covers, in the
                store's own order, so the strip on the home screen shows what the learner would meet
                first if they followed the link. Empty when the store is empty.
              items:
                type: object
                required: [id, title, terms_count]
                properties:
                  id:
                    type: string
                    description: Where a tap on the cover leads — the deck's preview.
                  title:
                    type: string
                  terms_count:
                    type: integer
                  image_url:
                    type: string
                    nullable: true
                    description: The deck's cover. Null when it has none — the strip draws paper, not a broken image.
                  level:
                    type: string
                    nullable: true
                    description: >
                      CEFR of the deck, derived from its terms — a single level («A2») or a range
                      («A2–B1»). Null when no term carries one, and the card then prints nothing
                      rather than «—».
                  description:
                    type: string
                    nullable: true
                  source_lang:
                    type: string
                  target_lang:
                    type: string
                  is_premium:
                    type: boolean
                  is_reference:
                    type: boolean
                    description: >
                      A phrasebook, not a course — derived from `target_lang` (DECISIONS пп. 84, 136).

                      These four ride along for the PREVIEW a tapped cover opens: the client builds
                      the store's own sheet from this row, and a sheet whose premium flag or pair was
                      guessed on the device lies until the subscribe button 403s. `is_subscribed` is
                      deliberately absent — this list is by definition the decks the learner has not
                      taken.
        edge_tomorrow:
          type: integer
          nullable: true
          description: >
            How many of the learner's own words fall due TOMORROW — «Завтра выпадет 14 слов →»
            (кадры 19-1, 19-2). Null, never 0: the row is a block the design does not draw on a day
            with nothing behind it. Narrower than `next_review`, which answers «the next day that has
            anything» and may be a week out; the pool only, exactly as `edge` counts it.
        day_award:
          type: object
          nullable: true
          description: >
            THE DAY'S REWARD (кадр 19-2) — «+5 слов продвинулись · reluctant дошло до „написание"».
            The evening's one piece of news that is not a counter: what the work BOUGHT.

            Derived from the append-only review log with no new column: the rung a pair stands on now
            against the `ladder_step` its FIRST card today was dealt at. Study answers only — free
            practice moves no rung, so it can produce no promotion. Null when the day promoted
            nothing; `promoted: 0` is not a state this block has.
          required: [promoted, term_id, text, step]
          properties:
            promoted:
              type: integer
              minimum: 1
              description: How many words rose at least one rung today.
            term_id:
              type: string
            text:
              type: string
              description: The example — the word that got FURTHEST today, ties broken by id so a refresh names the same one.
            step:
              type: integer
              minimum: 0
              maximum: 5
              description: >
                The rung that example now stands on. A NUMBER: the client names it from the same
                `ladderStep*` strings the word card uses, in the client's own language.
        learned_week:
          type: integer
          nullable: true
          description: >
            Words that reached «выучено» — graduated off the recognition rungs — in the last seven
            calendar days. The middle number of the statistics tile («Выучено 151 · за неделю 28 · в
            работе 41»); the other two are `/stats.learned` and `in_work.total`. Counted from the
            review log rather than a `graduated_at` column, which does not exist: a pair's graduation
            day is the day of its first card above the recognition rungs. Null when none graduated.

    Stats:
      type: object
      properties:
        total_terms: { type: integer }
        learned: { type: integer }
        mastered: { type: integer }
        due_today: { type: integer }
        reviews_today: { type: integer }
        streak_days: { type: integer }
        active_days:
          type: array
          items: { type: string, format: date }
          description: >
            Local (user-timezone) calendar dates with ≥1 review of ANY kind — study OR practice —
            within the last ~year, oldest first. The server-truth source for the activity calendar
            and the streak (device-batch F18): the client renders these and lights today
            optimistically, and a relogin/reinstall restores the full calendar from here.
        new_goal:
          type: integer
          description: The user's daily NEW-term quota (clamped), as the session builder applies it.
        new_today:
          type: integer
          description: New terms already introduced today, on the accounting the quota uses.
        new_remaining:
          type: integer
          description: >
            max(0, new_goal - new_today) — how many new terms a "Learn N" home CTA may still
            introduce today (device-batch F13). 0 means the new-term limit is reached; reviews are
            never gated by this (they don't spend the new quota).

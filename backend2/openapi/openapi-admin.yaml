openapi: 3.1.0
info:
  title: WordTrainer Admin API
  version: 0.1.0
  description: >
    Back-office admin API. Base path `/admin/api`, Sanctum bearer tokens minted against the
    `admins` table (a guard separate from the app's users — an app-user token never authenticates
    here). JSON, snake_case. This file is the SEPARATE admin contract; the app contract is
    `openapi.yaml` and is not touched here. The admin panel (Vue) is generated from this file, so an
    endpoint not described here effectively does not exist. Errors are RFC 7807
    `application/problem+json` with a stable machine `code`, except input validation which uses
    Laravel's 422 `{message, errors}` shape.

    Listings page in either of two modes and always wrap results as
    `{ data: [...], meta: { total, page, per_page, next_cursor } }`:
      * KEYSET (what the panel's infinite scroll uses) — send `limit`, then follow
        `meta.next_cursor` back as `cursor`. Rows come back ordered by id DESC, which for ULIDs is
        newest-first on a strictly unique key, so a scroll cannot skip or repeat a row while new
        rows are landing. `next_cursor` null = last page.
      * OFFSET (the original) — `page` / `per_page`, default 25, max 100. `next_cursor` stays null.
    Sending neither keeps the offset behaviour, so nothing that already calls these breaks.

servers:
  - url: http://localhost:8001/admin/api
    description: Local (docker)

security:
  - adminBearer: []

tags:
  - name: Auth
  - name: Dashboard
  - name: Users
  - name: Ladder
  - name: Exercise modes
  - name: Collections
  - name: Terms
  - name: Content health
  - name: Playground
  - name: Logs
  - name: Costs
  - name: Curation
  - name: Practice
  - name: Generation
  - name: Plan page
    description: >
      The learner's plan page (наряд ADM-1). Read-only — no route here writes, buys or queues. The plan is
      named by its code (characters 5–10 of its ULID, upper-case Crockford — `NKKGFF`) or its full id; a
      code two plans share is 409. Every section takes `day` and narrows to that day. The page is put
      together by the Plan module (`PlanInspection`); what the database does not hold is null / listed
      under `not_stored`, never estimated.

paths:
  /login:
    post:
      tags: [Auth]
      summary: Sign in as an admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [token, admin]
                properties:
                  token: { type: string }
                  admin: { $ref: '#/components/schemas/Admin' }
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me:
    get:
      tags: [Auth]
      summary: The current admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Problem' }

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current admin token
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Fleet totals and AI-spend windows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - { name: search, in: query, schema: { type: string }, description: substring match on email }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/UserRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /users/{id}:
    get:
      tags: [Users]
      summary: User detail
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/{id}/plan:
    get:
      tags: [Users]
      summary: Day-plan simulator (dry run — writes nothing)
      description: >
        Simulates the user's study day on `date` (their timezone; default today). Reuses the real
        scheduler (GetDueTerms) and ExerciseSelector with no persistence: which terms are due, how
        many new ones the quota would introduce, and which trainer each arrives as.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: date, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: 'target calendar date (YYYY-MM-DD)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayPlan' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/collections:
    get:
      tags: [Users]
      summary: A user's collections with per-collection progress
      description: >
        The user's library (owned + added collections) with progress counters per collection
        (Mastery-defined «усвоено», from the Learning module). Not paginated — returned as `{data:[…]}`.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserCollectionWithProgress' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/{id}/reviews:
    get:
      tags: [Users]
      summary: A user's review feed
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: from, in: query, schema: { type: string }, description: 'ISO lower bound on answered_at' }
        - { name: to, in: query, schema: { type: string }, description: 'ISO upper bound on answered_at' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Review' } }
        '401': { $ref: '#/components/responses/Problem' }

  /ladder/learners:
    get:
      tags: [Ladder]
      summary: Who to watch on the acquisition-ladder screen
      description: >
        The learner selector, most recently active first. "Active" is the later of the last answered
        review and the last intro shown — a learner who has only been introduced to new words has
        still been using the app.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LadderLearner' } }
        '401': { $ref: '#/components/responses/Problem' }

  /users/{id}/ladder:
    get:
      tags: [Ladder]
      summary: Where every one of a learner's words stands on the ladder
      description: >
        Read-only observation, polled by the panel every few seconds while a device is being used.
        `ladder_step` is DERIVED by the Learning module's own LearningLadder from the stored
        `acquisition` / `learning_step` / `reps`, never re-expressed here; null means the pair is
        outside the ladder (a triage «знаю») and must not be read as rung 0.
        The `counts` block follows the `collection_id` filter but NOT `phase` / `due`, so the split
        above the table stays whole while the table itself is narrowed. It travels with the page so
        a polled screen never shows a header and a table from two different moments.
        Offset paging only: rows are ordered by last answer (most recent first), which is not a
        unique key, so the id-keyset walk the other listings use does not apply.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: collection_id, in: query, schema: { type: string }, description: only terms in this collection }
        - { name: phase, in: query, schema: { type: string, enum: [new, learning, graduated, known] } }
        - { name: due, in: query, schema: { type: boolean }, description: only pairs scheduled and ripe now }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [counts]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LadderPair' } }
                      counts: { $ref: '#/components/schemas/LadderCounts' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users/{id}/ladder/events:
    get:
      tags: [Ladder]
      summary: A learner's answers and intros as one live feed
      description: >
        The append-only review log and the intro log merged, newest first — what a session looks
        like from outside. Ordered by TIME, which is the only thing the two logs share; nothing is
        derived from that order, and `client_seq` (the real ordering truth for reviews) is carried
        on every answer so a feed and a verdict can be reconciled.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LadderEvent' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/{id}/tier:
    post:
      tags: [Users]
      summary: Set a user's subscription tier (audited)
      description: The one v1 admin mutation. Reuses Identity's tier writer and appends an admin_audit_log row.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [free, premium] }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  tier: { type: string, enum: [free, premium] }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exercise-modes:
    get:
      tags: [Exercise modes]
      summary: The product default, and every mode this build can deal
      description: >
        `available` comes from the application's own enum, so a newly built trainer appears here the
        moment it exists in code — switched off, per the release rule (new mode ships disabled
        globally; enable for yourself → beta → everyone).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Exercise modes]
      summary: Set the product default (audited)
      description: >
        The ORDER is part of the contract — free practice round-robins by index into this list, on
        the server and mirrored on the device. At least one mode is required: the global default has
        nothing above it to inherit from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modes]
              properties:
                modes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ExerciseMode' }
      responses:
        '200':
          description: Applied — returns the new settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exercise-modes/admission:
    put:
      tags: [Exercise modes]
      summary: Move one trainer's place on the acquisition ladder, product-wide (audited)
      description: >
        The admission matrix says which rung of the acquisition ladder opens which trainer — a
        second dimension, orthogonal to the SRS scheduler, which never sees it. It is data rather
        than config because what a mode asks of the learner is a product judgement that should move
        with evidence and one admin action.


        ONE mode per call: a whole-matrix write would silently revert a threshold someone else had
        just moved. This is also deliberately NOT the same call as the on/off toggle — moving a rung
        must not switch a trainer on for someone who was not being dealt it.


        Its own screen is a separate task; this exists so the matrix is inspectable and movable from
        the moment it starts deciding what learners are dealt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeAdmissionRule' }
      responses:
        '200':
          description: Applied — returns the new settings, matrix included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/exercise-modes/admission:
    put:
      tags: [Exercise modes]
      summary: The same, for one user — their per-mode override (audited)
      description: >
        The override is PER MODE: giving a user typing early leaves every other threshold — and the
        user's on/off set — inheriting the product default, including later changes to it.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeAdmissionRule' }
      responses:
        '200':
          description: Applied — returns the new settings, matrix included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/exercise-modes:
    get:
      tags: [Exercise modes]
      summary: What one user trains with
      description: >
        `override` is null when the user inherits the product default — a different state from an
        override that happens to equal it, and what the panel's Inherit/Custom switch is bound to.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Exercise modes]
      summary: Give a user their own set, or drop the override (audited)
      description: >
        `modes: null` (or an empty array) DELETES the override, putting the user back on the product
        default — including later changes to it. The user's set is never stored as a copy of the
        default, or they would silently miss the next mode that ships.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modes]
              properties:
                modes:
                  type: array
                  nullable: true
                  items: { $ref: '#/components/schemas/ExerciseMode' }
      responses:
        '200':
          description: Applied — returns the new settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /mode-settings:
    get:
      tags: [Exercise modes]
      summary: The «Матрица режимов» screen — every product-default row
      description: >
        One row per trainer: on/off, rotation position AND the acquisition-ladder threshold
        together — the full stored `learning_mode_settings` row, unlike `/exercise-modes` and
        `/exercise-modes/admission`, which edit the toggles and the threshold as two separate
        writes. Every row's `source` is `global` here — there is nothing to inherit from at this
        scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Exercise modes]
      summary: Save one product-default row (audited)
      description: >
        ONE (scope, mode) row per call — the same reason as `/exercise-modes/admission`: a
        whole-matrix write would silently revert a cell someone else had just moved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeSettingsRow' }
      responses:
        '200':
          description: Applied — returns the new matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/mode-settings:
    get:
      tags: [Exercise modes]
      summary: This user's matrix — global rows overlaid by their own overrides
      description: >
        Every mode is present, whichever scope it comes from — `source` says which: `override`
        for a row this user owns directly, `global` for one they inherit.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Exercise modes]
      summary: Save one row of this user's override (audited)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeSettingsRow' }
      responses:
        '200':
          description: Applied — returns the user's new matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/mode-settings/{mode}:
    delete:
      tags: [Exercise modes]
      summary: Reset one override cell back to the product default (audited)
      description: >
        Deletes this user's row for this one mode, so it inherits the global row again — the
        row's «Сбросить» button. Unlike `PUT /users/{id}/exercise-modes` with a cleared set, this
        touches a single cell, not the whole override.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: mode
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ExerciseMode' }
      responses:
        '200':
          description: Reset — returns the user's new matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collections:
    get:
      tags: [Collections]
      summary: List collections
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [system, shared, custom] } }
        - { name: search, in: query, schema: { type: string }, description: substring match on title }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CollectionRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /collections/{id}:
    get:
      tags: [Collections]
      summary: Collection detail with terms
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Curation]
      summary: Edit a collection's title/description
      description: >
        Works on store collections too — curating them is the job, and the user-facing edit command
        next door refuses because it asks "is the actor the owner", which a store deck has none of.
        Changes reach every owner and subscriber through the next `/sync` delta.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Curation]
      summary: Delete a collection for EVERY owner and subscriber
      description: >
        Soft-deletes the collection and ends every subscription. Both halves matter: an owner learns
        from the collection's own tombstone, a subscriber from theirs, and a subscription row that
        was deleted outright would produce no delta at all — the deck would linger on their phone.
        `confirm_title` must equal the collection's title; the check is enforced here, not only in
        the dialog.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_title]
              properties:
                confirm_title: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /collections/{id}/impact:
    get:
      tags: [Curation]
      summary: What deleting or editing this collection would touch
      description: Read before the confirm dialog is drawn, so the operator sees the blast radius.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /collections/{id}/terms:
    post:
      tags: [Curation]
      summary: Add an existing term to a collection
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term_id]
              properties:
                term_id: { type: string }
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collections/{id}/terms/{termId}:
    delete:
      tags: [Curation]
      summary: Remove a term from THIS collection (the term stays in the dictionary)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: termId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /collections/{id}/costs:
    get:
      tags: [Costs]
      summary: What one collection has cost, split by purpose
      description: >
        The spend LEDGERS are the money (generation_requests, practice_dialogs, term_enrichments,
        example_regenerations) — they hold the whole history and the request log can be pruned. Only
        `images` and `recap`, which have no ledger of their own, are priced from the log.
        Caveats that a bare number would hide are returned in `note`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostByPurpose' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /costs:
    get:
      tags: [Costs]
      summary: Fleet spend by purpose over a window
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, all], default: week }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostByPurpose' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /content-health/summary:
    get:
      tags: [Content health]
      summary: Coverage of the dictionary — what the content can actually build
      description: >
        READ-ONLY, and deliberately without a sibling that STARTS the enrichment run: the догон
        spends money against a model, so the panel hands over a command to paste rather than a
        button to click.

        Not to be confused with `/users/{id}/ladder`. That answers WHEN a trainer opens for a
        learner (progress + the admission matrix). This answers whether a card can be built from a
        term's content AT ALL — a different question with a different cure.

        The three scopes are NOT a partition and are not meant to add up: a term held by a store
        collection AND by someone's own list counts in both, and a term in no collection appears
        only in `all`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentHealthSummary' }
        '401': { $ref: '#/components/responses/Problem' }

  /content-health/collections/{id}:
    get:
      tags: [Content health]
      summary: One collection's terms, most under-stocked first
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionContentHealth' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /content-health/terms/{id}:
    get:
      tags: [Content health]
      summary: One term's content passport, with a per-trainer simulation
      description: >
        What this term HOLDS (translations, the pinned example, live distractors, accepted variants,
        the enrichment marks and findings) and what each of the ten trainers could build from it.

        Answers «что позволяет контент термина» and deliberately not «когда тренажёр откроется
        ученику» — the second is the ladder's question and has its own screen. A green line here does
        not mean the learner will see that card.

        Two lists of wrong sentences, never merged: `distractors` are live rows (each flagged
        `usable` — a card deals one per `error_span`), `suppressed` are sentences a proofreader or
        the audit removed, which outlive the rows and even the example they hung off.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermContentPassport' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /terms:
    get:
      tags: [Terms]
      summary: List terms
      parameters:
        - { name: search, in: query, schema: { type: string }, description: substring match on text / normalized_text }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TermRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /terms/{id}:
    get:
      tags: [Terms]
      summary: Term detail (translations, examples, collections, progress footprint)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Curation]
      summary: Edit a term's content
      description: >
        Terms are GLOBAL and deduplicated: this edit is felt by every collection holding the term
        and every learner studying it. That is the point (one fix lands everywhere) and the danger —
        read `/terms/{id}/impact` first and say so in the dialog.

        Editing the EXAMPLE additionally drops that example's distractors and unmarks the term for
        the enrichment run, because everything derived from the old sentence describes text that no
        longer exists. At least one editable field is required.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 200 }
                translation: { type: string, maxLength: 200 }
                ipa: { type: [string, 'null'], maxLength: 200 }
                example_id: { type: string, description: required together with example_sentence }
                example_sentence: { type: string, maxLength: 500 }
                example_translation: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The updated term
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Curation]
      summary: Retire a term from the dictionary
      description: >
        Soft-deletes the term, removes it from every collection and deletes the (user, term)
        progress rows. The append-only review log is NOT touched — it is history, and history does
        not change because a term was retired. Clients receive a term tombstone in the next delta.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  retired: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /terms/{id}/impact:
    get:
      tags: [Curation]
      summary: What editing or retiring this term would touch
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /logs:
    get:
      tags: [Logs]
      summary: API request/response log, filtered
      description: >
        Every filter is a query parameter, so the panel keeps its filter state in the URL and a
        shared link reproduces the exact same slice. Rows carry `model`/`tokens_*`/`cost_usd`
        DERIVED from the stored bodies (the usage block is already there), priced with the same
        table Generation uses for its spend ledgers. Bodies themselves are NOT in the list — a page
        of 50 model round-trips is megabytes; fetch `/logs/{id}` for the row the operator expanded.
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [inbound, outbound] } }
        - { name: provider, in: query, schema: { type: string }, description: 'the `service` tag, e.g. openai' }
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/CallPurpose' } }
        - { name: status, in: query, schema: { type: integer, minimum: 100, maximum: 599 } }
        - name: status_class
          in: query
          description: Coarser than `status`; `error` means the call never returned a status at all.
          schema: { type: string, enum: ['2xx', '4xx', '5xx', error] }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: collection_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: path, in: query, schema: { type: string }, description: substring match on path }
        - { name: search, in: query, schema: { type: string }, description: substring match inside request/response bodies }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/RequestLog' } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /logs/{id}:
    get:
      tags: [Logs]
      summary: One log row with its full payloads
      description: >
        Bodies and headers are redacted on WRITE — the log table never holds a credential — so this
        returns exactly what is stored.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestLogDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /request-logs:
    get:
      tags: [Logs]
      summary: Deprecated alias of /logs
      deprecated: true
      description: The original path, kept so nothing that already calls it breaks. Same controller.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/RequestLog' } }
        '401': { $ref: '#/components/responses/Problem' }

  /playground/providers:
    get:
      tags: [Playground]
      summary: Which providers and models the sandbox offers
      description: >
        Config-driven, not a table. A provider with no key is listed as `available: false` with the
        env var named in `reason` — the picker greys it and repeats the sentence, so «почему нельзя
        выбрать» is answered on the screen.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PlaygroundProvider' }
        '401': { $ref: '#/components/responses/Problem' }

  /playground/generate:
    post:
      tags: [Playground]
      summary: Start a run — one prompt to one model, verbatim
      description: >
        The prompt goes AS WRITTEN — no system message, no template, no JSON schema. That is the
        point of the sandbox: anything this endpoint added would be measured as the model's
        behaviour.

        The call is made by a queued job, never inside this request (GEN-3): a prompt the size of a lesson takes a
        strong model 30–51 s, and the synchronous sandbox cut such a call off at 60 s after the vendor had billed it.
        This answers 202 with the run's id; the screen polls `GET /playground/runs/{id}`. The model's answer is waited
        for 180 s; a call that got no answer is not repeated and stays in the journal of model calls as `lost`.
        Writes nothing of the catalogue: the run waits in the cache for a day, its spend is in the journal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, model, prompt]
              properties:
                provider: { type: string, description: wire name from /playground/providers }
                model: { type: string, description: must be one the registry offers for that provider }
                prompt: { type: string, maxLength: 65000 }
                temperature:
                  type: [number, 'null']
                  minimum: 0
                  maximum: 2
                  description: >
                    Omitted from the vendor request entirely when absent — several current models
                    accept only their default and refuse the parameter.
      responses:
        '202':
          description: The run is queued
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, minLength: 26, maxLength: 26 }
                  status: { type: string, enum: [queued] }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /playground/runs/{id}:
    get:
      tags: [Playground]
      summary: A sandbox run as it stands
      description: >
        `queued` — the job has not picked the run up; `running` — the call is out; `done` — `result` holds what came back.
        A vendor failure is an ANSWER, not a 500: expired keys, exhausted credits, stale model names and timeouts come
        back as a `done` run with `result.error` set. `error` (nothing came back) and `parse_error` (something came back,
        just not JSON) are different fields on purpose. 404 for an id nobody started, or a run older than a day.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The run
          content:
            application/json:
              schema:
                type: object
                required: [id, status, result]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [queued, running, done] }
                  result:
                    oneOf:
                      - $ref: '#/components/schemas/PlaygroundResult'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { description: No such run }

  /playground/validate:
    post:
      tags: [Playground]
      summary: Dry-run distractor rows past the REAL enrichment validator
      description: >
        The verdicts come from the same `EnrichmentValidator` the станок runs, on a reference built
        the same way — so a row that survives here survives there. Nothing is written: no
        distractors, no suppressions, no version marks (`persisted` is always false).

        The reference is a term (`term_id`) or a hand-typed pair (`manual`); the term wins when both
        arrive, because a real term brings the real dedup set and the real suppressions with it. The
        manual path is narrower by design — sibling terms are not consulted — and `matched_term_id`
        says which term, if any, its dedup set came from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [sentence, error_span, correction]
                    properties:
                      sentence: { type: string }
                      error_span: { type: string }
                      correction: { type: string }
                      error_type:
                        type: [string, 'null']
                        description: >
                          Optional. When absent a valid type is substituted so the other checks still
                          get to speak, and the row comes back with `error_type_defaulted: true`.
                term_id: { type: [string, 'null'] }
                manual:
                  type: object
                  properties:
                    term_text: { type: [string, 'null'] }
                    example_text: { type: [string, 'null'] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaygroundValidation' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }


openapi: 3.1.0
info:
  title: WordTrainer Admin API
  version: 0.1.0
  description: >
    Back-office admin API. Base path `/admin/api`, Sanctum bearer tokens minted against the
    `admins` table (a guard separate from the app's users — an app-user token never authenticates
    here). JSON, snake_case. This file is the SEPARATE admin contract; the app contract is
    `openapi.yaml` and is not touched here. The admin panel (Vue) is generated from this file, so an
    endpoint not described here effectively does not exist. Errors are RFC 7807
    `application/problem+json` with a stable machine `code`, except input validation which uses
    Laravel's 422 `{message, errors}` shape.

    Listings page in either of two modes and always wrap results as
    `{ data: [...], meta: { total, page, per_page, next_cursor } }`:
      * KEYSET (what the panel's infinite scroll uses) — send `limit`, then follow
        `meta.next_cursor` back as `cursor`. Rows come back ordered by id DESC, which for ULIDs is
        newest-first on a strictly unique key, so a scroll cannot skip or repeat a row while new
        rows are landing. `next_cursor` null = last page.
      * OFFSET (the original) — `page` / `per_page`, default 25, max 100. `next_cursor` stays null.
    Sending neither keeps the offset behaviour, so nothing that already calls these breaks.

servers:
  - url: http://localhost:8001/admin/api
    description: Local (docker)

security:
  - adminBearer: []

tags:
  - name: Auth
  - name: Dashboard
  - name: Users
  - name: Ladder
  - name: Exercise modes
  - name: Collections
  - name: Terms
  - name: Logs
  - name: Costs
  - name: Curation
  - name: Practice
  - name: Generation

paths:
  /login:
    post:
      tags: [Auth]
      summary: Sign in as an admin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [token, admin]
                properties:
                  token: { type: string }
                  admin: { $ref: '#/components/schemas/Admin' }
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me:
    get:
      tags: [Auth]
      summary: The current admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Admin' }
        '401': { $ref: '#/components/responses/Problem' }

  /logout:
    post:
      tags: [Auth]
      summary: Revoke the current admin token
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Problem' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Fleet totals and AI-spend windows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [Users]
      summary: List users
      parameters:
        - { name: search, in: query, schema: { type: string }, description: substring match on email }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/UserRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /users/{id}:
    get:
      tags: [Users]
      summary: User detail
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/{id}/plan:
    get:
      tags: [Users]
      summary: Day-plan simulator (dry run — writes nothing)
      description: >
        Simulates the user's study day on `date` (their timezone; default today). Reuses the real
        scheduler (GetDueTerms) and ExerciseSelector with no persistence: which terms are due, how
        many new ones the quota would introduce, and which trainer each arrives as.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: date, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }, description: 'target calendar date (YYYY-MM-DD)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DayPlan' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/collections:
    get:
      tags: [Users]
      summary: A user's collections with per-collection progress
      description: >
        The user's library (owned + added collections) with progress counters per collection
        (Mastery-defined «усвоено», from the Learning module). Not paginated — returned as `{data:[…]}`.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserCollectionWithProgress' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/{id}/reviews:
    get:
      tags: [Users]
      summary: A user's review feed
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: from, in: query, schema: { type: string }, description: 'ISO lower bound on answered_at' }
        - { name: to, in: query, schema: { type: string }, description: 'ISO upper bound on answered_at' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Review' } }
        '401': { $ref: '#/components/responses/Problem' }

  /ladder/learners:
    get:
      tags: [Ladder]
      summary: Who to watch on the acquisition-ladder screen
      description: >
        The learner selector, most recently active first. "Active" is the later of the last answered
        review and the last intro shown — a learner who has only been introduced to new words has
        still been using the app.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LadderLearner' } }
        '401': { $ref: '#/components/responses/Problem' }

  /users/{id}/ladder:
    get:
      tags: [Ladder]
      summary: Where every one of a learner's words stands on the ladder
      description: >
        Read-only observation, polled by the panel every few seconds while a device is being used.
        `ladder_step` is DERIVED by the Learning module's own LearningLadder from the stored
        `acquisition` / `learning_step` / `reps`, never re-expressed here; null means the pair is
        outside the ladder (a triage «знаю») and must not be read as rung 0.
        The `counts` block follows the `collection_id` filter but NOT `phase` / `due`, so the split
        above the table stays whole while the table itself is narrowed. It travels with the page so
        a polled screen never shows a header and a table from two different moments.
        Offset paging only: rows are ordered by last answer (most recent first), which is not a
        unique key, so the id-keyset walk the other listings use does not apply.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: collection_id, in: query, schema: { type: string }, description: only terms in this collection }
        - { name: phase, in: query, schema: { type: string, enum: [new, learning, graduated, known] } }
        - { name: due, in: query, schema: { type: boolean }, description: only pairs scheduled and ripe now }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [counts]
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/LadderPair' } }
                      counts: { $ref: '#/components/schemas/LadderCounts' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users/{id}/ladder/events:
    get:
      tags: [Ladder]
      summary: A learner's answers and intros as one live feed
      description: >
        The append-only review log and the intro log merged, newest first — what a session looks
        like from outside. Ordered by TIME, which is the only thing the two logs share; nothing is
        derived from that order, and `client_seq` (the real ordering truth for reviews) is carried
        on every answer so a feed and a verdict can be reconciled.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LadderEvent' } }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /users/{id}/tier:
    post:
      tags: [Users]
      summary: Set a user's subscription tier (audited)
      description: The one v1 admin mutation. Reuses Identity's tier writer and appends an admin_audit_log row.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [free, premium] }
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  tier: { type: string, enum: [free, premium] }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exercise-modes:
    get:
      tags: [Exercise modes]
      summary: The product default, and every mode this build can deal
      description: >
        `available` comes from the application's own enum, so a newly built trainer appears here the
        moment it exists in code — switched off, per the release rule (new mode ships disabled
        globally; enable for yourself → beta → everyone).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Exercise modes]
      summary: Set the product default (audited)
      description: >
        The ORDER is part of the contract — free practice round-robins by index into this list, on
        the server and mirrored on the device. At least one mode is required: the global default has
        nothing above it to inherit from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modes]
              properties:
                modes:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ExerciseMode' }
      responses:
        '200':
          description: Applied — returns the new settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /exercise-modes/admission:
    put:
      tags: [Exercise modes]
      summary: Move one trainer's place on the acquisition ladder, product-wide (audited)
      description: >
        The admission matrix says which rung of the acquisition ladder opens which trainer — a
        second dimension, orthogonal to the SRS scheduler, which never sees it. It is data rather
        than config because what a mode asks of the learner is a product judgement that should move
        with evidence and one admin action.


        ONE mode per call: a whole-matrix write would silently revert a threshold someone else had
        just moved. This is also deliberately NOT the same call as the on/off toggle — moving a rung
        must not switch a trainer on for someone who was not being dealt it.


        Its own screen is a separate task; this exists so the matrix is inspectable and movable from
        the moment it starts deciding what learners are dealt.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeAdmissionRule' }
      responses:
        '200':
          description: Applied — returns the new settings, matrix included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/exercise-modes/admission:
    put:
      tags: [Exercise modes]
      summary: The same, for one user — their per-mode override (audited)
      description: >
        The override is PER MODE: giving a user typing early leaves every other threshold — and the
        user's on/off set — inheriting the product default, including later changes to it.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeAdmissionRule' }
      responses:
        '200':
          description: Applied — returns the new settings, matrix included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/exercise-modes:
    get:
      tags: [Exercise modes]
      summary: What one user trains with
      description: >
        `override` is null when the user inherits the product default — a different state from an
        override that happens to equal it, and what the panel's Inherit/Custom switch is bound to.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Exercise modes]
      summary: Give a user their own set, or drop the override (audited)
      description: >
        `modes: null` (or an empty array) DELETES the override, putting the user back on the product
        default — including later changes to it. The user's set is never stored as a copy of the
        default, or they would silently miss the next mode that ships.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modes]
              properties:
                modes:
                  type: array
                  nullable: true
                  items: { $ref: '#/components/schemas/ExerciseMode' }
      responses:
        '200':
          description: Applied — returns the new settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseModes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /mode-settings:
    get:
      tags: [Exercise modes]
      summary: The «Матрица режимов» screen — every product-default row
      description: >
        One row per trainer: on/off, rotation position AND the acquisition-ladder threshold
        together — the full stored `learning_mode_settings` row, unlike `/exercise-modes` and
        `/exercise-modes/admission`, which edit the toggles and the threshold as two separate
        writes. Every row's `source` is `global` here — there is nothing to inherit from at this
        scope.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Exercise modes]
      summary: Save one product-default row (audited)
      description: >
        ONE (scope, mode) row per call — the same reason as `/exercise-modes/admission`: a
        whole-matrix write would silently revert a cell someone else had just moved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeSettingsRow' }
      responses:
        '200':
          description: Applied — returns the new matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/mode-settings:
    get:
      tags: [Exercise modes]
      summary: This user's matrix — global rows overlaid by their own overrides
      description: >
        Every mode is present, whichever scope it comes from — `source` says which: `override`
        for a row this user owns directly, `global` for one they inherit.
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Exercise modes]
      summary: Save one row of this user's override (audited)
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeSettingsRow' }
      responses:
        '200':
          description: Applied — returns the user's new matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/{id}/mode-settings/{mode}:
    delete:
      tags: [Exercise modes]
      summary: Reset one override cell back to the product default (audited)
      description: >
        Deletes this user's row for this one mode, so it inherits the global row again — the
        row's «Сбросить» button. Unlike `PUT /users/{id}/exercise-modes` with a cleared set, this
        touches a single cell, not the whole override.
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - name: mode
          in: path
          required: true
          schema: { $ref: '#/components/schemas/ExerciseMode' }
      responses:
        '200':
          description: Reset — returns the user's new matrix
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeSettingsMatrix' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collections:
    get:
      tags: [Collections]
      summary: List collections
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [system, shared, custom] } }
        - { name: search, in: query, schema: { type: string }, description: substring match on title }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/CollectionRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /collections/{id}:
    get:
      tags: [Collections]
      summary: Collection detail with terms
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Curation]
      summary: Edit a collection's title/description
      description: >
        Works on store collections too — curating them is the job, and the user-facing edit command
        next door refuses because it asks "is the actor the owner", which a store deck has none of.
        Changes reach every owner and subscriber through the next `/sync` delta.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Curation]
      summary: Delete a collection for EVERY owner and subscriber
      description: >
        Soft-deletes the collection and ends every subscription. Both halves matter: an owner learns
        from the collection's own tombstone, a subscriber from theirs, and a subscription row that
        was deleted outright would produce no delta at all — the deck would linger on their phone.
        `confirm_title` must equal the collection's title; the check is enforced here, not only in
        the dialog.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_title]
              properties:
                confirm_title: { type: string }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /collections/{id}/impact:
    get:
      tags: [Curation]
      summary: What deleting or editing this collection would touch
      description: Read before the confirm dialog is drawn, so the operator sees the blast radius.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /collections/{id}/terms:
    post:
      tags: [Curation]
      summary: Add an existing term to a collection
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [term_id]
              properties:
                term_id: { type: string }
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /collections/{id}/terms/{termId}:
    delete:
      tags: [Curation]
      summary: Remove a term from THIS collection (the term stays in the dictionary)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: termId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /collections/{id}/costs:
    get:
      tags: [Costs]
      summary: What one collection has cost, split by purpose
      description: >
        The spend LEDGERS are the money (generation_requests, practice_dialogs, term_enrichments,
        example_regenerations) — they hold the whole history and the request log can be pruned. Only
        `images` and `recap`, which have no ledger of their own, are priced from the log.
        Caveats that a bare number would hide are returned in `note`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostByPurpose' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /costs:
    get:
      tags: [Costs]
      summary: Fleet spend by purpose over a window
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, all], default: week }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostByPurpose' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /terms:
    get:
      tags: [Terms]
      summary: List terms
      parameters:
        - { name: search, in: query, schema: { type: string }, description: substring match on text / normalized_text }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/TermRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /terms/{id}:
    get:
      tags: [Terms]
      summary: Term detail (translations, examples, collections, progress footprint)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Curation]
      summary: Edit a term's content
      description: >
        Terms are GLOBAL and deduplicated: this edit is felt by every collection holding the term
        and every learner studying it. That is the point (one fix lands everywhere) and the danger —
        read `/terms/{id}/impact` first and say so in the dialog.

        Editing the EXAMPLE additionally drops that example's distractors and unmarks the term for
        the enrichment run, because everything derived from the old sentence describes text that no
        longer exists. At least one editable field is required.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 200 }
                translation: { type: string, maxLength: 200 }
                ipa: { type: [string, 'null'], maxLength: 200 }
                example_id: { type: string, description: required together with example_sentence }
                example_sentence: { type: string, maxLength: 500 }
                example_translation: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: The updated term
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Curation]
      summary: Retire a term from the dictionary
      description: >
        Soft-deletes the term, removes it from every collection and deletes the (user, term)
        progress rows. The append-only review log is NOT touched — it is history, and history does
        not change because a term was retired. Clients receive a term tombstone in the next delta.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  retired: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /terms/{id}/impact:
    get:
      tags: [Curation]
      summary: What editing or retiring this term would touch
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TermImpact' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /logs:
    get:
      tags: [Logs]
      summary: API request/response log, filtered
      description: >
        Every filter is a query parameter, so the panel keeps its filter state in the URL and a
        shared link reproduces the exact same slice. Rows carry `model`/`tokens_*`/`cost_usd`
        DERIVED from the stored bodies (the usage block is already there), priced with the same
        table Generation uses for its spend ledgers. Bodies themselves are NOT in the list — a page
        of 50 model round-trips is megabytes; fetch `/logs/{id}` for the row the operator expanded.
      parameters:
        - { name: direction, in: query, schema: { type: string, enum: [inbound, outbound] } }
        - { name: provider, in: query, schema: { type: string }, description: the `service` tag, e.g. openai }
        - { name: purpose, in: query, schema: { $ref: '#/components/schemas/CallPurpose' } }
        - { name: status, in: query, schema: { type: integer, minimum: 100, maximum: 599 } }
        - name: status_class
          in: query
          description: Coarser than `status`; `error` means the call never returned a status at all.
          schema: { type: string, enum: ['2xx', '4xx', '5xx', error] }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: collection_id, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: path, in: query, schema: { type: string }, description: substring match on path }
        - { name: search, in: query, schema: { type: string }, description: substring match inside request/response bodies }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/RequestLog' } }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /logs/{id}:
    get:
      tags: [Logs]
      summary: One log row with its full payloads
      description: >
        Bodies and headers are redacted on WRITE — the log table never holds a credential — so this
        returns exactly what is stored.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestLogDetail' }
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /request-logs:
    get:
      tags: [Logs]
      summary: Deprecated alias of /logs
      deprecated: true
      description: The original path, kept so nothing that already calls it breaks. Same controller.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/RequestLog' } }
        '401': { $ref: '#/components/responses/Problem' }

  /practice-dialogs:
    get:
      tags: [Practice]
      summary: List realtime practice dialogs
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/DialogRow' } }
        '401': { $ref: '#/components/responses/Problem' }

  /practice-dialogs/{id}:
    get:
      tags: [Practice]
      summary: Dialog detail with transcript and cost
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DialogDetail' }
        '404': { $ref: '#/components/responses/Problem' }

  /generations:
    get:
      tags: [Generation]
      summary: List AI collection-generation requests
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [pending, running, succeeded, failed] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Generation' } }
        '401': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Limit:
      name: limit
      in: query
      description: >
        Row count in KEYSET mode. Sending `limit` (or `cursor`) switches a listing from offset to
        keyset paging: rows come back id DESC and `meta.next_cursor` carries the walk forward.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: The `meta.next_cursor` of the previous page (the last id seen).
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Laravel 422 validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }

  schemas:
    ExerciseMode:
      type: string
      # Every mode the enum knows, switched on or not — `available` lists them all, which is how a
      # newly built trainer becomes findable in the panel. `intro` is the rung-0 card: it is here
      # like any other trainer, and `no_grade` is what marks it as producing no answer.
      enum: [multiple_choice, word_bank, typing, listening, cloze, scramble, dictation, pick_correct, speaking, intro]

    ExerciseModes:
      type: object
      properties:
        available:
          type: array
          description: Every mode this build can deal, in enum order.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        global:
          type: array
          description: The product default, in rotation order.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        override:
          type: array
          nullable: true
          description: This user's own set, or null when they inherit. Absent scope (global read) is null.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        effective:
          type: array
          description: What the user actually trains with — the override if any, else the default.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        inherits:
          type: boolean
          description: Convenience for the Inherit/Custom switch — true when `override` is null.
        no_grade:
          type: array
          description: >
            The subset of `available` that produces NO grade — today just `intro`, the rung-0 card
            that shows a word rather than asking for it. A flag rather than an omission: it is a
            trainer with a toggle like any other, and the panel needs to know not to offer it
            settings that mean nothing for a card that asks nothing.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        admission:
          type: array
          description: >
            The acquisition-ladder matrix in this scope — which rung opens which trainer. Ordered
            by rung, then mode.
          items:
            allOf:
              - $ref: '#/components/schemas/ModeAdmissionRule'
              - type: object
                properties:
                  min_step:
                    type: integer
                    minimum: 0
                    maximum: 5
                    description: The three thresholds resolved to a rung, by the shared ladder function.

    ModeAdmissionRule:
      type: object
      required: [mode, min_acquisition]
      description: >
        One row of the admission matrix: the EARLIEST point on the acquisition ladder at which a
        trainer may be dealt, plus where its options come from. Expressed in the ladder's own
        coordinates rather than as a bare rung number — it is how a person would say it, and it
        means the threshold and a pair's position are turned into a rung by the same function.
      properties:
        mode: { $ref: '#/components/schemas/ExerciseMode' }
        min_acquisition:
          type: string
          enum: [new, learning, graduated]
        min_learning_step:
          type: integer
          minimum: 0
          maximum: 2
          nullable: true
          description: Only meaningful when `min_acquisition` is `learning`.
        min_reps:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Reviews since GRADUATION, not since the first meeting — the recognition steps never
            reach the scheduler, so `reps` is 0 the moment a pair graduates. Rejected (422) with a
            non-graduated `min_acquisition`, where it would read as a stricter rule than it is.
        options_policy:
          type: string
          enum: [distant, standard]
          default: standard
          description: >-
            `distant` = wrong options are the session's own neighbours, unmistakably different,
            which is what makes a first meeting winnable; `standard` = the enrichment distractors,
            nearly right, which is the exercise once the word is known. A graduated pair always
            gets `standard` whatever is stored.

    ModeSettingsMatrix:
      type: object
      properties:
        rows:
          type: array
          description: One row per mode this build knows, ordered by rotation position then mode.
          items: { $ref: '#/components/schemas/ModeSettingsRow' }

    ModeSettingsRow:
      type: object
      required: [mode, enabled, position, min_acquisition]
      description: >
        One row of the «Матрица режимов» screen: the full stored `learning_mode_settings` row —
        on/off, rotation position, and the acquisition-ladder threshold together. Distinct from
        `ModeAdmissionRule` in its one field name: the reviews threshold is
        `min_successful_reviews` here, matching the renamed database column, while
        `ModeAdmissionRule` (used by the older `/exercise-modes/admission`) and the mobile `/sync`
        wire both keep the historical `min_reps` — that rename is deliberately deferred to a
        contract version bump, since the Flutter client reads it today.
      properties:
        mode: { $ref: '#/components/schemas/ExerciseMode' }
        enabled:
          type: boolean
          description: Whether this trainer is switched on in this scope.
        position:
          type: integer
          minimum: 0
          description: Rotation order — free practice round-robins by index into the enabled set.
        min_acquisition:
          type: string
          enum: [new, learning, graduated]
        min_learning_step:
          type: integer
          minimum: 0
          maximum: 2
          nullable: true
          description: Only meaningful when `min_acquisition` is `learning`.
        min_successful_reviews:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Reviews since GRADUATION, not since the first meeting. Rejected (422) with a
            non-graduated `min_acquisition`, where it would read as a stricter rule than it is.
        options_policy:
          type: string
          enum: [distant, standard]
          default: standard
          description: >-
            `distant` = wrong options are the session's own neighbours; `standard` = the
            enrichment distractors. A graduated pair always gets `standard` whatever is stored.
        source:
          type: string
          enum: [global, override]
          readOnly: true
          description: >-
            Where this row comes from in the scope that was read: `override` when the requested
            user owns this mode's row directly, `global` when they inherit it from the product
            default. Present on responses only; ignored if sent in a request body.

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }

    Page:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
            next_cursor:
              type: [string, 'null']
              description: >
                Keyset mode only: pass back as `cursor` for the next page; null means this was the
                last page. Always null in offset (`page`/`per_page`) mode.

    Admin:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }

    CostBreakdown:
      type: object
      description: USD spent by category over a window.
      properties:
        generation: { type: number }
        practice: { type: number }
        enrichment: { type: number }
        example_regen: { type: number }
        total: { type: number }

    CostCategory:
      type: object
      properties:
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        count: { type: integer }

    Dashboard:
      type: object
      properties:
        totals:
          type: object
          properties:
            users: { type: integer }
            active_users_7d: { type: integer, description: distinct users who answered a review in the last 7 days }
            collections: { type: integer }
            terms: { type: integer }
            reviews_today: { type: integer }
            reviews_7d: { type: integer }
        costs:
          type: object
          properties:
            today: { $ref: '#/components/schemas/CostBreakdown' }
            last_7d: { $ref: '#/components/schemas/CostBreakdown' }
            all_time: { $ref: '#/components/schemas/CostBreakdown' }
        recent_failures:
          type: array
          description: The last few outbound calls that failed (5xx or a transport error).
          items: { $ref: '#/components/schemas/RequestLog' }

    UserRow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        tier: { type: string, enum: [free, premium] }
        cefr: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        collections_count: { type: integer }
        progress_count: { type: integer }

    UserDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }
        tier: { type: string, enum: [free, premium] }
        cefr: { type: [string, 'null'] }
        daily_goal: { type: integer }
        timezone: { type: string }
        onboarded_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        progress:
          type: object
          description: >
            Raw state tallies (total/learning/review/relearning/known) plus the Mastery-defined
            counts from the Learning module (learned = review state, mastered = усвоено, due_today).
          properties:
            total: { type: integer }
            learning: { type: integer }
            review: { type: integer }
            relearning: { type: integer }
            known: { type: integer }
            learned: { type: integer }
            mastered: { type: integer }
            due_today: { type: integer }
        reviews_total: { type: integer }
        reviews_today: { type: integer }
        streak_days: { type: integer }
        costs:
          type: object
          properties:
            generation: { $ref: '#/components/schemas/CostCategory' }
            practice: { $ref: '#/components/schemas/CostCategory' }
            example_regen: { $ref: '#/components/schemas/CostCategory' }
            total_usd: { type: number }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string }
              items_count: { type: integer }
              added_at: { type: [string, 'null'], format: date-time }

    DayPlan:
      type: object
      properties:
        date: { type: string, description: 'YYYY-MM-DD in the user timezone' }
        timezone: { type: string }
        due_count: { type: integer }
        new_introduced: { type: integer }
        new_terms_per_day: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              term_id: { type: string }
              text: { type: string }
              translation: { type: [string, 'null'] }
              type: { type: string }
              state: { type: string, enum: [new, learning, review, relearning, known] }
              reps: { type: integer }
              interval_days: { type: integer }
              due_at: { type: [string, 'null'], format: date-time }
              exercise_mode: { type: string, enum: [multiple_choice, word_bank, typing, listening, cloze] }
              clozeable: { type: boolean }
              is_new: { type: boolean }

    CollectionProgress:
      type: object
      description: Per-collection progress. new + in_progress + mastered = total; confirmed + familiar = mastered.
      properties:
        total: { type: integer }
        new: { type: integer }
        in_progress: { type: integer }
        mastered: { type: integer }
        confirmed: { type: integer, description: 'proven by exercises (review & interval >= 21)' }
        familiar: { type: integer, description: 'self-marked known (awaiting proof)' }
        due: { type: integer }

    UserCollectionWithProgress:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        items_count: { type: integer }
        added_at: { type: [string, 'null'], format: date-time }
        progress: { $ref: '#/components/schemas/CollectionProgress' }

    Review:
      type: object
      properties:
        id: { type: string }
        term_id: { type: string }
        term_text: { type: [string, 'null'] }
        exercise_mode: { type: [string, 'null'] }
        grade: { type: string, enum: [again, hard, good, easy] }
        is_correct: { type: [boolean, 'null'] }
        is_practice: { type: boolean }
        client_seq: { type: integer }
        answered_at: { type: [string, 'null'], format: date-time }

    LadderLearner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: the later of the last answer and the last intro; null = never used the app
        pairs_count: { type: integer, description: 'rows in user_term_progress — words already met' }

    LadderCounts:
      type: object
      description: >
        The four phases partition the pairs. `known` is a STATE and wins over the acquisition value
        the same row also carries, so total = new + learning + graduated + known exactly.
      properties:
        total: { type: integer }
        new: { type: integer }
        learning: { type: integer }
        graduated: { type: integer }
        known: { type: integer }
        due: { type: integer, description: 'scheduled and ripe now; ladder pairs have no due date at all' }

    LadderReview:
      type: object
      description: The governing (greatest client_seq) review of a pair.
      properties:
        id: { type: string }
        exercise_mode: { type: [string, 'null'] }
        grade: { type: string, enum: [again, hard, good, easy] }
        is_correct: { type: [boolean, 'null'] }
        is_practice: { type: boolean }
        ladder_step:
          type: [integer, 'null']
          description: the rung the CARD was dealt at — not the pair's rung now, which the answer may have moved
        response: { type: [string, 'null'] }
        client_seq: { type: integer }
        answered_at: { type: [string, 'null'], format: date-time }

    LadderPair:
      type: object
      properties:
        term_id: { type: string }
        text: { type: string }
        translation: { type: [string, 'null'] }
        collections:
          type: array
          description: the LEARNER'S OWN collections this term came from (not every collection containing it)
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string, enum: [system, shared, custom] }
        state: { type: string, enum: [new, learning, review, relearning, known] }
        acquisition: { type: string, enum: [new, learning, graduated] }
        learning_step: { type: integer, description: 'the stored rung while on the recognition steps (0–2)' }
        ladder_step:
          type: [integer, 'null']
          minimum: 0
          maximum: 5
          description: >
            The rung, derived by LearningLadder. null = OUTSIDE the ladder (a triage «знаю»), drawn
            as a dash — never as rung 0.
        reps: { type: integer }
        lapses: { type: integer }
        interval_days: { type: integer }
        due_at: { type: [string, 'null'], format: date-time }
        last_reviewed_at: { type: [string, 'null'], format: date-time }
        exposed_at:
          type: [string, 'null']
          format: date-time
          description: when the intro card was shown; null = the word has never been introduced
        last_review:
          oneOf:
            - $ref: '#/components/schemas/LadderReview'
            - type: 'null'

    LadderEvent:
      type: object
      description: >
        One entry of the live feed: an answer, a word being introduced, or a self-assessed triage
        verdict. The triage kind exists so a word reaching `known` has an event explaining how it
        got there — without it the pairs table shows a known word that arrived from nowhere.
      properties:
        id: { type: string, description: 'the review id, the triage id, or `exposure:<term_id>` — an intro''s identity IS the pair' }
        kind: { type: string, enum: [review, exposure, triage] }
        term_id: { type: string }
        term_text: { type: [string, 'null'] }
        occurred_at: { type: [string, 'null'], format: date-time }
        exercise_mode: { type: [string, 'null'] }
        grade: { type: [string, 'null'], enum: [again, hard, good, easy, null] }
        is_correct: { type: [boolean, 'null'] }
        is_practice: { type: boolean }
        ladder_step: { type: [integer, 'null'], description: 'always null for an intro or a triage — neither is a graded card' }
        response: { type: [string, 'null'] }
        client_seq: { type: [integer, 'null'] }
        verdict:
          type: [string, 'null']
          enum: [known, unknown, unsure, null]
          description: Set only when `kind` is `triage` — the self-assessment the learner swiped.

    CollectionRow:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        title: { type: string }
        owner_id: { type: [string, 'null'] }
        owner_email: { type: [string, 'null'] }
        source: { type: string, enum: [curated, ai, user] }
        items_count: { type: integer }
        created_at: { type: [string, 'null'], format: date-time }
        cost_usd:
          type: number
          description: >
            Directly-attributable spend (generation + realtime). The per-term purposes are left out
            of the list — see /collections/{id}/costs for the full split.

    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/CollectionRow'
        - type: object
          properties:
            description: { type: [string, 'null'] }
            topic: { type: [string, 'null'] }
            source_lang: { type: string }
            target_lang: { type: string }
            terms:
              type: array
              items:
                type: object
                properties:
                  term_id: { type: string }
                  text: { type: string }
                  translation: { type: [string, 'null'] }
                  position: { type: integer }

    TermRow:
      type: object
      properties:
        id: { type: string }
        lang: { type: string }
        text: { type: string }
        type: { type: string, enum: [word, phrase, idiom, phrasal_verb] }
        translation: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    TermDetail:
      type: object
      properties:
        id: { type: string }
        lang: { type: string }
        text: { type: string }
        normalized_text: { type: string }
        type: { type: string }
        pos: { type: [string, 'null'] }
        ipa: { type: [string, 'null'] }
        audio_url: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        image_author: { type: [string, 'null'] }
        image_author_url: { type: [string, 'null'] }
        cefr: { type: [string, 'null'] }
        source: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        translations:
          type: array
          items:
            type: object
            properties:
              lang: { type: string }
              text: { type: string }
              is_primary: { type: boolean }
        examples:
          type: array
          description: >
            EVERY example the term has, pinned one first. A term accumulates one example per
            generation pass, but only the pinned one (lowest id) is ever shown to the learner and
            only it carries distractors.
          items: { $ref: '#/components/schemas/TermExample' }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string }
        accepted_variants:
          type: array
          description: Alternative forms the grader accepts. Empty if the enrichment run never ran.
          items:
            type: object
            properties:
              text: { type: string }
              note: { type: [string, 'null'] }
              generator_version: { type: string }
        findings:
          type: array
          description: What the enrichment run flagged about this term. Empty if it never ran.
          items:
            type: object
            properties:
              kind: { type: string, enum: [ambiguity, language, ua_leakage, misspelled_or_nonword, variant_conflict] }
              field: { type: [string, 'null'] }
              detail: { type: string }
              generator_version: { type: string }
              created_at: { type: [string, 'null'], format: date-time }
        enrichment_version: { type: [string, 'null'] }
        progress_count: { type: integer }

    TermExample:
      type: object
      properties:
        id: { type: string }
        sentence: { type: string }
        translation: { type: [string, 'null'] }
        is_pinned: { type: boolean }
        distractors:
          type: array
          description: >
            Deliberately-broken variants for find-the-mistake. `error_span` is the exact substring
            of `sentence` that is wrong, so a reader can be shown WHERE rather than made to diff.
          items:
            type: object
            properties:
              id: { type: string }
              sentence: { type: string }
              error_type: { type: string, enum: [article, preposition, tense, word_order, false_friend, modal_to] }
              error_span: { type: string }
              correction: { type: string }
              generator_version: { type: string }

    TermImpact:
      type: object
      description: The blast radius of touching one term — terms are global.
      properties:
        term_id: { type: string }
        text: { type: string }
        collections_count: { type: integer }
        users_with_progress: { type: integer }
        reviews_count: { type: integer, description: answers already in the append-only log; never deleted }

    CollectionImpact:
      type: object
      properties:
        collection_id: { type: string }
        title: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        owner_id: { type: [string, 'null'] }
        terms_count: { type: integer }
        subscribers: { type: integer, description: active subscriptions that would end }
        learners_with_progress: { type: integer }

    CostByPurpose:
      type: object
      properties:
        scope_id: { type: [string, 'null'], description: the collection, when the scope is one }
        period: { type: [string, 'null'], enum: [day, week, month, all, 'null'] }
        since: { type: [string, 'null'], format: date-time }
        total_usd: { type: number }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        by_purpose:
          type: array
          items:
            type: object
            properties:
              purpose: { $ref: '#/components/schemas/CallPurpose' }
              tokens_in: { type: integer }
              tokens_out: { type: integer }
              cost_usd: { type: number }
              calls: { type: integer }
        note:
          type: [string, 'null']
          description: Caveats the numbers alone would hide (shared terms, log-priced purposes).

    CallPurpose:
      type: string
      description: Why an outbound call was made. Null on inbound rows and on unlabelled calls.
      enum: [generation, images, enrichment, realtime, recap, example_regen]

    RequestLog:
      type: object
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        method: { type: string }
        host: { type: [string, 'null'] }
        path: { type: string }
        service: { type: [string, 'null'] }
        purpose:
          oneOf: [{ $ref: '#/components/schemas/CallPurpose' }, { type: 'null' }]
        collection_id: { type: [string, 'null'] }
        status: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        user_id: { type: [string, 'null'] }
        occurred_at: { type: [string, 'null'], format: date-time }
        model: { type: [string, 'null'], description: derived from the stored bodies }
        tokens_in: { type: [integer, 'null'], description: derived from the stored response usage block }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [number, 'null'], description: priced from tokens; null for an unpriced model }
        error: { type: [string, 'null'], description: transport error, when the call never completed }

    RequestLogDetail:
      allOf:
        - $ref: '#/components/schemas/RequestLog'
        - type: object
          properties:
            request_bytes: { type: [integer, 'null'] }
            response_bytes: { type: [integer, 'null'] }
            request_headers: { type: [object, 'null'], additionalProperties: true }
            request_body: { type: [object, 'null'], additionalProperties: true }
            response_body: { type: [object, 'null'], additionalProperties: true }

    DialogRow:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        collection_id: { type: string }
        status: { type: string, enum: [active, finished, expired] }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [number, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    DialogDetail:
      allOf:
        - $ref: '#/components/schemas/DialogRow'
        - type: object
          properties:
            summary: { type: [string, 'null'] }
            transcript:
              type: array
              items:
                type: object
                properties:
                  role: { type: string, enum: [user, assistant] }
                  text: { type: string }
                  ts: { type: integer }

    Generation:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        prompt: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        model: { type: [string, 'null'] }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [number, 'null'] }
        collection_id: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

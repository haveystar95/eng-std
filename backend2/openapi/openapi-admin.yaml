      tags: [Plan page]
      summary: «Урок и голос» — the served lesson of each day and every spoken line's voice
      description: >
        `lesson` is the served lesson (the one the day's cards are dealt from), not the model's raw answer.
        Each line of `voice.lines` carries the voice its cast gives it (keys from the language pack's
        config), the rule it was chosen by, the stored file in that voice with its bill, and `status`

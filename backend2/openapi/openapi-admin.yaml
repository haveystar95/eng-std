                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PlanTalk' } }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /plans/{code}/money:
    get:
      tags: [Plan page]
      summary: «Деньги» — by stage and by day, against the canon
      parameters: [{ $ref: '#/components/parameters/PlanCode' }, { $ref: '#/components/parameters/PlanDay' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanMoney' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /plans/{code}/calls:
    get:
      tags: [Plan page]
      summary: «Вызовы API» — one journal of the plan, newest first
      description: >
        Model calls (by build and talk windows), voice purchases (scene lines and talk lines), slot judges
        and the client's calls to the plan's routes. Paged by an opaque cursor: send `meta.next_cursor`
        back as `cursor`; null — the last page. `meta.total` counts the whole filtered journal.
      parameters:
        - { $ref: '#/components/parameters/PlanCode' }
        - { $ref: '#/components/parameters/PlanDay' }
        - { name: source, in: query, schema: { type: string, enum: [model, voice, judge, client] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCalls' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /plans/{code}/audio/{audioId}:
    get:
      tags: [Plan page]
      summary: A sound of the plan — a scene's line or a talk's line
      description: 404 for any id that is not one of this plan's sounds.
      parameters:
        - { $ref: '#/components/parameters/PlanCode' }
        - { name: audioId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file
          content:
            audio/mpeg: { schema: { type: string, format: binary } }
            audio/wav: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Limit:
      name: limit
      in: query
      description: >
        Row count in KEYSET mode. Sending `limit` (or `cursor`) switches a listing from offset to
        keyset paging: rows come back id DESC and `meta.next_cursor` carries the walk forward.
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: The `meta.next_cursor` of the previous page (the last id seen).
      schema: { type: string }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string }
    PlanCode:
      name: code
      in: path
      required: true
      description: The plan's code (characters 5–10 of its ULID) or its full id.
      schema: { type: string, pattern: '^([0-9A-HJKMNP-TV-Z]{6}|[0-9A-HJKMNP-TV-Z]{26})$' }
    PlanDay:
      name: day
      in: query
      description: 'Narrow the section to one day of the plan (1..10); absent — the whole plan.'
      schema: { type: integer, minimum: 1, maximum: 10 }

  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Laravel 422 validation error
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object, additionalProperties: { type: array, items: { type: string } } }

  schemas:
    ExerciseMode:
      type: string
      # Every mode the enum knows, switched on or not — `available` lists them all, which is how a
      # newly built trainer becomes findable in the panel. `intro` is the rung-0 card: it is here
      # like any other trainer, and `no_grade` is what marks it as producing no answer.
      enum: [multiple_choice, word_bank, typing, listening, cloze, scramble, dictation, pick_correct, speaking, intro]

    ExerciseModes:
      type: object
      properties:
        available:
          type: array
          description: Every mode this build can deal, in enum order.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        global:
          type: array
          description: The product default, in rotation order.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        override:
          type: array
          nullable: true
          description: This user's own set, or null when they inherit. Absent scope (global read) is null.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        effective:
          type: array
          description: What the user actually trains with — the override if any, else the default.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        inherits:
          type: boolean
          description: Convenience for the Inherit/Custom switch — true when `override` is null.
        no_grade:
          type: array
          description: >
            The subset of `available` that produces NO grade — today just `intro`, the rung-0 card
            that shows a word rather than asking for it. A flag rather than an omission: it is a
            trainer with a toggle like any other, and the panel needs to know not to offer it
            settings that mean nothing for a card that asks nothing.
          items: { $ref: '#/components/schemas/ExerciseMode' }
        admission:
          type: array
          description: >
            The acquisition-ladder matrix in this scope — which rung opens which trainer. Ordered
            by rung, then mode.
          items:
            allOf:
              - $ref: '#/components/schemas/ModeAdmissionRule'
              - type: object
                properties:
                  min_step:
                    type: integer
                    minimum: 0
                    maximum: 5
                    description: The three thresholds resolved to a rung, by the shared ladder function.

    ModeAdmissionRule:
      type: object
      required: [mode, min_acquisition]
      description: >
        One row of the admission matrix: the EARLIEST point on the acquisition ladder at which a
        trainer may be dealt, plus where its options come from. Expressed in the ladder's own
        coordinates rather than as a bare rung number — it is how a person would say it, and it
        means the threshold and a pair's position are turned into a rung by the same function.
      properties:
        mode: { $ref: '#/components/schemas/ExerciseMode' }
        min_acquisition:
          type: string
          enum: [new, learning, graduated]
        min_learning_step:
          type: integer
          minimum: 0
          maximum: 2
          nullable: true
          description: Only meaningful when `min_acquisition` is `learning`.
        min_reps:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Reviews since GRADUATION, not since the first meeting — the recognition steps never
            reach the scheduler, so `reps` is 0 the moment a pair graduates. Rejected (422) with a
            non-graduated `min_acquisition`, where it would read as a stricter rule than it is.
        options_policy:
          type: string
          enum: [distant, standard]
          default: standard
          description: >-
            `distant` = wrong options are the session's own neighbours, unmistakably different,
            which is what makes a first meeting winnable; `standard` = the enrichment distractors,
            nearly right, which is the exercise once the word is known. A graduated pair always
            gets `standard` whatever is stored.

    ModeSettingsMatrix:
      type: object
      properties:
        rows:
          type: array
          description: One row per mode this build knows, ordered by rotation position then mode.
          items: { $ref: '#/components/schemas/ModeSettingsRow' }

    ModeSettingsRow:
      type: object
      required: [mode, enabled, position, min_acquisition]
      description: >
        One row of the «Матрица режимов» screen: the full stored `learning_mode_settings` row —
        on/off, rotation position, and the acquisition-ladder threshold together. Distinct from
        `ModeAdmissionRule` in its one field name: the reviews threshold is
        `min_successful_reviews` here, matching the renamed database column, while
        `ModeAdmissionRule` (used by the older `/exercise-modes/admission`) and the mobile `/sync`
        wire both keep the historical `min_reps` — that rename is deliberately deferred to a
        contract version bump, since the Flutter client reads it today.
      properties:
        mode: { $ref: '#/components/schemas/ExerciseMode' }
        enabled:
          type: boolean
          description: Whether this trainer is switched on in this scope.
        position:
          type: integer
          minimum: 0
          description: Rotation order — free practice round-robins by index into the enabled set.
        min_acquisition:
          type: string
          enum: [new, learning, graduated]
        min_learning_step:
          type: integer
          minimum: 0
          maximum: 2
          nullable: true
          description: Only meaningful when `min_acquisition` is `learning`.
        min_successful_reviews:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Reviews since GRADUATION, not since the first meeting. Rejected (422) with a
            non-graduated `min_acquisition`, where it would read as a stricter rule than it is.
        options_policy:
          type: string
          enum: [distant, standard]
          default: standard
          description: >-
            `distant` = wrong options are the session's own neighbours; `standard` = the
            enrichment distractors. A graduated pair always gets `standard` whatever is stored.
        source:
          type: string
          enum: [global, override]
          readOnly: true
          description: >-
            Where this row comes from in the scope that was read: `override` when the requested
            user owns this mode's row directly, `global` when they inherit it from the product
            default. Present on responses only; ignored if sent in a request body.
        floor:
          type: string
          enum: [new, learning, graduated]
          readOnly: true
          description: >-
            This trainer's constructive minimum — the earliest acquisition phase its question can
            honestly be asked at (e.g. `speaking` can never float below `graduated`: before then
            there is nothing to recall). Independent of `min_acquisition`, which is the admin's
            OWN setting and may (legacy data, a rollback) read below its own floor; a write below
            the floor is rejected with 422. Present on responses only.

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }

    Page:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta:
          type: object
          properties:
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
            next_cursor:
              type: [string, 'null']
              description: >
                Keyset mode only: pass back as `cursor` for the next page; null means this was the
                last page. Always null in offset (`page`/`per_page`) mode.

    Admin:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }

    CostBreakdown:
      type: object
      description: USD spent by category over a window.
      properties:
        generation: { type: number, description: 'collection generation (generation_requests, purpose=generation)' }
        plan: { type: number, description: 'learning plans (generation_requests, purpose=plan) — same ledger, different product' }
        practice: { type: number }
        enrichment: { type: number }
        example_regen: { type: number }
        total: { type: number }

    CostCategory:
      type: object
      properties:
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        cost_usd: { type: number }
        count: { type: integer }

    Dashboard:
      type: object
      properties:
        totals:
          type: object
          properties:
            users: { type: integer }
            active_users_7d: { type: integer, description: distinct users who answered a review in the last 7 days }
            collections: { type: integer }
            terms: { type: integer }
            reviews_today: { type: integer }
            reviews_7d: { type: integer }
        costs:
          type: object
          properties:
            today: { $ref: '#/components/schemas/CostBreakdown' }
            last_7d: { $ref: '#/components/schemas/CostBreakdown' }
            all_time: { $ref: '#/components/schemas/CostBreakdown' }
        recent_failures:
          type: array
          description: The last few outbound calls that failed (5xx or a transport error).
          items: { $ref: '#/components/schemas/RequestLog' }

    UserRow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        tier: { type: string, enum: [free, premium] }
        cefr: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        collections_count: { type: integer }
        progress_count: { type: integer }

    UserDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }
        tier: { type: string, enum: [free, premium] }
        cefr: { type: [string, 'null'] }
        daily_goal: { type: integer }
        timezone: { type: string }
        onboarded_at: { type: [string, 'null'], format: date-time }
        created_at: { type: [string, 'null'], format: date-time }
        progress:
          type: object
          description: >
            Raw state tallies (total/learning/review/relearning/known) plus the Mastery-defined
            counts from the Learning module (learned = review state, mastered = усвоено, due_today).
          properties:
            total: { type: integer }
            learning: { type: integer }
            review: { type: integer }
            relearning: { type: integer }
            known: { type: integer }
            learned: { type: integer }
            mastered: { type: integer }
            due_today: { type: integer }
        reviews_total: { type: integer }
        reviews_today: { type: integer }
        streak_days: { type: integer }
        costs:
          type: object
          properties:
            generation: { $ref: '#/components/schemas/CostCategory' }
            plan: { $ref: '#/components/schemas/CostCategory' }
            practice: { $ref: '#/components/schemas/CostCategory' }
            example_regen: { $ref: '#/components/schemas/CostCategory' }
            total_usd: { type: number }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string }
              items_count: { type: integer }
              added_at: { type: [string, 'null'], format: date-time }

    DayPlan:
      type: object
      properties:
        date: { type: string, description: 'YYYY-MM-DD in the user timezone' }
        timezone: { type: string }
        due_count: { type: integer }
        new_introduced: { type: integer }
        new_terms_per_day: { type: integer }
        entries:
          type: array
          items:
            type: object
            properties:
              term_id: { type: string }
              text: { type: string }
              translation: { type: [string, 'null'] }
              type: { type: string }
              state: { type: string, enum: [new, learning, review, relearning, known] }
              reps: { type: integer }
              interval_days: { type: integer }
              due_at: { type: [string, 'null'], format: date-time }
              exercise_mode: { type: string, enum: [multiple_choice, word_bank, typing, listening, cloze] }
              clozeable: { type: boolean }
              is_new: { type: boolean }

    CollectionProgress:
      type: object
      description: Per-collection progress. new + in_progress + mastered = total; confirmed + familiar = mastered.
      properties:
        total: { type: integer }
        new: { type: integer }
        in_progress: { type: integer }
        mastered: { type: integer }
        confirmed: { type: integer, description: 'proven by exercises (review & interval >= 21)' }
        familiar: { type: integer, description: 'self-marked known (awaiting proof)' }
        due: { type: integer }

    UserCollectionWithProgress:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        items_count: { type: integer }
        added_at: { type: [string, 'null'], format: date-time }
        progress: { $ref: '#/components/schemas/CollectionProgress' }

    Review:
      type: object
      properties:
        id: { type: string }
        term_id: { type: string }
        term_text: { type: [string, 'null'] }
        exercise_mode: { type: [string, 'null'] }
        grade: { type: string, enum: [again, hard, good, easy] }
        is_correct: { type: [boolean, 'null'] }
        is_practice: { type: boolean }
        client_seq: { type: integer }
        answered_at: { type: [string, 'null'], format: date-time }

    LadderLearner:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: [string, 'null'] }
        last_activity_at:
          type: [string, 'null']
          format: date-time
          description: the later of the last answer and the last intro; null = never used the app
        pairs_count: { type: integer, description: 'rows in user_term_progress — words already met' }

    LadderCounts:
      type: object
      description: >
        The four phases partition the pairs. `known` is a STATE and wins over the acquisition value
        the same row also carries, so total = new + learning + graduated + known exactly.
      properties:
        total: { type: integer }
        new: { type: integer }
        learning: { type: integer }
        graduated: { type: integer }
        known: { type: integer }
        due: { type: integer, description: 'scheduled and ripe now; ladder pairs have no due date at all' }

    LadderReview:
      type: object
      description: The governing (greatest client_seq) review of a pair.
      properties:
        id: { type: string }
        exercise_mode: { type: [string, 'null'] }
        grade: { type: string, enum: [again, hard, good, easy] }
        is_correct: { type: [boolean, 'null'] }
        is_practice: { type: boolean }
        ladder_step:
          type: [integer, 'null']
          description: the rung the CARD was dealt at — not the pair's rung now, which the answer may have moved
        response: { type: [string, 'null'] }
        client_seq: { type: integer }
        answered_at: { type: [string, 'null'], format: date-time }

    LadderPair:
      type: object
      properties:
        term_id: { type: string }
        text: { type: string }
        translation: { type: [string, 'null'] }
        collections:
          type: array
          description: the LEARNER'S OWN collections this term came from (not every collection containing it)
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string, enum: [system, shared, custom] }
        state: { type: string, enum: [new, learning, review, relearning, known] }
        acquisition: { type: string, enum: [new, learning, graduated] }
        learning_step: { type: integer, description: 'the stored rung while on the recognition steps (0–2)' }
        ladder_step:
          type: [integer, 'null']
          minimum: 0
          maximum: 5
          description: >
            The rung, derived by LearningLadder. null = OUTSIDE the ladder (a triage «знаю»), drawn
            as a dash — never as rung 0.
        reps: { type: integer }
        lapses: { type: integer }
        interval_days: { type: integer }
        due_at: { type: [string, 'null'], format: date-time }
        last_reviewed_at: { type: [string, 'null'], format: date-time }
        exposed_at:
          type: [string, 'null']
          format: date-time
          description: when the intro card was shown; null = the word has never been introduced
        last_review:
          oneOf:
            - $ref: '#/components/schemas/LadderReview'
            - type: 'null'

    LadderEvent:
      type: object
      description: >
        One entry of the live feed: an answer, a word being introduced, or a self-assessed triage
        verdict. The triage kind exists so a word reaching `known` has an event explaining how it
        got there — without it the pairs table shows a known word that arrived from nowhere.
      properties:
        id: { type: string, description: 'the review id, the triage id, or `exposure:<term_id>` — an intro''s identity IS the pair' }
        kind: { type: string, enum: [review, exposure, triage] }
        term_id: { type: string }
        term_text: { type: [string, 'null'] }
        occurred_at: { type: [string, 'null'], format: date-time }
        exercise_mode: { type: [string, 'null'] }
        grade: { type: [string, 'null'], enum: [again, hard, good, easy, null] }
        is_correct: { type: [boolean, 'null'] }
        is_practice: { type: boolean }
        ladder_step: { type: [integer, 'null'], description: 'always null for an intro or a triage — neither is a graded card' }
        response: { type: [string, 'null'] }
        client_seq: { type: [integer, 'null'] }
        verdict:
          type: [string, 'null']
          enum: [known, unknown, unsure, null]
          description: Set only when `kind` is `triage` — the self-assessment the learner swiped.

    CollectionRow:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        title: { type: string }
        owner_id: { type: [string, 'null'] }
        owner_email: { type: [string, 'null'] }
        source: { type: string, enum: [curated, ai, user] }
        items_count: { type: integer }
        created_at: { type: [string, 'null'], format: date-time }
        cost_usd:
          type: number
          description: >
            Directly-attributable spend (generation + realtime). The per-term purposes are left out
            of the list — see /collections/{id}/costs for the full split.

    CollectionDetail:
      allOf:
        - $ref: '#/components/schemas/CollectionRow'
        - type: object
          properties:
            description: { type: [string, 'null'] }
            topic: { type: [string, 'null'] }
            source_lang: { type: string }
            target_lang: { type: string }
            terms:
              type: array
              items:
                type: object
                properties:
                  term_id: { type: string }
                  text: { type: string }
                  translation: { type: [string, 'null'] }
                  position: { type: integer }

    TermRow:
      type: object
      properties:
        id: { type: string }
        lang: { type: string }
        text: { type: string }
        type: { type: string, enum: [word, phrase, idiom, phrasal_verb] }
        translation: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }

    TermDetail:
      type: object
      properties:
        id: { type: string }
        lang: { type: string }
        text: { type: string }
        normalized_text: { type: string }
        type: { type: string }
        pos: { type: [string, 'null'] }
        ipa: { type: [string, 'null'] }
        audio_url: { type: [string, 'null'] }
        image_url: { type: [string, 'null'] }
        image_author: { type: [string, 'null'] }
        image_author_url: { type: [string, 'null'] }
        cefr: { type: [string, 'null'] }
        source: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        translations:
          type: array
          items:
            type: object
            properties:
              lang: { type: string }
              text: { type: string }
              is_primary: { type: boolean }
        examples:
          type: array
          description: >
            EVERY example the term has, pinned one first. A term accumulates one example per
            generation pass, but only the pinned one (lowest id) is ever shown to the learner and
            only it carries distractors.
          items: { $ref: '#/components/schemas/TermExample' }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string }
        accepted_variants:
          type: array
          description: Alternative forms the grader accepts. Empty if the enrichment run never ran.
          items:
            type: object
            properties:
              text: { type: string }
              note: { type: [string, 'null'] }
              generator_version: { type: string }
        findings:
          type: array
          description: What the enrichment run flagged about this term. Empty if it never ran.
          items:
            type: object
            properties:
              kind: { type: string, enum: [ambiguity, language, ua_leakage, misspelled_or_nonword, variant_conflict] }
              field: { type: [string, 'null'] }
              detail: { type: string }
              generator_version: { type: string }
              created_at: { type: [string, 'null'], format: date-time }
        enrichment_version: { type: [string, 'null'] }
        progress_count: { type: integer }

    TermExample:
      type: object
      properties:
        id: { type: string }
        sentence: { type: string }
        translation: { type: [string, 'null'] }
        is_pinned: { type: boolean }
        distractors:
          type: array
          description: >
            Deliberately-broken variants for find-the-mistake. `error_span` is the exact substring
            of `sentence` that is wrong, so a reader can be shown WHERE rather than made to diff.
          items:
            type: object
            properties:
              id: { type: string }
              sentence: { type: string }
              error_type: { type: string, enum: [article, preposition, tense, word_order, false_friend, modal_to] }
              error_span: { type: string }
              correction: { type: string }
              generator_version: { type: string }

    ContentHealthScope:
      type: object
      description: Coverage counters over one slice of the dictionary.
      properties:
        scope: { type: string, enum: [all, system, user] }
        terms: { type: integer }
        with_distractors: { type: integer, description: at least one USABLE (span-distinct) distractor }
        pick_correct_ready:
          type: integer
          description: >
            The whole pick_correct card assembles — a pinned example, its translation, and at least
            two span-distinct distractors, i.e. three sentences on screen.
        with_variants: { type: integer }
        without_example: { type: integer, description: 'no pinned example; fixed by regeneration, NOT by the станок' }
        needs_enrichment:
          type: integer
          description: live example AND (fewer than `min_distractors` usable, or no variants at all)
        estimated_topup_usd: { type: number, description: needs_enrichment × cost_per_term_usd }
        enrichment_versions:
          type: array
          description: '`version: null` is «станок не прогонялся» — first in the list, and the bucket that matters.'
          items:
            type: object
            properties:
              version: { type: [string, 'null'] }
              terms: { type: integer }

    ContentHealthSummary:
      type: object
      properties:
        scopes:
          type: object
          properties:
            all: { $ref: '#/components/schemas/ContentHealthScope' }
            system: { $ref: '#/components/schemas/ContentHealthScope' }
            user: { $ref: '#/components/schemas/ContentHealthScope' }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string, enum: [system, shared, custom] }
              terms: { type: integer }
              without_example: { type: integer }
              pick_correct_ready: { type: integer }
              needs_enrichment: { type: integer }
              estimated_topup_usd: { type: number }
        suppressions:
          type: object
          description: Sentences a proofreader or the audit removed. They OUTLIVE the rows they were about.
          properties:
            total: { type: integer }
            by_source:
              type: array
              items: { $ref: '#/components/schemas/ContentLabelCount' }
        generation_rejections:
          type: object
          description: Items the language barrier refused to write at all — no term was ever created.
          properties:
            total: { type: integer }
            by_field:
              type: array
              items: { $ref: '#/components/schemas/ContentLabelCount' }
        current_generator_version: { type: string, description: what a plain run writes and skips by today }
        min_distractors: { type: integer, description: the stocking target the report flags against }
        cost_per_term_usd: { type: number }

    ContentLabelCount:
      type: object
      properties:
        label: { type: string }
        count: { type: integer }

    ContentHealthTerm:
      type: object
      properties:
        term_id: { type: string }
        text: { type: string }
        translation: { type: [string, 'null'] }
        has_example: { type: boolean }
        missing_example:
          type: boolean
          description: >
            Kept apart from `needs_enrichment` on purpose — with no example the станок has nothing to
            write against, so this is cured by regenerating the example and never by a догон.
        usable_distractors: { type: integer, description: span-distinct — what a card can actually deal }
        raw_distractors: { type: integer, description: rows on the pinned example; higher when spans collide }
        pick_correct_ready: { type: boolean }
        variants: { type: integer }
        enrichment_version: { type: [string, 'null'] }
        needs_enrichment: { type: boolean }
        needs_enrichment_reasons:
          type: array
          items: { type: string, enum: [few_distractors, no_variants] }

    CollectionContentHealth:
      type: object
      properties:
        collection_id: { type: string }
        title: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        terms:
          type: array
          description: Most under-stocked first — no example, then fewest usable distractors, then fewest variants.
          items: { $ref: '#/components/schemas/ContentHealthTerm' }
        needs_enrichment: { type: integer }
        without_example: { type: integer }
        pick_correct_ready: { type: integer }
        estimated_topup_usd: { type: number }
        topup_command: { type: string, description: ready to paste into a terminal; the panel never runs it }
        min_distractors: { type: integer }
        cost_per_term_usd: { type: number }

    ModeSimulation:
      type: object
      description: >
        One trainer's verdict on this term's content. `pool_dependent` is not a hedge:
        `multiple_choice` builds its wrong options out of OTHER words in the session, so no content
        of this term decides whether its card assembles.
      properties:
        mode: { $ref: '#/components/schemas/ExerciseMode' }
        status: { type: string, enum: [ok, blocked, pool_dependent] }
        reason:
          type: [string, 'null']
          description: Machine reason; null exactly when `status` is `ok`.
          enum: [single_word, no_example, example_lacks_term, example_is_term, no_example_translation,
                 example_too_short, example_too_long, too_few_distractors, options_from_pool, null]
        explanation: { type: string, description: 'the same thing in Russian, for the screen' }

    TermContentPassport:
      type: object
      properties:
        term_id: { type: string }
        text: { type: string }
        lang: { type: string }
        type: { type: string }
        translations:
          type: array
          items:
            type: object
            properties:
              lang: { type: string }
              text: { type: string }
              is_primary: { type: boolean }
        example:
          type: [object, 'null']
          description: The PINNED example — the only sentence the learner ever sees.
          properties:
            id: { type: string }
            sentence: { type: [string, 'null'] }
            translation: { type: [string, 'null'] }
        distractors:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              sentence: { type: string }
              error_type: { type: string, enum: [article, preposition, tense, word_order, false_friend, modal_to] }
              error_span: { type: string }
              correction: { type: string }
              generator_version: { type: string }
              usable:
                type: boolean
                description: >
                  false = a card would not deal this row, because another distractor already breaks
                  the same span and the trainer keeps one error per card.
        error_type_note:
          type: string
          description: >
            Says in Russian that `error_type` is the станок's own guess, checked by nothing — read
            the span and the correction, treat the label as a hint.
        suppressed:
          type: array
          description: Sentences a proofreader or the audit removed. Their own list, never merged with the live rows.
          items:
            type: object
            properties:
              sentence: { type: string, description: stored canonicalized }
              source: { type: string, enum: [review, audit] }
              created_at: { type: [string, 'null'], format: date-time }
        accepted_variants:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              note: { type: [string, 'null'] }
              generator_version: { type: string }
        enrichment_versions:
          type: array
          description: Every mark the станок left on this term, newest first.
          items:
            type: object
            properties:
              version: { type: string }
              created_at: { type: [string, 'null'], format: date-time }
        enrichment_version: { type: [string, 'null'], description: the newest of the above }
        findings:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              field: { type: [string, 'null'] }
              detail: { type: string }
              generator_version: { type: string }
              created_at: { type: [string, 'null'], format: date-time }
        simulation:
          type: array
          description: Every trainer this build knows, in the enum's own order.
          items: { $ref: '#/components/schemas/ModeSimulation' }
        usable_distractors: { type: integer }
        missing_example:
          type: boolean
          description: 'no pinned example; cured by regeneration, and NOT counted into needs_enrichment'
        needs_enrichment: { type: boolean }
        needs_enrichment_reasons:
          type: array
          items: { type: string, enum: [few_distractors, no_variants] }
        collections:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              type: { type: string }
        topup_command:
          type: string
          description: >
            Ready to paste into a terminal — the panel never runs it. Names EVERY collection holding
            the term, because the станок resolves collections to terms and a shorter list can leave
            the term out of the run entirely.
        topup_hint:
          type: [string, 'null']
          description: >
            Set only when this term is already marked at the current generator version — a plain run
            would skip it («nothing to do»), which reads as the станок being broken.
        current_generator_version: { type: string }
        min_distractors: { type: integer }
        cost_per_term_usd: { type: number }

    PlaygroundProvider:
      type: object
      properties:
        provider: { type: string, description: 'wire name: openai | anthropic | xai | gemini' }
        label: { type: string, description: "the vendor's own spelling, for the picker" }
        models:
          type: array
          description: >
            A closed list. For OpenAI it is exactly the models this project already runs, read from
            the same config keys production reads; a model outside it is refused by name.
          items: { type: string }
        available: { type: boolean }
        reason: { type: string, description: 'empty when available; otherwise names the missing env var' }

    PlaygroundResult:
      type: object
      properties:
        provider: { type: string }
        model: { type: string, description: 'what the vendor says it used, which is not always what was asked for' }
        raw_text: { type: string, description: 'the answer verbatim; empty when the call itself failed' }
        parsed_json:
          type: [object, array, 'null']
          description: >
            The answer decoded, when it decodes. A fenced ```json block is unwrapped first — models
            fence constantly — and the raw text is shown beside it either way.
        parse_error:
          type: [string, 'null']
          description: >
            The model answered but not in JSON. An ordinary result in a prompt sandbox, and NOT the
            same thing as `error`.
        usage:
          type: object
          properties:
            tokens_in: { type: [integer, 'null'] }
            tokens_out: { type: [integer, 'null'] }
            cost_usd:
              type: [string, 'null']
              description: 'priced by the app one pricing table; null = unpriced model, never free'
        latency_ms: { type: integer, description: 'the vendor call alone' }
        error:
          type: [string, 'null']
          description: 'the vendor never answered: auth, credits, timeout, a refusal, an unknown model'

    PlaygroundValidation:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlaygroundValidationRow' }
        kept: { type: integer, description: 'how many rows the станок would have written' }
        total: { type: integer }
        source: { type: string, enum: [term, manual] }
        term_id: { type: [string, 'null'] }
        term_text: { type: string }
        example_sentence: { type: [string, 'null'] }
        existing_count:
          type: integer
          description: 'sentences already in the dedup set — the reason a good row can still be a dupe'
        suppressed_count: { type: integer }
        matched_term_id:
          type: [string, 'null']
          description: 'manual mode only: the term whose dedup set and suppressions were used'
        persisted:
          type: boolean
          description: 'always false — this endpoint writes nothing, ever'

    PlaygroundValidationRow:
      type: object
      properties:
        index: { type: integer }
        sentence: { type: string }
        error_span: { type: string }
        correction: { type: string }
        error_type: { type: string }
        verdict: { type: string, enum: [KEEP, REJECT] }
        gate:
          type: string
          description: >
            Which check decided it — a validator gate, or one of the dry run own refinements of
            `duplicate` (`duplicate_stored`, `duplicate_suppressed`, `duplicate_in_batch`).
          enum: [kept, no_example, empty_sentence, duplicate, duplicate_stored, duplicate_suppressed,
                 duplicate_in_batch, equals_accepted_answer, variant_conflict, unknown_error_type,
                 span_not_found, span_inside_accepted_form, empty_correction,
                 correction_carries_sentence_end, equals_example, no_op_correction,
                 repair_does_not_match_example, cap_reached]
        reason: { type: string, description: 'the same thing as one Russian sentence' }
        error_type_defaulted:
          type: boolean
          description: 'the row had no error_type, so a valid one was substituted before the run'

    TermImpact:
      type: object
      description: The blast radius of touching one term — terms are global.
      properties:
        term_id: { type: string }
        text: { type: string }
        collections_count: { type: integer }
        users_with_progress: { type: integer }
        reviews_count: { type: integer, description: answers already in the append-only log; never deleted }

    CollectionImpact:
      type: object
      properties:
        collection_id: { type: string }
        title: { type: string }
        type: { type: string, enum: [system, shared, custom] }
        owner_id: { type: [string, 'null'] }
        terms_count: { type: integer }
        subscribers: { type: integer, description: active subscriptions that would end }
        learners_with_progress: { type: integer }

    CostByPurpose:
      type: object
      properties:
        scope_id: { type: [string, 'null'], description: 'the collection, when the scope is one' }
        period: { type: [string, 'null'], enum: [day, week, month, all, 'null'] }
        since: { type: [string, 'null'], format: date-time }
        total_usd: { type: number }
        tokens_in: { type: integer }
        tokens_out: { type: integer }
        by_purpose:
          type: array
          items:
            type: object
            properties:
              purpose: { $ref: '#/components/schemas/CallPurpose' }
              tokens_in: { type: integer }
              tokens_out: { type: integer }
              cost_usd: { type: number }
              calls: { type: integer }
        note:
          type: [string, 'null']
          description: Caveats the numbers alone would hide (shared terms, log-priced purposes).

    CallPurpose:
      type: string
      description: Why an outbound call was made. Null on inbound rows and on unlabelled calls.
      enum: [generation, plan, images, enrichment, realtime, recap, example_regen]

    RequestLog:
      type: object
      properties:
        id: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        method: { type: string }
        host: { type: [string, 'null'] }
        path: { type: string }
        service: { type: [string, 'null'] }
        purpose:
          oneOf: [{ $ref: '#/components/schemas/CallPurpose' }, { type: 'null' }]
        collection_id: { type: [string, 'null'] }
        status: { type: [integer, 'null'] }
        duration_ms: { type: [integer, 'null'] }
        user_id: { type: [string, 'null'] }
        occurred_at: { type: [string, 'null'], format: date-time }
        model: { type: [string, 'null'], description: derived from the stored bodies }
        tokens_in: { type: [integer, 'null'], description: derived from the stored response usage block }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [number, 'null'], description: priced from tokens; null for an unpriced model }
        error: { type: [string, 'null'], description: 'transport error, when the call never completed' }

    RequestLogDetail:
      allOf:
        - $ref: '#/components/schemas/RequestLog'
        - type: object
          properties:
            request_bytes: { type: [integer, 'null'] }
            response_bytes: { type: [integer, 'null'] }
            request_headers: { type: [object, 'null'], additionalProperties: true }
            request_body: { type: [object, 'null'], additionalProperties: true }
            response_body: { type: [object, 'null'], additionalProperties: true }

    DialogRow:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        collection_id: { type: string }
        status: { type: string, enum: [active, finished, expired] }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [number, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    DialogDetail:
      allOf:
        - $ref: '#/components/schemas/DialogRow'
        - type: object
          properties:
            summary: { type: [string, 'null'] }
            transcript:
              type: array
              items:
                type: object
                properties:
                  role: { type: string, enum: [user, assistant] }
                  text: { type: string }
                  ts: { type: integer }

    PlanProgress:
      type: object
      required: [current_day, days_total, days_closed, days_opened]
      properties:
        current_day: { type: [integer, 'null'], description: 'the first day not closed; null — all closed' }
        days_total: { type: integer }
        days_closed: { type: integer }
        days_opened: { type: integer }

    LearnerPlanRow:
      type: object
      required: [id, code, status, progress, cost_usd]
      properties:
        id: { type: string }
        code: { type: string }
        title_native: { type: [string, 'null'] }
        title_target: { type: [string, 'null'] }
        status: { type: string }
        event_date: { type: [string, 'null'], format: date }
        created_at: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/PlanProgress' }
        cost_usd: { type: number, description: 'the plan build + every day (lesson, voice, talks, slot judges), from stored bills' }

    PlanHeader:
      type: object
      required: [id, code, user_id, status, stored_status, progress, versions, build_versions, cost_usd, not_stored]
      properties:
        id: { type: string }
        code: { type: string }
        user_id: { type: string }
        user:
          type: [object, 'null']
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: [string, 'null'] }
        title_native: { type: [string, 'null'] }
        title_target: { type: [string, 'null'] }
        goal_text: { type: string }
        target_lang: { type: string }
        native_lang: { type: string }
        level: { type: string }
        event_date: { type: [string, 'null'], format: date }
        status: { type: string, description: 'effective (overdue derived)' }
        stored_status: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        today: { type: string, format: date, description: "the learner's today, in their zone" }
        cover_image_url: { type: [string, 'null'] }
        progress: { $ref: '#/components/schemas/PlanProgress' }
        versions:
          type: object
          properties:
            plan: { type: [string, 'null'] }
            lesson: { type: array, items: { type: string } }
            repair: { type: 'null', description: 'not stored' }
            seam_judge: { type: 'null', description: 'not stored' }
            slot_judge: { type: array, items: { type: string } }
            conversation: { type: array, items: { type: string } }
        models:
          type: object
          properties:
            plan: { type: [string, 'null'] }
            lesson: { type: array, items: { type: string } }
        build_versions:
          type: object
          properties:
            plan: { type: [string, 'null'] }
            lessons: { type: array, items: { type: string } }
        cost_usd: { type: number }
        not_stored: { type: array, items: { type: string } }

    PlanIssues:
      type: object
      required: [data, checks, healthy, not_checked]
      properties:
        data:
          type: array
          items:
            type: object
            required: [check, severity, place_kind, place, message]
            properties:
              check: { type: string }
              title: { type: string }
              severity: { type: string, enum: [error, warning] }
              day: { type: [integer, 'null'] }
              place_kind: { type: string, enum: [day, line, card, turn, talk, call] }
              place: { type: string }
              message: { type: string }
              detail: { type: object, additionalProperties: true }
        checks:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              title: { type: string }
              count: { type: integer }
        healthy: { type: boolean }
        notes:
          type: array
          description: 'grey marks, not findings — e.g. a talk begun before `opens_target` was recorded (23.09)'
          items:
            type: object
            properties:
              check: { type: string }
              day: { type: [integer, 'null'] }
              place_kind: { type: string }
              place: { type: string }
              message: { type: string }
        not_checked: { type: array, items: { type: string } }

    PlanDayRow:
      type: object
      required: [number, type, status, stored_status, cost_usd]
      properties:
        number: { type: integer }
        type: { type: string, enum: [scene, review, rehearsal] }
        scene_id: { type: [string, 'null'] }
        scene_title_native: { type: [string, 'null'] }
        scene_title_target: { type: [string, 'null'] }
        opens_on: { type: [string, 'null'], format: date }
        stored_status: { type: string, enum: [locked, open, in_progress, closed] }
        status: { type: string, description: "as the client is told today: `building` while the next day's lesson is awaited" }
        lesson_status: { type: [string, 'null'], enum: [pending, building, illustrating, ready, failed, null] }
        opened_at: { type: [string, 'null'], format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        cards_total: { type: integer }
        cards_done: { type: integer }
        minutes_spent: { type: integer }
        has_conversation: { type: boolean }
        stages_passed: { type: array, items: { type: object, additionalProperties: true } }
        passed_at: { type: [string, 'null'], format: date-time, description: 'the `day_passed` line of the journal' }
        cost_usd:
          type: object
          properties:
            generation: { type: [number, 'null'] }
            voice: { type: number }
            conversation: { type: number }
            slot_judge: { type: number }
            total: { type: number }

    PlanModelCall:
      type: object
      required: [id, status, model, started_at, certain]
      properties:
        id: { type: string }
        purpose: { type: [string, 'null'] }
        status: { type: string, enum: [started, completed, failed, lost] }
        provider: { type: string }
        model: { type: string }
        answered_model: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        latency_ms: { type: [integer, 'null'] }
        estimated_tokens_in: { type: integer }
        tokens_in: { type: [integer, 'null'] }
        cached_tokens: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [string, 'null'] }
        http_status: { type: [integer, 'null'] }
        error: { type: [string, 'null'] }
        log_id: { type: [string, 'null'] }
        day: { type: [integer, 'null'] }
        window:
          type: object
          properties:
            kind: { type: string, enum: [plan, scene, talk] }
            subject_id: { type: string }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            others: { type: integer }
        certain: { type: boolean }

    PlanPipelineStage:
      type: object
      required: [key, title, status, facts, calls, not_stored]
      properties:
        key: { type: string, enum: [plan, lesson, validator, repair, seam_judge, images, voice, served] }
        title: { type: string }
        status: { type: string }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        duration_ms: { type: [integer, 'null'] }
        facts: { type: object, additionalProperties: true }
        calls: { type: array, items: { $ref: '#/components/schemas/PlanModelCall' } }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        calls_cost_usd: { type: [number, 'null'] }
        not_stored: { type: array, items: { type: string } }

    PlanPipeline:
      type: object
      required: [plan_build, days]
      properties:
        plan_build: { $ref: '#/components/schemas/PlanPipelineStage' }
        days:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              type: { type: string }
              scene_id: { type: [string, 'null'] }
              stages: { type: array, items: { $ref: '#/components/schemas/PlanPipelineStage' } }
              note: { type: string }

    PlanVoiceLine:
      type: object
      required: [ref, kind, speaker, text, gender, rule, status]
      properties:
        ref: { type: string }
        kind: { type: string, enum: [partner_line, learner_line, phrase, filler, word] }
        speaker: { type: string, enum: [partner, learner] }
        text: { type: string }
        gender: { type: string, enum: [female, male] }
        rule: { type: string }
        voice: { type: [object, 'null'], additionalProperties: true }
        status: { type: string, enum: [voiced, phone, none] }
        audio: { type: [object, 'null'], additionalProperties: true }
        voiced_text: { type: [string, 'null'], description: 'the text the vendor was sent, when the request log names it exactly' }
        other_voices: { type: array, items: { type: object, additionalProperties: true } }

    PlanLessonDay:
      type: object
      required: [number, type, voice]
      properties:
        number: { type: integer }
        type: { type: string }
        scene: { type: [object, 'null'], additionalProperties: true }
        lesson: { type: [object, 'null'], additionalProperties: true, description: 'the served lesson, foreign JSON' }
        scenes_covered: { type: array, items: { type: object, additionalProperties: true } }
        returns: { type: array, items: { type: object, additionalProperties: true } }
        voice:
          type: object
          properties:
            lines: { type: array, items: { $ref: '#/components/schemas/PlanVoiceLine' } }
            voiced: { type: integer }
            phone: { type: integer }
            none: { type: integer }

    PlanPassage:
      type: object
      required: [client, days, not_stored]
      properties:
        client:
          type: object
          properties:
            user_agent: { type: [string, 'null'] }
            last_sync_at: { type: [string, 'null'], format: date-time }
            last_path: { type: [string, 'null'] }
            build: { type: 'null', description: 'the client sends no build' }
            device: { type: 'null', description: 'the client sends no device' }
        days:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              type: { type: string }
              status: { type: string }
              opened_at: { type: [string, 'null'], format: date-time }
              closed_at: { type: [string, 'null'], format: date-time }
              summary: { type: object, additionalProperties: true }
              cards:
                type: array
                items:
                  type: object
                  required: [id, stage, kind, attempts]
                  properties:
                    id: { type: string }
                    stage: { type: string }
                    position: { type: integer }
                    kind: { type: string }
                    unit_kind: { type: string }
                    unit_ref: { type: string }
                    source: { type: string, enum: [today, returned] }
                    from_day: { type: [integer, 'null'] }
                    retry_of: { type: [string, 'null'] }
                    expected: { type: [string, 'null'] }
                    answer: { type: [object, 'null'], additionalProperties: true }
                    heard: { type: [string, 'null'] }
                    judge: { type: [object, 'null'], additionalProperties: true }
                    result: { type: [string, 'null'], enum: [passed, hinted, failed, skipped, null] }
                    attempts: { type: integer }
                    answered_at: { type: [string, 'null'], format: date-time }
                    returns: { type: boolean }
                    payload: { type: object, additionalProperties: true }
        not_stored: { type: array, items: { type: string } }

    PlanTalk:
      type: object
      required: [id, day, type, state, targets, turns]
      properties:
        id: { type: string }
        day: { type: integer }
        type: { type: string, enum: [day, rehearsal, review] }
        state: { type: string, enum: [agent_turn, your_turn, ended] }
        ended_reason: { type: [string, 'null'], enum: [natural, limit, declined, replayed, null] }
        ended_by_limit: { type: boolean, description: 'A limit ended the talk — `limit`, or the role''s goodbye when the moves ran out before its scenes were walked (FIX-4 §4); the page marks it «лимит»' }
        ended_label: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        turn_limit: { type: integer }
        hints_enabled: { type: boolean }
        cost_usd: { type: number }
        scenes: { type: array, items: { type: object, additionalProperties: true } }
        checkpoints_done: { type: array, items: { type: string } }
        openers_checked: { type: boolean, description: 'false — begun before `opens_target` was recorded; its openings are not judged' }
        targets:
          type: array
          items:
            type: object
            properties:
              scene_id: { type: string }
              ref: { type: string }
              short_id: { type: [string, 'null'], description: 'What the role knows it by — `T3` (FIX-4 §3)' }
              frame_target: { type: string }
              frame_native: { type: string }
              example_target: { type: [string, 'null'] }
              line_target: { type: string, description: 'The lesson''s own sentence of the construction' }
              status: { type: string, enum: [said, almost, none], description: 'As the judge of the moves wrote it (FIX-4 §2)' }
              said_turn: { type: [integer, 'null'] }
              almost_turn: { type: [integer, 'null'] }
              opened_on_turn: { type: [integer, 'null'] }
        extra_said:
          type: array
          description: '«Ещё вспомнил» — the frames of the talk''s scenes said that are no target (FIX-4 §2)'
          items:
            type: object
            properties:
              id: { type: string }
              frame_target: { type: [string, 'null'] }
              said_turn: { type: integer }
        rejections: { type: integer, description: 'How many things the server refused of the role in the talk (FIX-4 §§3, 6)' }
        turns:
          type: array
          description: >-
            The transcript. Since FIX-4 each turn also has `scene_id`, `scene_event` (start | end | null),
            `phrases_almost`, `extra_said` and `rejections[]` — `{attempt, kind: rejected_answer | dropped_opening, reason,
            model_call_id, detail}`: each refused attempt of the model on that line and each door dropped, with the row of
            `model_calls` it came from. Since FIX-4b a line's `prompt_version` is `conversation_agent.v3.2`, whose answer no
            longer carries `phrases_used` or `checkpoint_done`: a turn's `phrases_used`, `phrases_almost` and
            `checkpoint_done` are the server's (its judge and its border of scenes), as they were since FIX-4; `hint_native`
            of a role line is the lesson's whole sentence of the hint — the client's `hints.sentence`.
          items: { type: object, additionalProperties: true }
        not_stored: { type: array, items: { type: string } }

    PlanMoney:
      type: object
      required: [canon, plan_build, days, totals, not_stored]
      properties:
        canon:
          type: object
          properties:
            day_usd: { type: number }
            generation_usd: { type: number }
            voice_usd: { type: number }
            repair_share: { type: number }
            warn_ratio: { type: number, description: 'a day from this share of the canon is a warning (1.25)' }
            error_ratio: { type: number, description: 'a day from this share of the canon is an error (1.5)' }
            openers_since: { type: string, format: date-time }
        plan_build: { type: object, additionalProperties: true }
        days: { type: array, items: { type: object, additionalProperties: true } }
        totals: { type: object, additionalProperties: true }
        not_stored: { type: array, items: { type: string } }

    PlanCalls:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, source, at, stage, status, is_error]
            properties:
              id: { type: string }
              source: { type: string, enum: [model, voice, judge, client] }
              at: { type: string, format: date-time }
              day: { type: [integer, 'null'] }
              stage: { type: string }
              status: { type: string }
              is_error: { type: boolean }
            additionalProperties: true
        meta:
          type: object
          properties:
            total: { type: integer }
            per_page: { type: integer }
            next_cursor: { type: [string, 'null'] }
            not_stored: { type: array, items: { type: string } }

    Generation:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        prompt: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed] }
        model: { type: [string, 'null'] }
        tokens_in: { type: [integer, 'null'] }
        tokens_out: { type: [integer, 'null'] }
        cost_usd: { type: [number, 'null'] }
        collection_id: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

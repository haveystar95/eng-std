  /plans/{code}/issues:
    get:
      tags: [Plan page]
      summary: «Что не так» — the page's automatic checks
      description: >
        Findings of eleven checks (sound ≠ text — on the answers the client gets, `…/days/{n}/cards` and `…/days/{n}`,
        each line's sound id led to its file and the file's text; voice not by gender, line without sound, day failed,
        scheduled day not ready, build out of line, lost model call, day cost over canon / P2R share,
        passed without summary, talk without openers, talk ended by limit), errors first; `checks` —
        every check with its count; `healthy` — nothing found; `not_checked` — what the checks cannot see.
      parameters: [{ $ref: '#/components/parameters/PlanCode' }, { $ref: '#/components/parameters/PlanDay' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanIssues' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /plans/{code}/days:
    get:
      tags: [Plan page]
      summary: «Обзор» — the plan's days
      parameters: [{ $ref: '#/components/parameters/PlanCode' }, { $ref: '#/components/parameters/PlanDay' }]
      responses:

        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /plans/{code}/pipeline:
    get:
      tags: [Plan page]
      summary: «Конвейер генерации» — the plan's job and each day's stages
      description: >
        Stages `lesson`, `validator`, `repair`, `seam_judge`, `images`, `voice`, `served`. Model calls are
        the journal's calls started inside the plan's / scene's build window under that window's purposes
        (`model_calls` names no plan); `window.others` counts other plans' builds overlapping it, and

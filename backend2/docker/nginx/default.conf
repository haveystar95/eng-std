# ВХОДНАЯ ДВЕРЬ backend2 (доработка PLAN-UI-3, п. 3): ngrok и :8001 приходят сюда.
#
# Копии фото сцен — СТАТИКА: nginx отдаёт файл с диска с вечным кэшем и ETag, запрос не доходит до
# Laravel и не проходит его лимитер (`throttle:120,1`) — маршрут из десяти картинок больше не съедает
# лимит API. Нет файла на диске (план старше копий, копия не скачалась) — один раз в Laravel, он
# скачивает копию, кладёт её сюда и отдаёт; дальше опять статика. Всё остальное — прокси в `app`.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location ~ "^/api/v1/plans/images/(?<scene>[0-9A-HJKMNP-TV-Z]{26})/(?<size>112|448)$" {
        root /srv;
        default_type image/jpeg;
        etag on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files /plan-images/$scene/$size.jpg @laravel;
    }

    location @laravel {
        proxy_pass http://app:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

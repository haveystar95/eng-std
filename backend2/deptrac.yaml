deptrac:
  paths:
    - ./app

  layers:
    # ---- layers, per module -------------------------------------------------
    - name: SharedDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Shared\\Domain\\.*' }]
    - name: SharedInfra
      collectors: [{ type: classLike, value: 'App\\Modules\\Shared\\Infrastructure\\.*' }]

    - name: IdentityDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Identity\\Domain\\.*' }]
    - name: IdentityApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Identity\\Application\\.*' }]
    - name: IdentityInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Identity\\Infrastructure\\.*' }]
    - name: IdentityPresentation
      collectors: [{ type: classLike, value: 'App\\Modules\\Identity\\Presentation\\.*' }]

    - name: VocabularyDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Vocabulary\\Domain\\.*' }]
    - name: VocabularyApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Vocabulary\\Application\\.*' }]
    - name: VocabularyInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Vocabulary\\Infrastructure\\.*' }]
    - name: VocabularyPresentation
      collectors: [{ type: classLike, value: 'App\\Modules\\Vocabulary\\Presentation\\.*' }]

    - name: CollectionsDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Collections\\Domain\\.*' }]
    - name: CollectionsApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Collections\\Application\\.*' }]
    - name: CollectionsInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Collections\\Infrastructure\\.*' }]
    - name: CollectionsPresentation
      collectors: [{ type: classLike, value: 'App\\Modules\\Collections\\Presentation\\.*' }]

    - name: LearningDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Learning\\Domain\\.*' }]
    - name: LearningApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Learning\\Application\\.*' }]
    - name: LearningInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Learning\\Infrastructure\\.*' }]
    - name: LearningPresentation
      collectors: [{ type: classLike, value: 'App\\Modules\\Learning\\Presentation\\.*' }]

    - name: GenerationDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Generation\\Domain\\.*' }]
    - name: GenerationApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Generation\\Application\\.*' }]
    - name: GenerationInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Generation\\Infrastructure\\.*' }]
    - name: GenerationPresentation
      collectors: [{ type: classLike, value: 'App\\Modules\\Generation\\Presentation\\.*' }]

    - name: ObservabilityDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Observability\\Domain\\.*' }]
    - name: ObservabilityApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Observability\\Application\\.*' }]
    - name: ObservabilityInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Observability\\Infrastructure\\.*' }]

    - name: AdminDomain
      collectors: [{ type: classLike, value: 'App\\Modules\\Admin\\Domain\\.*' }]
    - name: AdminApplication
      collectors: [{ type: classLike, value: 'App\\Modules\\Admin\\Application\\.*' }]
    - name: AdminInfrastructure
      collectors: [{ type: classLike, value: 'App\\Modules\\Admin\\Infrastructure\\.*' }]
    - name: AdminPresentation
      collectors: [{ type: classLike, value: 'App\\Modules\\Admin\\Presentation\\.*' }]

    - name: Framework
      collectors:
        - { type: classLike, value: 'Illuminate\\.*' }
        - { type: classLike, value: 'Laravel\\.*' }
        - { type: classLike, value: 'Symfony\\.*' }
        - { type: classLike, value: 'Carbon\\.*' }

  ruleset:
    # Domain layers depend on nothing but Shared kernel. NOT on the framework.
    SharedDomain: ~
    IdentityDomain: [SharedDomain]
    VocabularyDomain: [SharedDomain]
    CollectionsDomain: [SharedDomain]
    LearningDomain: [SharedDomain]
    GenerationDomain: [SharedDomain]

    # Application depends on its own Domain, Shared, and other modules' Application only.
    IdentityApplication: [IdentityDomain, SharedDomain]
    VocabularyApplication: [VocabularyDomain, SharedDomain]
    # Collections reads the user's tier (Identity) to gate premium store content.
    CollectionsApplication: [CollectionsDomain, SharedDomain, VocabularyApplication, IdentityApplication]
    LearningApplication:
      [LearningDomain, SharedDomain, VocabularyApplication, CollectionsApplication]
    # Generation reads the user's tier (Identity) for the daily quota limit, and — for the
    # practice-dialog lesson — the learner's due/started state (Learning) to prioritise which
    # collection terms become the dialog's target words. Learning does not depend back on
    # Generation, so this edge adds no cycle.
    GenerationApplication:
      [GenerationDomain, SharedDomain, VocabularyApplication, CollectionsApplication, IdentityApplication, LearningApplication]

    # Infrastructure may use the framework and its own module's inner layers.
    SharedInfra: [SharedDomain, Framework]
    # Account deletion fans out to every module's own Application eraser (never a raw cross-table
    # query). This edge lives in Infrastructure, not Application, so no module-graph cycle forms
    # with Collections/Generation Application → Identity Application.
    IdentityInfrastructure:
      [IdentityApplication, IdentityDomain, SharedDomain, SharedInfra, Framework,
       CollectionsApplication, LearningApplication, GenerationApplication, VocabularyApplication, ObservabilityApplication]
    VocabularyInfrastructure: [VocabularyApplication, VocabularyDomain, SharedDomain, SharedInfra, Framework]
    CollectionsInfrastructure: [CollectionsApplication, CollectionsDomain, SharedDomain, SharedInfra, Framework]
    LearningInfrastructure: [LearningApplication, LearningDomain, SharedDomain, SharedInfra, Framework, IdentityApplication]
    # Generation fulfils Vocabulary's DispatchesTermEnrichment port (the enrich-term dispatcher).
    GenerationInfrastructure: [GenerationApplication, GenerationDomain, SharedDomain, SharedInfra, Framework, VocabularyApplication]

    # Observability: a thin, cross-cutting technical module (no Presentation layer).
    ObservabilityDomain: [SharedDomain]
    ObservabilityApplication: [ObservabilityDomain, SharedDomain]
    ObservabilityInfrastructure: [ObservabilityApplication, ObservabilityDomain, SharedDomain, SharedInfra, Framework]

    # Admin: a back-office read/report surface. Thin domain. Its Application reaches Learning (the
    # day-plan simulator reuses GetDueTerms + ExerciseSelector via GetDayPlan, and mastered/stats via
    # GetUserStats) and Identity (the tier mutation goes through UserTierWriter — the tier's owner).
    # Its Infrastructure reads other modules' read tables directly as reporting projections (like
    # Observability, it imports no other module's classes).
    AdminDomain: [SharedDomain]
    AdminApplication: [AdminDomain, SharedDomain, IdentityApplication, LearningApplication]
    AdminInfrastructure: [AdminApplication, AdminDomain, SharedDomain, SharedInfra, Framework]
    AdminPresentation: [AdminApplication, AdminDomain, SharedDomain, Framework]

    # Presentation may use the framework, its own Application/Domain — never Infrastructure.
    # /me aggregates cross-module facts about the user; the generation quota (to grey the create
    # button) comes from Generation's Application — a legal cross-module read via Application.
    IdentityPresentation: [IdentityApplication, IdentityDomain, SharedDomain, GenerationApplication, Framework]
    VocabularyPresentation: [VocabularyApplication, VocabularyDomain, SharedDomain, Framework]
    CollectionsPresentation: [CollectionsApplication, CollectionsDomain, SharedDomain, Framework]
    LearningPresentation: [LearningApplication, LearningDomain, SharedDomain, Framework]
    GenerationPresentation: [GenerationApplication, GenerationDomain, SharedDomain, Framework]

# Adding a module = add its four layers above and one ruleset entry.
# If a rule here starts blocking you regularly, change the rule deliberately —
# do not add a skip_violations entry to make the build green.
